<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Joins  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">SQL Server  ·  S01  ·  A join combines rows from two tables on a key. INNER keeps matches only. LEFT keeps every left row and nulls o</text><rect x="16" y="78" width="747" height="303" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="16" y="78" width="7" height="303" rx="0" fill="#2563eb"/><circle cx="44" cy="100" r="12" fill="#2563eb"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What a join actually does</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">ON the key; watch multiplication.</tspan></text><rect x="30" y="146" width="324" height="89" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="192" y="195" fill="#1e40af" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Table A</text><rect x="424" y="146" width="324" height="89" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="587" y="195" fill="#166534" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Table B</text><line x1="354" y1="191" x2="424" y2="191" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/><text x="390" y="181" fill="#1e3a5f" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">ON key</text><rect x="30" y="259" width="719" height="106" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="42" y="283" fill="#854d0e" font-size="12" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">INNER: matches only    LEFT: keep A, NULL on B</text><text x="42" y="307" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="42" dy="0">Draws one reporting query from the project and names the join type</tspan></text><rect x="773" y="78" width="747" height="303" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="773" y="78" width="7" height="303" rx="0" fill="#16a34a"/><circle cx="801" cy="100" r="12" fill="#16a34a"/><text x="801" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="819" y="105" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The trap vs the fix</text><text x="789" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Preferred form vs the interview trap.</tspan></text><rect x="787" y="146" width="354" height="223" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="795" y="164" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  WHERE on the right of </text><text x="795" y="186" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="795" dy="0">LEFT JOIN Shipment s ON s.OrderId = o.Id WHERE</tspan><tspan x="795" dy="13">s.Status = 'Shipped'</tspan></text><rect x="1152" y="146" width="354" height="223" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="1160" y="164" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="1160" y="186" fill="#14532d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1160" dy="0">LEFT JOIN Shipment s ON s.OrderId = o.Id AND</tspan><tspan x="1160" dy="13">s.Status = 'Shipped'</tspan></text><rect x="16" y="391" width="747" height="303" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="391" width="7" height="303" rx="0" fill="#4f46e5"/><circle cx="44" cy="413" r="12" fill="#4f46e5"/><text x="44" y="417" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="62" y="418" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice, C#, remember</text><text x="32" y="433" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Recite practice, then the C# cousin.</tspan></text><rect x="30" y="459" width="234" height="223" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="38" y="475" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><text x="38" y="493" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• INNER JOIN</text><text x="44" y="507" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Only rows that match o</text><text x="38" y="520" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• LEFT JOIN</text><text x="44" y="534" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">All orders, even with </text><text x="38" y="547" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Multiplication</text><text x="44" y="561" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Joining to a child wit</text><text x="38" y="574" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Filter trap</text><text x="44" y="588" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Putting a right-table </text><rect x="272" y="459" width="234" height="223" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="280" y="475" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice</text><text x="280" y="493" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Explain INNER JOIN</text><text x="280" y="507" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Compare LEFT JOIN </text><text x="280" y="521" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Answer the Intervi</text><rect x="515" y="459" width="234" height="223" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="523" y="475" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">C# map</text><text x="523" y="493" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• JOIN</text><text x="529" y="507" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">LINQ Join / Include</text><text x="523" y="520" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Stored proc</text><text x="529" y="534" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">FromSqlInterpolated</text><text x="523" y="547" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Index / plan</text><text x="529" y="561" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">covering index + actua</text><text x="523" y="574" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• BEGIN TRAN</text><text x="529" y="588" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">IDbContextTransaction</text><rect x="773" y="391" width="747" height="303" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="773" y="391" width="7" height="303" rx="0" fill="#7c3aed"/><circle cx="801" cy="413" r="12" fill="#7c3aed"/><text x="801" y="417" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="819" y="418" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Good practice</text><text x="789" y="433" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Do / don't you can recite.</tspan></text><text x="787" y="471" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do</text><text x="787" y="491" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Explain INNER JOIN with a project example.</text><text x="787" y="513" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Compare LEFT JOIN with an alternative.</text><text x="787" y="535" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Answer the Interview 5 for: Draws one reporting </text><text x="787" y="565" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><text x="787" y="587" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="787" dy="0">✗ WHERE on the right of a LEFT JOIN — LEFT JOIN Shipment s ON s.OrderId = o.Id WHERE s.Status =</tspan><tspan x="787" dy="13">'Shipped'</tspan></text><rect x="16" y="705" width="747" height="303" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="16" y="705" width="7" height="303" rx="0" fill="#ea580c"/><circle cx="44" cy="727" r="12" fill="#ea580c"/><text x="44" y="731" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="62" y="732" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Inside the system</text><text x="32" y="747" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Top to bottom, then the hand-off.</tspan></text><rect x="30" y="773" width="719" height="51" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="42" y="794" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">INNER JOIN</text><text x="42" y="810" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Only rows that match on both sides — active devi</text><text x="390" y="829" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="30" y="830" width="719" height="51" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="42" y="852" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">LEFT JOIN</text><text x="42" y="867" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">All orders, even with no shipment yet.</text><text x="390" y="886" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="30" y="887" width="719" height="51" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="42" y="909" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Multiplication</text><text x="42" y="924" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Joining to a child with many rows duplicates the</text><text x="390" y="944" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="30" y="945" width="719" height="51" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="42" y="966" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Filter trap</text><text x="42" y="982" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Putting a right-table filter in WHERE after LEFT</text><rect x="773" y="705" width="747" height="303" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="773" y="705" width="7" height="303" rx="0" fill="#dc2626"/><circle cx="801" cy="727" r="12" fill="#dc2626"/><text x="801" y="731" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="819" y="732" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What contains what</text><text x="789" y="747" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Outer box owns the inner ones.</tspan></text><rect x="787" y="773" width="719" height="223" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="797" y="791" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Table A</text><rect x="815" y="801" width="663" height="168" rx="10" fill="#bfdbfe" stroke="#1e40af" stroke-width="1.5"/><text x="825" y="819" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ON key</text><rect x="843" y="828" width="607" height="112" rx="10" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/><text x="853" y="846" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">INNER or LEFT</text><rect x="871" y="856" width="552" height="56" rx="10" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/><text x="881" y="874" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Result set</text>
</svg>
