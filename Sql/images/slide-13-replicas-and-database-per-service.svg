amily="Segoe UI,Arial,sans-serif">Read replica</text><text x="414" y="917" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="414" dy="0">Scale reporting; accept replication delay.</tspan></text><rect x="773" y="705" width="747" height="303" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="773" y="705" width="7" height="303" rx="0" fill="#dc2626"/><circle cx="801" cy="727" r="12" fill="#dc2626"/><text x="801" y="731" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="819" y="732" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Compare — pick with a reason</text><text x="789" y="747" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Say the criterion, then the choice.</tspan></text><rect x="787" y="773" width="719" height="28" rx="6" fill="#1e3a5f"/><text x="793" y="792" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Idea</text><text x="1152" y="792" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><rect x="787" y="801" width="719" height="28" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="793" y="820" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Primary / secondary</text><text x="1152" y="820" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Failover pair; secon</text><rect x="787" y="829" width="719" height="28" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/><text x="793" y="848" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Read replica</text><text x="1152" y="848" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Scale reporting; acc</text><rect x="787" y="857" width="719" height="28" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="793" y="876" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">DB per service</text><text x="1152" y="876" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Each service owns it</text><rect x="787" y="885" width="719" height="28" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/><text x="793" y="904" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Shared DB</text><text x="1152" y="904" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Two services writing</text>
