<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#334155"/><text x="28" y="36" fill="#334155" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SQL Server  ·  S02  ·  code callout</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Subquery vs CTE</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">A subquery is a query inside another. A CTE (WITH name AS (...)) names that result so the outer query reads like steps. EXISTS often beats IN +</tspan><tspan x="28" dy="17">DISTINCT for existence checks.</tspan></text><rect x="28" y="140" width="780" height="760" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="48" y="178" fill="#334155" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Sample</text><text x="48" y="220" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">WITH LatestBeat AS (</text><text x="48" y="248" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  SELECT DeviceId, MAX(SeenAt) AS SeenAt</text><text x="48" y="276" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  FROM dbo.Heartbeat</text><text x="48" y="304" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  GROUP BY DeviceId</text><text x="48" y="332" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">)</text><text x="48" y="360" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">SELECT d.Id, b.SeenAt</text><text x="48" y="388" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">FROM dbo.Device d</text><text x="48" y="416" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">LEFT JOIN LatestBeat b ON b.DeviceId = d.Id;</text><rect x="828" y="140" width="680" height="175" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><circle cx="858" cy="176" r="18" fill="#334155"/><text x="858" y="182" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="888" y="182" fill="#1e40af" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Subquery</text><text x="848" y="212" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="848" dy="0">Scalar or IN list — fine when short.</tspan></text><rect x="828" y="330" width="680" height="175" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="2"/><circle cx="858" cy="366" r="18" fill="#334155"/><text x="858" y="372" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="888" y="372" fill="#166534" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">CTE</text><text x="848" y="402" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="848" dy="0">Reusable named step, easier to test and to add a</tspan><tspan x="848" dy="17">second consumer in the same batch.</tspan></text><rect x="828" y="520" width="680" height="175" rx="14" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><circle cx="858" cy="556" r="18" fill="#334155"/><text x="858" y="562" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="888" y="562" fill="#9a3412" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">EXISTS</text><text x="848" y="592" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="848" dy="0">Stop at the first match — good for “has any</tspan><tspan x="848" dy="17">payment”.</tspan></text><rect x="828" y="710" width="680" height="175" rx="14" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><circle cx="858" cy="746" r="18" fill="#334155"/><text x="858" y="752" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="888" y="752" fill="#854d0e" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Not magic</text><text x="848" y="782" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="848" dy="0">A CTE is not automatically faster. The optimizer</tspan><tspan x="848" dy="17">may treat it like a subquery.</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Rewrites one nested subquery as a named CTE they could explain</tspan></text>
</svg>
