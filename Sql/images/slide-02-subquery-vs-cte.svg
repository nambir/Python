  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Subquery vs CTE  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">SQL Server  ·  S02  ·  A subquery is a query inside another. A CTE (WITH name AS (...)) names that result so the outer query reads li</text><rect x="16" y="78" width="1504" height="210" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="16" y="78" width="7" height="210" rx="0" fill="#16a34a"/><circle cx="44" cy="100" r="12" fill="#16a34a"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Compare — pick with a reason</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Say the criterion, then the choice.</tspan></text><rect x="30" y="146" width="1476" height="24" rx="6" fill="#1e3a5f"/><text x="36" y="163" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Idea</text><text x="774" y="163" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><rect x="30" y="170" width="1476" height="24" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="187" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Subquery</text><text x="774" y="187" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Scalar or IN list — </text><rect x="30" y="195" width="1476" height="24" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="212" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">CTE</text><text x="774" y="212" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Reusable named step,</text><rect x="30" y="219" width="1476" height="24" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="236" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">EXISTS</text><text x="774" y="236" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Stop at the first ma</text><rect x="30" y="244" width="1476" height="24" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="261" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Not magic</text><text x="774" y="261" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">A CTE is not automat</text><rect x="16" y="298" width="495" height="355" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="298" width="7" height="355" rx="0" fill="#4f46e5"/><circle cx="44" cy="320" r="12" fill="#4f46e5"/><text x="44" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="62" y="325" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Numbers / interview drill</text><text x="32" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">What / where / why / how.</tspan></text><rect x="30" y="366" width="229" height="134" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="40" y="384" fill="#1e40af" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">1</text><text x="40" y="404" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Subquery</text><text x="40" y="424" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">Scalar or IN list — fine</tspan><tspan x="40" dy="12">when short.</tspan></text><rect x="267" y="366" width="229" height="134" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="277" y="384" fill="#166534" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">2</text><text x="277" y="404" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">CTE</text><text x="277" y="424" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="277" dy="0">Reusable named step, easier</tspan><tspan x="277" dy="12">to test and to add a second</tspan><tspan x="277" dy="12">consumer in the same batch.</tspan></text><rect x="30" y="508" width="229" height="134" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="40" y="526" fill="#9a3412" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">3</text><text x="40" y="546" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">EXISTS</text><text x="40" y="566" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">Stop at the first match —</tspan><tspan x="40" dy="12">good for “has any payment”.</tspan></text><rect x="267" y="508" width="229" height="134" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="277" y="526" fill="#854d0e" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">4</text><text x="277" y="546" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Not magic</text><text x="277" y="566" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="277" dy="0">A CTE is not automatically</tspan><tspan x="277" dy="12">faster. The optimizer may</tspan><tspan x="277" dy="12">treat it like a subquery.</tspan></text><rect x="521" y="298" width="495" height="355" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="521" y="298" width="7" height="355" rx="0" fill="#7c3aed"/><circle cx="549" cy="320" r="12" fill="#7c3aed"/><text x="549" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="567" y="325" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When A vs when B</text><text x="537" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Pick a path with a project example.</tspan></text><polygon points="768,374 838,414 768,454 698,414" fill="#fef9c3" stroke="#b45309" stroke-width="1.8"/><text x="768" y="418" fill="#b45309" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Which?</text><rect x="535" y="466" width="224" height="167" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><rect x="777" y="466" width="224" height="167" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="545" y="488" fill="#1e40af" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Subquery</text><text x="545" y="510" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="545" dy="0">Fine when short and local.</tspan></text><text x="787" y="488" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">CTE</text><text x="787" y="510" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="787" dy="0">Named step you can read and</tspan><tspan x="787" dy="13">reuse.</tspan></text><rect x="1025" y="298" width="495" height="355" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="1025" y="298" width="7" height="355" rx="0" fill="#ea580c"/><circle cx="1053" cy="320" r="12" fill="#ea580c"/><text x="1053" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="1071" y="325" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The scale you must name</text><text x="1041" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Set one level; everything below it goes quiet — or name the</tspan><tspan x="1041" dy="13">lifetime.</tspan></text><rect x="1039" y="366" width="467" height="63" rx="8" fill="#2563eb"/><text x="1051" y="394" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Subquery</text><text x="1051" y="415" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Scalar or IN list — fine when short.</text><rect x="1039" y="437" width="429" height="63" rx="8" fill="#16a34a"/><text x="1051" y="465" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">CTE</text><text x="1051" y="486" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Reusable named step, easier to test and </text><rect x="1039" y="508" width="392" height="63" rx="8" fill="#4f46e5"/><text x="1051" y="536" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">EXISTS</text><text x="1051" y="556" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Stop at the first match — good for “has </text><rect x="1039" y="578" width="355" height="63" rx="8" fill="#7c3aed"/><text x="1051" y="606" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Not magic</text><text x="1051" y="627" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">A CTE is not automatically faster. The o</text><rect x="16" y="663" width="747" height="345" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="663" width="7" height="345" rx="0" fill="#dc2626"/><circle cx="44" cy="685" r="12" fill="#dc2626"/><text x="44" y="689" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="62" y="690" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Minimal setup / sample</text><text x="32" y="705" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Configure once; point at a real line.</tspan></text><rect x="30" y="731" width="719" height="229" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="40" y="749" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">WITH LatestBeat AS (</text><text x="40" y="765" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  SELECT DeviceId, MAX(SeenAt) AS SeenAt</text><text x="40" y="781" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  FROM dbo.Heartbeat</text><text x="40" y="797" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  GROUP BY DeviceId</text><text x="40" y="813" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">)</text><text x="40" y="829" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">SELECT d.Id, b.SeenAt</text><text x="40" y="845" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">FROM dbo.Device d</text><text x="40" y="861" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">LEFT JOIN LatestBeat b ON b.DeviceId = d.Id;</text><text x="34" y="984" fill="#166534" font-size="11" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Named step, then join.</text><rect x="773" y="663" width="747" height="345" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="773" y="663" width="7" height="345" rx="0" fill="#2563eb"/><circle cx="801" cy="685" r="12" fill="#2563eb"/><text x="801" y="689" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="819" y="690" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How the pieces connect</text><text x="789" y="705" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Name each box, then the hand-off.</tspan></text><rect x="787" y="731" width="172" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="873" y="759" fill="#1e40af" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="873" dy="0">Nested subquery</tspan></text><line x1="959" y1="763" x2="969" y2="763" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="969" y="731" width="172" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="1055" y="759" fill="#166534" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="1055" dy="0">Name CTE</tspan></text><line x1="1142" y1="763" x2="1152" y2="763" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1152" y="731" width="172" height="64" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="1238" y="759" fill="#9a3412" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="1238" dy="0">Join the CTE</tspan></text><line x1="1324" y1="763" x2="1334" y2="763" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1334" y="731" width="172" height="64" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="1420" y="759" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="1420" dy="0">Read as steps</tspan></text><text x="787" y="811" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="787" dy="0">Name each box, then the hand-off. Rewrites one nested subquery as a named CTE they could explain</tspan></text>
</svg>
