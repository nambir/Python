eight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Answer the Intervi</text><rect x="1356" y="146" width="150" height="380" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="1364" y="162" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">C# map</text><text x="1364" y="180" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• JOIN</text><text x="1370" y="194" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">LINQ Join / Include</text><text x="1364" y="207" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Stored proc</text><text x="1370" y="221" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">FromSqlInterpolated</text><text x="1364" y="234" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Index / plan</text><text x="1370" y="248" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">covering index + actua</text><text x="1364" y="261" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• BEGIN TRAN</text><text x="1370" y="275" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">IDbContextTransaction</text><rect x="16" y="548" width="495" height="460" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="548" width="7" height="460" rx="0" fill="#dc2626"/><circle cx="44" cy="570" r="12" fill="#dc2626"/><text x="44" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="62" y="575" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Good practice</text><text x="32" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Do / don't you can recite.</tspan></text><text x="30" y="628" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do</text><text x="30" y="648" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Explain #temp with a project example.</text><text x="30" y="670" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Compare @table var with an alternative.</text><text x="30" y="692" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Answer the Interview 5 for: Chooses #temp for a </text><text x="30" y="722" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><text x="30" y="744" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">✗ 100k rows in a table variable — DECLARE @x TABLE (Id int);</tspan><tspan x="30" dy="13">INSERT @x SELECT Id FROM Big;</tspan></text><rect x="521" y="548" width="495" height="460" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="521" y="548" width="7" height="460" rx="0" fill="#2563eb"/><circle cx="549" cy="570" r="12" fill="#2563eb"/><text x="549" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="567" y="575" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Inside the system</text><text x="537" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Top to bottom, then the hand-off.</tspan></text><rect x="535" y="616" width="467" height="90" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="547" y="654" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">#temp</text><text x="547" y="681" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Better for larger intermediate results, indexes,</text><text x="768" y="712" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="535" y="712" width="467" height="90" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="547" y="751" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">@table var</text><text x="547" y="778" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Good for a handful of ids; can underestimate row</text><text x="768" y="808" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="535" y="809" width="467" height="90" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="547" y="847" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Scope</text><text x="547" y="874" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">#temp is session/batch; ##global is rare and dan</text><text x="768" y="904" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="535" y="906" width="467" height="90" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="547" y="944" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interview</text><text x="547" y="971" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">If a slow SP stuffed 100k rows in a table variab</text><rect x="1025" y="548" width="495" height="460" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="1025" y="548" width="7" height="460" rx="0" fill="#16a34a"/><circle cx="1053" cy="570" r="12" fill="#16a34a"/><text x="1053" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="1071" y="575" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What contains what</text><text x="1041" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Outer box owns the inner ones.</tspan></text><rect x="1039" y="616" width="467" height="380" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="1049" y="634" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">#temp (stats)</text><rect x="1075" y="652" width="395" height="308" rx="10" fill="#bfdbfe" stroke="#1e40af" stroke-width="1.5"/><text x="1085" y="670" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">table var</text><rect x="1111" y="688" width="323" height="236" rx="10" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/><text x="1121" y="706" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Recompile?</text><rect x="1147" y="724" width="251" height="164" rx="10" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/><text x="1157" y="742" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Pick for cardinality</text>
