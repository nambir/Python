<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#1e40af"/><text x="28" y="36" fill="#1e40af" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SQL Server  ·  S06  ·  matrix</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Indexes: Clustered, Nonclustered, PK</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">A clustered index is the table order (one per table). A nonclustered index is a separate B-tree with pointers. A primary key is a constraint; by</tspan><tspan x="28" dy="17">default it is clustered, but it does not have to be.</tspan></text><rect x="28" y="150" width="1480" height="70" rx="8" fill="#1e3a5f"/><text x="38" y="174" fill="#fff" font-size="12" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Idea</text><text x="778" y="174" fill="#fff" font-size="12" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><rect x="28" y="220" width="1480" height="70" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="38" y="244" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Clustered</text><text x="778" y="244" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Choose a key that grows and is u</text><rect x="28" y="290" width="1480" height="70" rx="0" fill="#eff6ff" stroke="#e2e8f0" stroke-width="1"/><text x="38" y="314" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Nonclustered</text><text x="778" y="314" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Supports filters/joins that are </text><rect x="28" y="360" width="1480" height="70" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="38" y="384" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">PK vs clustered</text><text x="778" y="384" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">PK = uniqueness. Clustered = sto</text><rect x="28" y="430" width="1480" height="70" rx="0" fill="#eff6ff" stroke="#e2e8f0" stroke-width="1"/><text x="38" y="454" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Hurt</text><text x="778" y="454" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Every write maintains indexes. W</text><rect x="28" y="620" width="733" height="280" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="42" y="646" fill="#b91c1c" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Index every VARCHAR</text><text x="42" y="670" fill="#7f1d1d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="42" dy="0">CREATE INDEX IX_Notes ON</tspan><tspan x="42" dy="16">T(Notes);</tspan></text><rect x="775" y="620" width="733" height="280" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="789" y="646" fill="#166534" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="789" y="670" fill="#14532d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Index selective keys; consider</tspan><tspan x="789" dy="16">full-text for long text; watch</tspan><tspan x="789" dy="16">write cost.</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">States whether the PK is clustered in their DB and why a second index exists</tspan></text>
</svg>
