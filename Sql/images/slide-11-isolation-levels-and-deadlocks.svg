<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Isolation Levels and Deadlocks  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">SQL Server  ·  S11  ·  Isolation decides what you see under concurrency. Higher isolation reduces anomalies and can increase blocking</text><rect x="16" y="78" width="1504" height="210" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="16" y="78" width="7" height="210" rx="0" fill="#ea580c"/><circle cx="44" cy="100" r="12" fill="#ea580c"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The scale you must name</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Set one level; everything below it goes quiet — or name the lifetime.</tspan></text><rect x="30" y="146" width="1476" height="26" rx="8" fill="#fecaca"/><text x="42" y="158" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Read uncommitted</text><text x="42" y="167" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">dirty reads possible</text><rect x="30" y="180" width="1358" height="26" rx="8" fill="#fdba74"/><text x="42" y="192" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Read committed</text><text x="42" y="201" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SQL Server default</text><rect x="30" y="215" width="1240" height="26" rx="8" fill="#86efac"/><text x="42" y="227" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Repeatable read</text><text x="42" y="236" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">row locks hold</text><rect x="30" y="250" width="1122" height="26" rx="8" fill="#3b82f6"/><text x="42" y="261" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Serializable / SI</text><text x="42" y="270" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">narrower anomalies</text><rect x="16" y="298" width="495" height="355" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="298" width="7" height="355" rx="0" fill="#dc2626"/><circle cx="44" cy="320" r="12" fill="#dc2626"/><text x="44" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="62" y="325" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How rows combine</text><text x="32" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">ON the key; watch multiplication.</tspan></text><rect x="30" y="366" width="198" height="90" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="129" y="415" fill="#1e40af" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Table A</text><rect x="298" y="366" width="198" height="90" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="398" y="415" fill="#166534" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Table B</text><line x1="228" y1="411" x2="298" y2="411" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/><text x="263" y="401" fill="#1e3a5f" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">ON key</text><rect x="30" y="480" width="467" height="157" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="42" y="504" fill="#854d0e" font-size="12" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">INNER: matches only    LEFT: keep A, NULL on B</text><text x="42" y="528" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="42" dy="0">Picks an isolation level for a report vs a wallet debit</tspan></text><rect x="521" y="298" width="495" height="355" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="521" y="298" width="7" height="355" rx="0" fill="#2563eb"/><circle cx="549" cy="320" r="12" fill="#2563eb"/><text x="549" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="567" y="325" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Numbers / interview drill</text><text x="537" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">What / where / why / how.</tspan></text><rect x="535" y="366" width="229" height="134" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="545" y="384" fill="#1e40af" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">1</text><text x="545" y="404" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">READ COMMITTED</text><text x="545" y="424" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="545" dy="0">Default; can still block.</tspan><tspan x="545" dy="12">Good starting point.</tspan></text><rect x="772" y="366" width="229" height="134" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="782" y="384" fill="#166534" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">2</text><text x="782" y="404" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SNAPSHOT / RCSI</text><text x="782" y="424" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="782" dy="0">Readers don’t block writers</tspan><tspan x="782" dy="12">as much; tempdb version</tspan><tspan x="782" dy="12">store cost.</tspan></text><rect x="535" y="508" width="229" height="134" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="545" y="526" fill="#9a3412" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">3</text><text x="545" y="546" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SERIALIZABLE</text><text x="545" y="566" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="545" dy="0">Range locks; rare for OLTP</tspan><tspan x="545" dy="12">APIs.</tspan></text><rect x="772" y="508" width="229" height="134" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="782" y="526" fill="#854d0e" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">4</text><text x="782" y="546" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Deadlock</text><text x="782" y="566" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="782" dy="0">Capture graph, make access</tspan><tspan x="782" dy="12">order consistent, keep</tspan><tspan x="782" dy="12">transactions short, index to</tspan></text><rect x="1025" y="298" width="495" height="355" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="1025" y="298" width="7" height="355" rx="0" fill="#16a34a"/><circle cx="1053" cy="320" r="12" fill="#16a34a"/><text x="1053" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="1071" y="325" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When A vs when B</text><text x="1041" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Pick a path with a project example.</tspan></text><polygon points="1273,374 1343,414 1273,454 1203,414" fill="#fef9c3" stroke="#b45309" stroke-width="1.8"/><text x="1273" y="418" fill="#b45309" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Which?</text><rect x="1039" y="466" width="224" height="167" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><rect x="1282" y="466" width="224" height="167" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="1049" y="488" fill="#1e40af" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">READ COMMITTED</text><text x="1049" y="510" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1049" dy="0">Default; can still block.</tspan><tspan x="1049" dy="13">Good starting point.</tspan></text><text x="1292" y="488" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SNAPSHOT / RCSI</text><text x="1292" y="510" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1292" dy="0">Readers don’t block writers</tspan><tspan x="1292" dy="13">as much; tempdb version</tspan><tspan x="1292" dy="13">store cost.</tspan></text><rect x="16" y="663" width="747" height="345" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="663" width="7" height="345" rx="0" fill="#4f46e5"/><circle cx="44" cy="685" r="12" fill="#4f46e5"/><text x="44" y="689" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="62" y="690" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Compare — pick with a reason</text><text x="32" y="705" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Say the criterion, then the choice.</tspan></text><rect x="30" y="731" width="719" height="28" rx="6" fill="#1e3a5f"/><text x="36" y="751" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Idea</text><text x="396" y="751" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><rect x="30" y="759" width="719" height="28" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="779" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">READ COMMITTED</text><text x="396" y="779" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Default; can still b</text><rect x="30" y="787" width="719" height="28" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="807" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SNAPSHOT / RCSI</text><text x="396" y="807" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Readers don’t block </text><rect x="30" y="815" width="719" height="28" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="835" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SERIALIZABLE</text><text x="396" y="835" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Range locks; rare fo</text><rect x="30" y="843" width="719" height="28" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="863" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Deadlock</text><text x="396" y="863" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Capture graph, make </text><rect x="773" y="663" width="747" height="345" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="773" y="663" width="7" height="345" rx="0" fill="#7c3aed"/><circle cx="801" cy="685" r="12" fill="#7c3aed"/><text x="801" y="689" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="819" y="690" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Minimal setup / sample</text><text x="789" y="705" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Configure once; point at a real line.</tspan></text><rect x="787" y="731" width="719" height="229" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="797" y="749" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">SET TRANSACTION ISOLATION LEVEL READ COMMITTED;</text><text x="797" y="765" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">BEGIN TRAN;</text><text x="797" y="781" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">UPDATE dbo.Wallet SET Balance -= @amt WHERE Id = @id;</text><text x="797" y="797" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">COMMIT;</text><text x="791" y="984" fill="#166534" font-size="11" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Short transaction; NOLOCK is not a performance strategy.</text>
