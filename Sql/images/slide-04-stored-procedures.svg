f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">TRY/CATCH</text><text x="799" y="869" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">CATCH, rollback, RAISERROR/THROW with a </text><rect x="787" y="888" width="604" height="50" rx="8" fill="#4f46e5"/><text x="799" y="911" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">NOCOUNT ON</text><text x="799" y="927" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Stops extra DONE_IN_PROC traffic that ca</text><rect x="787" y="946" width="546" height="50" rx="8" fill="#7c3aed"/><text x="799" y="969" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">EF</text><text x="799" y="985" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">FromSqlInterpolated / ExecuteSql — still</text>
