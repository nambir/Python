<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Stored Procedures  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">SQL Server  ·  S04  ·  A stored procedure is a named batch on SQL Server. Use parameters — never concatenate user input. TRY/CATCH + </text><rect x="16" y="78" width="747" height="303" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="16" y="78" width="7" height="303" rx="0" fill="#7c3aed"/><circle cx="44" cy="100" r="12" fill="#7c3aed"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Minimal setup / sample</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Configure once; point at a real line.</tspan></text><rect x="30" y="146" width="719" height="187" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="40" y="164" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">CREATE PROCEDURE dbo.GetOpenOrders</text><text x="40" y="180" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  @CustomerId uniqueidentifier</text><text x="40" y="196" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">AS</text><text x="40" y="212" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">BEGIN</text><text x="40" y="228" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  SET NOCOUNT ON;</text><text x="40" y="244" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  SELECT o.Id, o.Status</text><text x="40" y="260" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  FROM dbo.Orders o</text><text x="40" y="276" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  WHERE o.CustomerId = @CustomerId AND o.Status = N'Open</text><text x="34" y="357" fill="#166534" font-size="11" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Parameterized SP, NOCOUNT ON.</text><rect x="773" y="78" width="747" height="303" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="773" y="78" width="7" height="303" rx="0" fill="#ea580c"/><circle cx="801" cy="100" r="12" fill="#ea580c"/><text x="801" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="819" y="105" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How rows combine</text><text x="789" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">ON the key; watch multiplication.</tspan></text><rect x="787" y="146" width="324" height="89" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="949" y="195" fill="#1e40af" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Table A</text><rect x="1182" y="146" width="324" height="89" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="1344" y="195" fill="#166534" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Table B</text><line x1="1112" y1="191" x2="1182" y2="191" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1146" y="181" fill="#1e3a5f" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">ON key</text><rect x="787" y="259" width="719" height="106" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="799" y="283" fill="#854d0e" font-size="12" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">INNER: matches only    LEFT: keep A, NULL on B</text><text x="799" y="307" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="799" dy="0">Explains one production SP they touched and how it is called from EF</tspan></text><rect x="16" y="391" width="747" height="303" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="391" width="7" height="303" rx="0" fill="#dc2626"/><circle cx="44" cy="413" r="12" fill="#dc2626"/><text x="44" y="417" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="62" y="418" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Numbers / interview drill</text><text x="32" y="433" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">What / where / why / how.</tspan></text><rect x="30" y="459" width="356" height="108" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="40" y="477" fill="#1e40af" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">1</text><text x="40" y="497" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Parameters</text><text x="40" y="517" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">Typed inputs; plans can be reused (watch</tspan><tspan x="40" dy="12">parameter sniffing on S09).</tspan></text><rect x="394" y="459" width="356" height="108" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="404" y="477" fill="#166534" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">2</text><text x="404" y="497" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">TRY/CATCH</text><text x="404" y="517" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="404" dy="0">CATCH, rollback, RAISERROR/THROW with a safe</tspan><tspan x="404" dy="12">message.</tspan></text><rect x="30" y="575" width="356" height="108" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="40" y="593" fill="#9a3412" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">3</text><text x="40" y="613" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">NOCOUNT ON</text><text x="40" y="633" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">Stops extra DONE_IN_PROC traffic that can</tspan><tspan x="40" dy="12">confuse some clients.</tspan></text><rect x="394" y="575" width="356" height="108" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="404" y="593" fill="#854d0e" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">4</text><text x="404" y="613" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">EF</text><text x="404" y="633" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="404" dy="0">FromSqlInterpolated / ExecuteSql — still</tspan><tspan x="404" dy="12">parameterized.</tspan></text><rect x="773" y="391" width="747" height="303" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="773" y="391" width="7" height="303" rx="0" fill="#2563eb"/><circle cx="801" cy="413" r="12" fill="#2563eb"/><text x="801" y="417" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="819" y="418" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When A vs when B</text><text x="789" y="433" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Pick a path with a project example.</tspan></text><polygon points="1146,467 1216,507 1146,547 1076,507" fill="#fef9c3" stroke="#b45309" stroke-width="1.8"/><text x="1146" y="511" fill="#b45309" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Which?</text><rect x="787" y="559" width="345" height="115" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><rect x="1161" y="559" width="345" height="115" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="797" y="581" fill="#1e40af" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Parameters</text><text x="797" y="603" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="797" dy="0">Typed inputs; plans can be reused (watch</tspan><tspan x="797" dy="13">parameter sniffing on S09).</tspan></text><text x="1171" y="581" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">TRY/CATCH</text><text x="1171" y="603" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1171" dy="0">CATCH, rollback, RAISERROR/THROW with a</tspan><tspan x="1171" dy="13">safe message.</tspan></text><rect x="16" y="705" width="747" height="303" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="16" y="705" width="7" height="303" rx="0" fill="#16a34a"/><circle cx="44" cy="727" r="12" fill="#16a34a"/><text x="44" y="731" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="62" y="732" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Compare — pick with a reason</text><text x="32" y="747" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Say the criterion, then the choice.</tspan></text><rect x="30" y="773" width="719" height="28" rx="6" fill="#1e3a5f"/><text x="36" y="792" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Idea</text><text x="396" y="792" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><rect x="30" y="801" width="719" height="28" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="820" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Parameters</text><text x="396" y="820" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Typed inputs; plans </text><rect x="30" y="829" width="719" height="28" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="848" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">TRY/CATCH</text><text x="396" y="848" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">CATCH, rollback, RAI</text><rect x="30" y="857" width="719" height="28" rx="0