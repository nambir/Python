<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#334155"/><text x="28" y="36" fill="#334155" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SQL Server  ·  S04  ·  code callout</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Stored Procedures</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">A stored procedure is a named batch on SQL Server. Use parameters — never concatenate user input. TRY/CATCH + transaction when multiple writes must</tspan><tspan x="28" dy="17">succeed together.</tspan></text><rect x="28" y="140" width="780" height="760" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="48" y="178" fill="#334155" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Sample</text><text x="48" y="220" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">CREATE PROCEDURE dbo.GetOpenOrders</text><text x="48" y="248" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  @CustomerId uniqueidentifier</text><text x="48" y="276" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">AS</text><text x="48" y="304" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">BEGIN</text><text x="48" y="332" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  SET NOCOUNT ON;</text><text x="48" y="360" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  SELECT o.Id, o.Status</text><text x="48" y="388" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  FROM dbo.Orders o</text><text x="48" y="416" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  WHERE o.CustomerId = @CustomerId AND o.Status = N'Open';</text><rect x="828" y="140" width="680" height="175" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><circle cx="858" cy="176" r="18" fill="#334155"/><text x="858" y="182" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="888" y="182" fill="#1e40af" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Parameters</text><text x="848" y="212" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="848" dy="0">Typed inputs; plans can be reused (watch</tspan><tspan x="848" dy="17">parameter sniffing on S09).</tspan></text><rect x="828" y="330" width="680" height="175" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="2"/><circle cx="858" cy="366" r="18" fill="#334155"/><text x="858" y="372" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="888" y="372" fill="#166534" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">TRY/CATCH</text><text x="848" y="402" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="848" dy="0">CATCH, rollback, RAISERROR/THROW with a safe</tspan><tspan x="848" dy="17">message.</tspan></text><rect x="828" y="520" width="680" height="175" rx="14" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><circle cx="858" cy="556" r="18" fill="#334155"/><text x="858" y="562" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="888" y="562" fill="#9a3412" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">NOCOUNT ON</text><text x="848" y="592" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="848" dy="0">Stops extra DONE_IN_PROC traffic that can</tspan><tspan x="848" dy="17">confuse some clients.</tspan></text><rect x="828" y="710" width="680" height="175" rx="14" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><circle cx="858" cy="746" r="18" fill="#334155"/><text x="858" y="752" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="888" y="752" fill="#854d0e" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">EF</text><text x="848" y="782" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="848" dy="0">FromSqlInterpolated / ExecuteSql — still</tspan><tspan x="848" dy="17">parameterized.</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Explains one production SP they touched and how it is called from EF</tspan></text>
</svg>
