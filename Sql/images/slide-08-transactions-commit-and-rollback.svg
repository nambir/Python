<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#6d28d9"/><text x="28" y="36" fill="#6d28d9" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SQL Server  ·  S08  ·  loop</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Transactions: Commit and Rollback</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">A transaction is all-or-nothing. Wallet debit and outbox insert must commit together. If the second write fails, ROLLBACK both.</tspan></text><circle cx="520" cy="480" r="70" fill="#6d28d9"/><text x="520" y="472" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="520" dy="0">until exit</tspan></text><rect x="400" y="230" width="240" height="80" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="520" y="262" fill="#1e40af" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="520" y="288" fill="#1e40af" font-size="15" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">BEGIN TRAN</text><rect x="610" y="440" width="240" height="80" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="730" y="472" fill="#166534" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="730" y="498" fill="#166534" font-size="15" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Work</text><rect x="400" y="650" width="240" height="80" rx="14" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><text x="520" y="682" fill="#9a3412" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="520" y="708" fill="#9a3412" font-size="15" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">COMMIT</text><rect x="190" y="440" width="240" height="80" rx="14" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><text x="310" y="472" fill="#854d0e" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="310" y="498" fill="#854d0e" font-size="15" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">or ROLLBACK</text><line x1="560" y1="270" x2="690" y2="460" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="730" y1="520" x2="560" y2="690" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="480" y1="690" x2="350" y2="500" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="310" y1="440" x2="480" y2="270" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="860" y="140" width="648" height="760" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="880" y="180" fill="#6d28d9" font-size="18" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Name the exit</text><rect x="880" y="210" width="297" height="280" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="894" y="236" fill="#b91c1c" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Catch and still commit</text><text x="894" y="260" fill="#7f1d1d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="894" dy="0">BEGIN TRAN; ... CATCH; COMMIT;</tspan></text><rect x="1191" y="210" width="297" height="280" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="1205" y="236" fill="#166534" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="1205" y="260" fill="#14532d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1205" dy="0">BEGIN TRAN; TRY ... COMMIT;</tspan><tspan x="1205" dy="16">CATCH ROLLBACK; THROW;</tspan></text><text x="880" y="530" fill="#6d28d9" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Code</text><text x="880" y="560" fill="#0f172a" font-size="13" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">BEGIN TRAN;</text><text x="880" y="580" fill="#0f172a" font-size="13" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">BEGIN TRY</text><text x="880" y="600" fill="#0f172a" font-size="13" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  UPDATE dbo.Wallet SET Balance -= @amt WHERE Id</text><text x="880" y="620" fill="#0f172a" font-size="13" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  INSERT dbo.Outbox (WalletId, Type) VALUES (@id</text><text x="880" y="640" fill="#0f172a" font-size="13" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  COMMIT;</text><text x="880" y="660" fill="#0f172a" font-size="13" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">END TRY</text><text x="880" y="680" fill="#0f172a" font-size="13" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">BEGIN CATCH</text><text x="880" y="700" fill="#0f172a" font-size="13" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  ROLLBACK;</text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Names two writes that must commit together in their project</tspan></text>
</svg>
