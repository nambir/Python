<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Transactions: Commit and Rollback  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">SQL Server  ·  S08  ·  A transaction is all-or-nothing. Wallet debit and outbox insert must commit together. If the second write fail</text><rect x="16" y="78" width="1504" height="210" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="16" y="78" width="7" height="210" rx="0" fill="#16a34a"/><circle cx="44" cy="100" r="12" fill="#16a34a"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How the pieces connect</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Name each box, then the hand-off.</tspan></text><rect x="30" y="146" width="362" height="49" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="211" y="167" fill="#1e40af" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="211" dy="0">BEGIN TRAN</tspan></text><line x1="392" y1="171" x2="402" y2="171" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="402" y="146" width="362" height="49" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="582" y="167" fill="#166534" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="582" dy="0">Work</tspan></text><line x1="763" y1="171" x2="773" y2="171" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="773" y="146" width="362" height="49" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="954" y="167" fill="#9a3412" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="954" dy="0">COMMIT</tspan></text><line x1="1134" y1="171" x2="1144" y2="171" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1144" y="146" width="362" height="49" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="1325" y="167" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="1325" dy="0">or ROLLBACK</tspan></text><text x="30" y="211" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">Name each box, then the hand-off. Names two writes that must commit together in their project</tspan></text><rect x="16" y="298" width="495" height="355" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="298" width="7" height="355" rx="0" fill="#4f46e5"/><circle cx="44" cy="320" r="12" fill="#4f46e5"/><text x="44" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="62" y="325" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Inside the system</text><text x="32" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Top to bottom, then the hand-off.</tspan></text><rect x="30" y="366" width="467" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="42" y="393" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Commit</text><text x="42" y="412" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Make the changes durable and visible per isolati</text><text x="263" y="435" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="30" y="436" width="467" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="42" y="463" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Rollback</text><text x="42" y="483" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Undo the whole unit. Call it in CATCH after a fa</text><text x="263" y="506" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="30" y="506" width="467" height="64" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="42" y="533" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">EF</text><text x="42" y="553" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SaveChanges is one transaction by default; ITran</text><text x="263" y="576" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="30" y="577" width="467" height="64" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="42" y="604" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Microservices</text><text x="42" y="623" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">This SQL transaction cannot include another serv</text><rect x="521" y="298" width="495" height="355" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="521" y="298" width="7" height="355" rx="0" fill="#7c3aed"/><circle cx="549" cy="320" r="12" fill="#7c3aed"/><text x="549" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="567" y="325" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What contains what</text><text x="537" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Outer box owns the inner ones.</tspan></text><rect x="535" y="366" width="467" height="275" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="545" y="384" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">BEGIN TRAN</text><rect x="569" y="400" width="398" height="206" rx="10" fill="#bfdbfe" stroke="#1e40af" stroke-width="1.5"/><text x="579" y="418" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Work</text><rect x="603" y="435" width="329" height="138" rx="10" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/><text x="613" y="453" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">COMMIT</text><rect x="638" y="469" width="260" height="69" rx="10" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/><text x="648" y="487" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">or ROLLBACK</text><rect x="1025" y="298" width="495" height="355" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="1025" y="298" width="7" height="355" rx="0" fill="#ea580c"/><circle cx="1053" cy="320" r="12" fill="#ea580c"/><text x="1053" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="1071" y="325" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How rows combine</text><text x="1041" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">ON the key; watch multiplication.</tspan></text><rect x="1039" y="366" width="198" height="90" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="1139" y="415" fill="#1e40af" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Table A</text><rect x="1308" y="366" width="198" height="90" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="1407" y="415" fill="#166534" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Table B</text><line x1="1238" y1="411" x2="1308" y2="411" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1273" y="401" fill="#1e3a5f" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">ON key</text><rect x="1039" y="480" width="467" height="157" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="1051" y="504" fill="#854d0e" font-size="12" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">INNER: matches only    LEFT: keep A, NULL on B</text><text x="1051" y="528" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1051" dy="0">Names two writes that must commit together in their project</tspan></text><rect x="16" y="663" width="747" height="345" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="663" width="7" height="345" rx="0" fill="#dc2626"/><circle cx="44" cy="685" r="12" fill="#dc2626"/><text x="44" y="689" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="62" y="690" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Numbers / interview drill</text><text x="32" y="705" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">What / where / why / how.</tspan></text><rect x="30" y="731" width="356" height="128" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="40" y="749" fill="#1e40af" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">1</text><text x="40" y="769" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Commit</text><text x="40" y="789" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">Make the changes durable and visible per</tspan><tspan x="40" dy="12">isolation level.</tspan></text><rect x="394" y="731" width="356" height="128" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="404" y="749" fill="#166534" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">2</text><text x="404" y="769" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Rollback</text><text x="404" y="789" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="404" dy="0">Undo the whole unit. Call it in CATCH after</tspan><tspan x="404" dy="12">a failure.</tspan></text><rect x="30" y="868" width="356" height="128" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="40" y="886" fill="#9a3412" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">3</text><text x="40" y="906" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">EF</text><text x="40" y="926" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">SaveChanges is one transaction by default;</tspan><tspan x="40" dy="12">ITransaction for explicit boundaries.</tspan></text><rect x="394" y="868" width="356" height="128" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="404" y="886" fill="#854d0e" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">4</text><text x="404" y="906" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Microservices</text><text x="404" y="926" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="404" dy="0">This SQL transaction cannot include another</tspan><tspan x="404" dy="12">service’s database — that is a saga (Dotnet</tspan><tspan x="404" dy="12">D65).</tspan></text><rect x="773" y="663" width="747" height="345" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="773" y="663" width="7" height="345" rx="0" fill="#2563eb"/><circle cx="801" cy="685" r="12" fill="#2563eb"/><text x="801" y="689" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="819" y="690" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When A vs when B</text><text x="789" y="705" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Pick a path with a project example.</tspan></text><polygon points="1146,739 1216,779 1146,819 1076,779" fill="#fef9c3" stroke="#b45309" stroke-width="1.8"/><text x="1146" y="783" fill="#b45309" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Which?</text><rect x="787" y="831" width="345" height="157" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><rect x="1161" y="831" width="345" height="157" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="797" y="853" fill="#1e40af" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Commit</text><text x="797" y="875" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="797" dy="0">Make the changes durable and visible per</tspan><tspan x="797" dy="13">isolation level.</tspan></text><text x="1171" y="853" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Rollback</text><text x="1171" y="875" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1171" dy="0">Undo the whole unit. Call it in CATCH after</tspan><tspan x="1171" dy="13">a failure.</tspan></text>
