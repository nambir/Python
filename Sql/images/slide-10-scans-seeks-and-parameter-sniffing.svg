<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#be123c"/><text x="28" y="36" fill="#be123c" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SQL Server  ·  S10  ·  fork</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Scans, Seeks, and Parameter Sniffing</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">A seek jumps to a key. A scan reads a large portion of the table/index. Parameter sniffing: SQL Server caches a plan from the first parameter and</tspan><tspan x="28" dy="17">reuses it for others.</tspan></text><polygon points="768,160 860,250 768,340 676,250" fill="#fef9c3" stroke="#be123c" stroke-width="2.5"/><text x="768" y="246" fill="#be123c" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Which path?</text><text x="768" y="270" fill="#475569" font-size="12" font-weight="600" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Say the rule</text><line x1="720" y1="330" x2="380" y2="400" stroke="#be123c" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="816" y1="330" x2="1156" y2="400" stroke="#be123c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="400" width="700" height="360" rx="16" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><rect x="808" y="400" width="700" height="360" rx="16" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="48" y="450" fill="#1e40af" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Seek</text><text x="48" y="500" fill="#1e3a5f" font-size="15" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="48" dy="0">Good when the predicate is selective and sargable</tspan><tspan x="48" dy="18">(not wrapped in a function).</tspan></text><text x="828" y="450" fill="#166534" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Scan</text><text x="828" y="500" fill="#14532d" font-size="15" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="828" dy="0">OK for small tables or when most rows qualify;</tspan><tspan x="828" dy="18">painful on large tables.</tspan></text><text x="48" y="800" fill="#b91c1c" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Always recompile</text><text x="48" y="828" fill="#7f1d1d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="48" dy="0">OPTION (RECOMPILE) on every call</tspan></text><text x="828" y="800" fill="#166534" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Use recompile or OPTIMIZE FOR only after proving s</text><text x="828" y="828" fill="#14532d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="828" dy="0">Use recompile or OPTIMIZE FOR only after proving</tspan><tspan x="828" dy="16">sniffing.</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Explains one sniffing story: a plan for a rare parameter reused for a common one</tspan></text>
</svg>
