<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><text x="768" y="38" fill="#0f172a" font-size="22" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Your SSMS plan — RDC_MetricS.dbo.A_employees1</text><text x="768" y="64" fill="#475569" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Server .\sqlexpress  ·  login that can open the DB (user1)  ·  Query 1 USE = 0%  ·  Query 2 Table Scan = 100%</text><rect x="28" y="86" width="730" height="830" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.6"/><text x="393" y="122" fill="#991b1b" font-size="18" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Problem — what you ran</text><text x="393" y="148" fill="#475569" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Wide SELECT, no WHERE. Table Scan = heap (no clustered index).</text><rect x="88" y="168" width="610" height="56" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.6"/><text x="393" y="201" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Query 1  USE [RDC_MetricS]   cost 0%</text><line x1="393" y1="224" x2="393" y2="255" stroke="#dc2626" stroke-width="2.4"/><polygon points="387,245 399,245 393,255" fill="#dc2626"/><rect x="88" y="258" width="610" height="72" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="393" y="290" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Query 2  SELECT EmpID, FullName, Status, …</text><text x="393" y="308" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">FROM dbo.A_employees1     cost 100%</text><line x1="393" y1="330" x2="393" y2="361" stroke="#dc2626" stroke-width="2.4"/><polygon points="387,351 399,351 393,361" fill="#dc2626"/><rect x="168" y="364" width="450" height="72" rx="10" fill="#fecaca" stroke="#b91c1c" stroke-width="1.6"/><text x="393" y="396" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Table Scan  [A_employees1]</text><text x="393" y="414" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">operator cost 100%</text><text x="393" y="470" fill="#7f1d1d" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Not Clustered Index Scan — there is no clustered index. Heap.</text><rect x="88" y="492" width="610" height="200" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/><text x="393" y="528" fill="#991b1b" font-size="15" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Why it hurts in the interview</text><text x="393" y="560" fill="#0f172a" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1. You asked for every row — a scan is expected.</text><text x="393" y="586" fill="#0f172a" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2. Heap: even EmpID = @id still Table Scan.</text><text x="393" y="612" fill="#0f172a" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3. Wide SELECT (NIC, passport, fingerprint) = fat arrows.</text><text x="393" y="638" fill="#0f172a" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4. Do not paste PII into notes. EmpID + Status only.</text><text x="393" y="670" fill="#475569" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Messages: (1 row affected) is not a plan. Open Execution Plan.</text><rect x="778" y="86" width="730" height="830" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/><text x="1143" y="122" fill="#14532d" font-size="18" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Fix — lookup they actually need</text><text x="1143" y="148" fill="#475569" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">WHERE + clustered on EmpID. Retest: Index Seek, not Table Scan.</text><rect x="838" y="168" width="610" height="56" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.6"/><text x="1143" y="201" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Check: SELECT EmpID, COUNT(*) … HAVING COUNT(*) &gt; 1</text><line x1="1143" y1="224" x2="1143" y2="255" stroke="#15803d" stroke-width="2.4"/><polygon points="1137,245 1149,245 1143,255" fill="#15803d"/><rect x="838" y="258" width="610" height="72" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="1143" y="290" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">CREATE UNIQUE CLUSTERED INDEX</text><text x="1143" y="308" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">CX_A_employees1_EmpID ON dbo.A_employees1(EmpID)</text><line x1="1143" y1="330" x2="1143" y2="361" stroke="#15803d" stroke-width="2.4"/><polygon points="1137,351 1149,351 1143,361" fill="#15803d"/><rect x="838" y="364" width="610" height="72" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="1143" y="396" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">SELECT EmpID, [FullName (English)], Status</text><text x="1143" y="414" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">FROM dbo.A_employees1 WHERE EmpID = @id</text><line x1="1143" y1="436" x2="1143" y2="467" stroke="#15803d" stroke-width="2.4"/><polygon points="1137,457 1149,457 1143,467" fill="#15803d"/><rect x="918" y="470" width="450" height="72" rx="10" fill="#86efac" stroke="#166534" stroke-width="1.6"/><text x="1143" y="502" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Clustered Index Seek</text><text x="1143" y="520" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">operator ~0%  ·  1 row</text><rect x="838" y="568" width="610" height="200" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/><text x="1143" y="604" fill="#14532d" font-size="15" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">If they filter Status too</text><text x="1143" y="636" fill="#0f172a" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Nonclustered (Status) INCLUDE (FullName) after the WHERE.</text><text x="1143" y="662" fill="#0f172a" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">SELECT * of the whole table still scans — that is not a bug.</text><text x="1143" y="688" fill="#0f172a" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">NOLOCK is not the fix. Isolation is C14. This is the plan.</text><text x="1143" y="720" fill="#475569" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Run in the SSMS window that already opened RDC_MetricS.</text><text x="768" y="946" fill="#334155" font-size="14" font-weight="600" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Connect: Server .\sqlexpress  ·  Database RDC_MetricS  ·  use the login that already works in SSMS (user1).</text><text x="768" y="972" fill="#475569" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">This Cursor Windows account can reach the instance but cannot open RDC_MetricS — do not chase Integrated Security if SSMS already works.</text><text x="768" y="996" fill="#64748b" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Lab file: ClientInterview/sql/rdc_metrics_employees1_plan.sql</text>
</svg>
