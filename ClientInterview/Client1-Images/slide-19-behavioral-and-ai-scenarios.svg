fff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="1049" cy="80" r="11" fill="#4f46e5"/><text x="1049" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1067" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Orders schema</text><rect x="1039" y="98" width="469" height="28" rx="8" fill="#ede9fe"/><text x="1049" y="117" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Stock check in the same transaction.</text><rect x="1039" y="130" width="469" height="144" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="1049" y="148" fill="#3730a3" font-size="12" font-weight="800" text-anchor="start" font-family="Consolas,Menlo,monospace">On-the-spot schema</text><text x="1049" y="178" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">Customer(CustomerId, Email)</text><text x="1049" y="197" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">Product(..., Stock)</text><text x="1049" y="216" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">Orders / OrderLine</text><text x="1049" y="235" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">UPDATE Stock WHERE Stock &gt;= @Qty</text><text x="1049" y="254" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">-- @@ROWCOUNT = 0 → rollback</text><rect x="1039" y="282" width="469" height="32" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/><text x="1049" y="304" fill="#334155" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">Tables + one transactional stock rule.</text><rect x="16" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="38" cy="360" r="11" fill="#7c3aed"/><text x="38" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="56" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">AI quality</text><rect x="28" y="378" width="722" height="28" rx="8" fill="#f3e8ff"/><text x="38" y="397" fill="#6b21a8" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">You still own the code.</text><circle cx="389" cy="502" r="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="389" y="507" fill="#5b21b6" font-size="13" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">AI coding</text><line x1="389" y1="502" x2="389" y2="424" stroke="#7c3aed" stroke-width="2.4"  stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="341" y="412" width="96" height="24" rx="8" fill="#86efac"/><text x="389" y="429" fill="#166534" font-size="11" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">small diffs</text><line x1="389" y1="502" x2="692" y2="502" stroke="#7c3aed" stroke-width="2.4"  stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="644" y="490" width="96" height="24" rx="8" fill="#86efac"/><text x="692" y="507" fill="#166534" font-size="11" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">run tests</text><line x1="389" y1="502" x2="389" y2="578" stroke="#7c3aed" stroke-width="2.4"  stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="341" y="566" width="96" height="24" rx="8" fill="#86efac"/><text x="389" y="583" fill="#166534" font-size="11" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">no secrets in chat</text><line x1="389" y1="502" x2="86" y2="502" stroke="#7c3aed" stroke-width="2.4"  stroke-dasharray="4 3