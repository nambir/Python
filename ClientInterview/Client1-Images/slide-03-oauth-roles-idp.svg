<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><text x="768" y="28" fill="#1e3a5f" font-size="24" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">OAuth 2 roles — IdP = Identity Provider  –  Visual Guide</text><text x="768" y="48" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Client1 · C03 extra  ·  four players: End User, Website/API, Angular, Identity Provider</text><rect x="16" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="38" cy="80" r="11" fill="#2563eb"/><text x="38" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="56" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Four roles — both names</text><rect x="28" y="98" width="469" height="28" rx="8" fill="#dbeafe"/><text x="38" y="117" fill="#1e40af" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Learn the OAuth name and the simple name.</text><rect x="28" y="130" width="469" height="26" rx="4" fill="#4338ca" stroke="#cbd5e1" stroke-width="1"/><text x="36" y="148" fill="#fff" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">OAuth name</text><text x="271" y="148" fill="#fff" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Simple name</text><rect x="28" y="156" width="469" height="40" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="171" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Resource Owner</tspan></text><text x="271" y="171" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="271" dy="0">End user — you</tspan></text><rect x="28" y="196" width="469" height="40" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="211" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Resource Server</tspan></text><text x="271" y="211" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="271" dy="0">Website / API</tspan></text><rect x="28" y="235" width="469" height="40" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="250" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Client</tspan></text><text x="271" y="250" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="271" dy="0">Angular (or MVC)</tspan></text><rect x="28" y="274" width="469" height="40" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="290" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Authorization Server</tspan></text><text x="271" y="290" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="271" dy="0">IdP = Identity Provider</tspan></text><rect x="521" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><circle cx="543" cy="80" r="11" fill="#16a34a"/><text x="543" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="561" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Resource Owner = End User</text><rect x="533" y="98" width="469" height="28" rx="8" fill="#dcfce7"/><text x="543" y="117" fill="#166534" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">You own the data. You click Allow.</text><circle cx="539" cy="142" r="4" fill="#e11d48"/><text x="549" y="138" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="549" dy="0">Resource Owner = End User</tspan></text><circle cx="539" cy="188" r="4" fill="#e11d48"/><text x="549" y="184" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="549" dy="0">The person who owns the data</tspan></text><circle cx="539" cy="234" r="4" fill="#e11d48"/><text x="549" y="230" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="549" dy="0">You click Yes / Allow on login</tspan></text><circle cx="539" cy="280" r="4" fill="#e11d48"/><text x="549" y="276" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="549" dy="0">Without you, no user token</tspan></text><rect x="1027" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="1049" cy="80" r="11" fill="#4f46e5"/><text x="1049" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1067" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Resource Server = Website / API</text><rect x="1039" y="98" width="469" height="28" rx="8" fill="#ede9fe"/><text x="1049" y="117" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Our .NET API holds the data and checks the token.</text><circle cx="1045" cy="142" r="4" fill="#0d9488"/><text x="1055" y="138" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1055" dy="0">Resource Server = Website / API</tspan></text><circle cx="1045" cy="188" r="4" fill="#0d9488"/><text x="1055" y="184" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1055" dy="0">Holds the protected data</tspan></text><circle cx="1045" cy="234" r="4" fill="#0d9488"/><text x="1055" y="230" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1055" dy="0">In this project: our .NET Web API</tspan></text><circle cx="1045" cy="280" r="4" fill="#0d9488"/><text x="1055" y="276" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1055" dy="0">Checks the access token, then</tspan><tspan x="1055" dy="15">returns JSON</tspan></text><rect x="16" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="38" cy="360" r="11" fill="#7c3aed"/><text x="38" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="56" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Client = Angular (or MVC)</text><rect x="28" y="378" width="722" height="28" rx="8" fill="#f3e8ff"/><text x="38" y="397" fill="#6b21a8" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The app asking for data. It never sees the password.</text><circle cx="34" cy="422" r="4" fill="#ea580c"/><text x="44" y="418" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Client = Angular web / MVC</tspan></text><circle cx="34" cy="468" r="4" fill="#ea580c"/><text x="44" y="464" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">The app that asks for your data</tspan></text><circle cx="34" cy="514" r="4" fill="#ea580c"/><text x="44" y="510" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Never sees your password</tspan></text><circle cx="34" cy="560" r="4" fill="#ea580c"/><text x="44" y="556" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Only receives tokens after login</tspan></text><rect x="774" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="796" cy="360" r="11" fill="#ea580c"/><text x="796" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="814" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">IdP = Identity Provider</text><rect x="786" y="378" width="722" height="28" rx="8" fill="#ffedd5"/><text x="796" y="397" fill="#9a3412" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Authorization Server. Login system. Issues tokens.</text><rect x="786" y="410" width="722" height="26" rx="4" fill="#6d28d9" stroke="#cbd5e1" stroke-width="1"/><text x="794" y="428" fill="#fff" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Letters</text><text x="1155" y="428" fill="#fff" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this out loud</text><rect x="786" y="436" width="722" height="32" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="794" y="450" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="794" dy="0">IdP</tspan></text><text x="1155" y="450" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1155" dy="0">Identity Provider</tspan></text><rect x="786" y="468" width="722" height="32" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="794" y="482" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="794" dy="0">Same as</tspan></text><text x="1155" y="482" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1155" dy="0">Authorization Server</tspan></text><rect x="786" y="499" width="722" height="32" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="794" y="513" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="794" dy="0">Job</tspan></text><text x="1155" y="513" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1155" dy="0">Login page + issue tokens</tspan></text><rect x="786" y="531" width="722" height="32" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="794" y="545" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="794" dy="0">Examples</tspan></text><text x="1155" y="545" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1155" dy="0">Azure AD, Cognito, IdentityServer, Auth0</tspan></text><rect x="786" y="562" width="722" height="32" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="794" y="576" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="794" dy="0">Not this</tspan></text><text x="1155" y="576" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1155" dy="0">Not Angular. Not the orders API.</tspan></text><rect x="16" y="618" width="1504" height="398" rx="12" fill="#fff" stroke="#e11d48" stroke-width="1.5"/><circle cx="38" cy="640" r="11" fill="#e11d48"/><text x="38" y="644" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="56" y="645" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Simple login story</text><rect x="28" y="658" width="1480" height="28" rx="8" fill="#ffe4e6"/><text x="38" y="677" fill="#9f1239" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">You → Angular → IdP login → tokens → .NET API.</text><rect x="117" y="690" width="1302" height="50" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="768" y="721" fill="#166534" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">You (Resource Owner / End User) click Login</text><line x1="768" y1="740" x2="768" y2="756" stroke="#166534" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="117" y="756" width="1302" height="50" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="768" y="787" fill="#166534" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Angular (Client) sends you to the IdP</text><line x1="768" y1="806" x2="768" y2="822" stroke="#166534" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="117" y="822" width="1302" height="50" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="768" y="853" fill="#166534" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">IdP (Identity Provider) shows the login page</text><line x1="768" y1="872" x2="768" y2="888" stroke="#166534" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="117" y="888" width="1302" height="50" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="768" y="919" fill="#166534" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">IdP gives tokens to Angular</text><line x1="768" y1="938" x2="768" y2="954" stroke="#166534" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="117" y="954" width="1302" height="50" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="768" y="985" fill="#166534" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">.NET API (Resource Server) checks the access token</text>
</svg>
