,sans-serif">choose hop</text><line x1="238" y1="222" x2="270" y2="222" stroke="#64748b" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="272" y="178" width="86" height="88" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/><text x="314" y="215" fill="#6d28d9" font-size="13" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">HTTP</text><text x="314" y="240" fill="#475569" font-size="11" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">service toke</text><line x1="359" y1="203" x2="373" y2="154" stroke="#64748b" stroke-width="2.4"  marker-end="url(#arrow)"/><line x1="359" y1="241" x2="373" y2="278" stroke="#64748b" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="377" y="138" width="114" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="434" y="163" fill="#166534" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Wait for GET</text><rect x="377" y="266" width="114" height="40" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="434" y="290" fill="#854d0e" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">SQS / events</text><rect x="521" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><circle cx="543" cy="80" r="11" fill="#16a34a"/><text x="543" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="561" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Saga</text><rect x="533" y="98" width="469" height="28" rx="8" fill="#dcfce7"/><text x="543" y="117" fill="#166534" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">No distributed DTC.</text><circle cx="768" cy="222" r="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="768" y=