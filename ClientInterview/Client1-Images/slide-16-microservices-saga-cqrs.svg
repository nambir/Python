/><text x="1049" y="117" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Locks don't travel over HTTP.</text><rect x="1039" y="130" width="230" height="184" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><circle cx="1053" cy="146" r="8" fill="#dc2626"/><text x="1053" y="150" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="1067" y="151" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Distributed BEGIN TRAN</text><rect x="1049" y="166" width="210" height="138" rx="6" fill="#fff" stroke="#fecaca" stroke-width="1"/><text x="1057" y="190" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1057" dy="0">HTTP inside SQL txn</tspan></text><text x="1057" y="232" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1057" dy="0">Locks + timeouts</tspan></text><text x="1057" y="274" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1057" dy="0">Partial commits</tspan></text><rect x="1278" y="130" width="230" height="184" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><circle cx="1292" cy="146" r="8" fill="#16a34a"/><text x="1292" y="150" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="1306" y="151" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Choreography</text><rect x="1288" y="166" width="210" height="138" rx="6" fill="#fff" stroke="#bbf7d0" stroke-width="1"/><text x="1296" y="190" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1296" dy="0">A commits, publishes</tspan></text><text x="1296" y="232" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1296" dy="0">B/C consume</tspan></text><text x="1296" y="274" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1296" dy="0">Compensate on fail</tspan></text><rect x="16" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="38" cy="360" r="11" fill="#7c3aed"/><text x="38" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="56" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Failure modes</text><rect x="28" y="378" width="722" height="28" rx="8" fill="#f3e8ff"/><text x="38" y="397" fill="#6b21a8" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">DLQ is part of the design.</text><rect x="28" y="410" width="722" height="26" rx="4" fill="#4338ca" stroke="#cbd5e1" stroke-width="1"/><text x="36" y="428" fill="#fff" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Failure</text><text x="397" y="428" fill="#fff" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What you do</text><rect x="28" y="436" width="722" height="40" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="451" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Consumer crash</tspan></text><text x="397" y="451" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="397" dy="0">retry → DLQ + alert</tspan></text><rect x="28" y="476" width="722" height="40" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="491" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">10MB+ event</tspan></text><text x="397" y="491" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="397" dy="0">S3 object + key on message</tspan></text><rect x="28" y="515" width="722" height="40" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="530" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Auth module split</tspan></text><text x="397" y="530" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="397" dy="0">tokens not copied per DB</tspan></text><rect x="28" y="554" width="722" height="40" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="570" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">CQRS</tspan></text><text x="397" y="570" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="397" dy="0">only if you had read/write stores</tspan></text><rect x="774" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="796" cy="360" r="11" fill="#ea580c"/><text x="796" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="814" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">10MB+</text><rect x="786" y="378" width="722" height="28" rx="8" fill="#ffedd5"/><text x="796" y="397" fill="#9a3412" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Bus limits — park the body in S3.</text><rect x="786" y="410" width="722" height="144" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="796" y="428" fill="#3730a3" font-size="12" font-weight="800" text-anchor="start" font-family="Consolas,Menlo,monospace">After local commit</text><text x="796" y="462" fill="#1d4ed8" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">await _db.SaveChangesAsync();</text><text x="796" y="493" fill="#1d4ed8" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">await _s3.PutAsync(key, body);</text><text x="796" y="525" fill="#1d4ed8" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">await _sqs.SendAsync(new OrderPlaced(id, key));</text><rect x="786" y="562" width="722" height="32" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/><text x="796" y="584" fill="#334155" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">Small message; fat payload off the bus.</text><rect x="16" y="618" width="1504" height="398" rx="12" fill="#fff" stroke="#e11d48" stroke-width="1.5"/><circle cx="38" cy="640" r="11" fill="#e11d48"/><text x="38" y="644" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="56" y="645" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice &amp; comparison</text><rect x="28" y="658" width="1480" height="28" rx="8" fill="#ffe4e6"/><text x="38" y="677" fill="#9f1239" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Only claim CQRS if you had two models.</text><rect x="28" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#fda4af" stroke-width="1.5"/><text x="40" y="710" fill="#9f1239" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How many services</text><rect x="40" y="718" width="461" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="750" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// YOUR count + why split</text><text x="50" y="800" fill="#1