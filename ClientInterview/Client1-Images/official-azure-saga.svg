<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><text x="768" y="40" fill="#0f172a" font-size="22" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Official Azure Architecture Center — Saga (choreography vs orchestration)</text><text x="768" y="66" fill="#475569" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">learn.microsoft.com/azure/architecture/patterns/saga  ·  choreography  ·  publisher-subscriber  ·  CQRS</text><rect x="28" y="88" width="730" height="820" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/><text x="393" y="124" fill="#1e3a5f" font-size="18" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Choreography — no central boss</text><text x="393" y="148" fill="#475569" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Each service commits locally, then publishes. Next service reacts.</text><rect x="168" y="170" width="450" height="56" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="393" y="203" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1  Order API — SaveChanges (local ACID)</text><line x1="393" y1="226" x2="393" y2="259" stroke="#0f172a" stroke-width="2.4"/><polygon points="387,249 399,249 393,259" fill="#0f172a"/><rect x="168" y="262" width="450" height="56" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/><text x="393" y="295" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2  Publish OrderPlaced (small event)</text><line x1="393" y1="318" x2="393" y2="351" stroke="#0f172a" stroke-width="2.4"/><polygon points="387,341 399,341 393,351" fill="#0f172a"/><rect x="48" y="354" width="210" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="153" y="385" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Inventory</text><text x="153" y="403" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">consumes event</text><rect x="268" y="354" width="210" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="373" y="385" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Payment</text><text x="373" y="403" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">consumes event</text><rect x="488" y="354" width="210" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="593" y="385" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Shipping</text><text x="593" y="403" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">consumes event</text><text x="393" y="454" fill="#9f1239" font-size="13" font-weight="600" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">If Inventory fails — compensating event, not ROLLBACK on Order SQL</text><rect x="168" y="474" width="450" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="393" y="507" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3  Publish OrderFailed → Order sets Cancelled</text><text x="393" y="560" fill="#475569" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Fat payload: put JSON on S3, send the key on the message</text><rect x="168" y="576" width="450" height="56" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="393" y="609" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">S3 object + OrderPlaced(id, s3Key)</text><text x="393" y="668" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Failed consumer: retry → dead-letter queue → alert. Handler must be idempotent.</text><rect x="88" y="688" width="610" height="180" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/><text x="393" y="728" fill="#1e3a5f" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="393" y="758" fill="#0f172a" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">We did not BEGIN TRAN across HTTP. Order committed, then the bus.</text><text x="393" y="784" fill="#0f172a" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Inventory and Payment each have their own database.</text><text x="393" y="810" fill="#0f172a" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">That is choreography. Only say orchestration if a coordinator ran the steps.</text><text x="393" y="836" fill="#0f172a" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Only say CQRS if we had a separate read store.</text><rect x="778" y="88" width="730" height="820" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/><text x="1143" y="124" fill="#1e3a5f" font-size="18" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Orchestration — one coordinator</text><text x="1143" y="148" fill="#475569" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">A saga orchestrator calls each step and stores saga state.</text><rect x="918" y="170" width="450" height="56" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="1143" y="203" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1  Order API — local commit</text><line x1="1143" y1="226" x2="1143" y2="259" stroke="#0f172a" stroke-width="2.4"/><polygon points="1137,249 1149,249 1143,259" fill="#0f172a"/><rect x="918" y="262" width="450" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="1143" y="295" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2  Saga orchestrator (state machine)</text><line x1="1143" y1="318" x2="1143" y2="351" stroke="#0f172a" stroke-width="2.4"/><polygon points="1137,341 1149,341 1143,351" fill="#0f172a"/><rect x="798" y="354" width="210" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="903" y="394" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">call Inventory</text><rect x="1038" y="354" width="210" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="1143" y="394" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">then Payment</text><rect x="1278" y="354" width="210" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="1383" y="394" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">then Shipping</text><text x="1143" y="454" fill="#9f1239" font-size="13" font-weight="600" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Fail at Payment → orchestrator runs compensate (release stock, cancel order)</text><rect x="918" y="474" width="450" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="1143" y="507" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3  Compensate in reverse order</text><text x="1143" y="560" fill="#475569" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Do not claim this unless YOUR project had a saga class / durable function.</text><rect x="918" y="576" width="450" height="56" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/><text x="1143" y="609" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">CQRS = write model ≠ read model</text><text x="1143" y="668" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Trap: one SQL database is not CQRS. Event bus is not Kafka unless you ran Kafka.</text><rect x="838" y="688" width="610" height="180" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/><text x="1143" y="728" fill="#1e3a5f" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="1143" y="758" fill="#0f172a" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Need the answer now → HTTP + service token.</text><text x="1143" y="784" fill="#0f172a" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Can wait → queue. After SaveChanges, publish a small event.</text><text x="1143" y="810" fill="#0f172a" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">10MB body → S3, send the key. Never a distributed BEGIN TRAN.</text><text x="1143" y="836" fill="#0f172a" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Count YOUR services. Do not invent a fifth.</text><text x="768" y="940" fill="#334155" font-size="14" font-weight="600" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Source: Azure saga pattern (choreography vs orchestration) + publisher-subscriber + CQRS. Same as C16 story: local commit, then event, compensate on fail.</text><text x="768" y="968" fill="#475569" font-size="13" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Open the Microsoft diagram in the interview if they ask you to draw it — then map YOUR boxes onto it.</text><text x="768" y="996" fill="#64748b" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">https://learn.microsoft.com/azure/architecture/patterns/saga</text>
</svg>
