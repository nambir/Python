sans-serif"><tspan x="1196" dy="0">only cookies</tspan></text><text x="1350" y="858" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">session / ViewState</tspan></text><rect x="1035" y="909" width="461" height="83" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="941" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Data</tspan></text><text x="1196" y="941" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">EF only</tspan></text><text x="1350" y="941" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">ADO + EF split</tspan></text>
