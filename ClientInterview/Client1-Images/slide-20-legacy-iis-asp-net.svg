dentity + recycle</tspan></text><rect x="16" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="38" cy="360" r="11" fill="#7c3aed"/><text x="38" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="56" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Ops lines</text><rect x="28" y="378" width="722" height="28" rx="8" fill="#f3e8ff"/><text x="38" y="397" fill="#6b21a8" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Change control first.</text><rect x="28" y="410" width="722" height="184" rx="8" fill="#0f172a"/><text x="40" y="436" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">Get-WebAppPoolState AppName</text><text x="40" y="476" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">Stop-WebAppPool AppName   # copy files</text><text x="40" y="516" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">Start-WebAppPool AppName</text><text x="40" y="556" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># avoid: iisreset</text><rect x="774" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="796" cy="360" r="11" fill="#ea580c"/><text x="796" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="814" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Also on this panel</text><rect x="786" y="378" width="722" height="28" rx="8" fill="#ffedd5"/><text x="796" y="397" fill="#9a3412" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Same JWT questions as core.</text><circle cx="792" cy="427" r="4" fill="#2563eb"/><text x="802" y="423" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="802" dy="0">ADO/Dapper for heavy SPs; EF for CRUD —</tspan><tspan x="802" dy="15">say why</tspan></text><circle cx="792" cy="489" r="4" fill="#2563eb"/><text x="802" y="485" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="802" dy="0">JWT tamper/expiry still asked on this</tspan><tspan x="802" dy="15">panel</tspan></text><circle cx="792" cy="550" r="4" fill="#2563eb"/><text x="802" y="546" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="802" dy="0">Debug JS / CSS not applying is fair game</tspan></text><rect x="16" y="618" width="1504" height="398" rx="12" fill="#fff" stroke="#e11d48" stroke-width="1.5"/><circle cx="38" cy="640" r="11" fill="#e11d48"/><text x="38" y="644" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="56" y="645" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice &amp; comparison</text><rect x="28" y="658" width="1480" height="28" rx="8" fill="#ffe4e6"/><text x="38" y="677" fill="#9f1239" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Prefer Dapper/ADO when the SP is the product.</text><rect x="28" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#fda4af" stroke-width="1.5"/><text x="40" y="710" fill="#9f1239" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">RCA</text><rect x="40" y="718" width="461" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="750" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family