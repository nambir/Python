<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><text x="768" y="28" fill="#1e3a5f" font-size="24" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Angular Component Communication  –  Visual Guide</text><text x="768" y="48" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Client1 · C05  ·  1 Input  ·  2 Emitter  ·  3 RxJS  ·  4 Route</text><rect x="16" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="38" cy="80" r="11" fill="#2563eb"/><text x="38" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="56" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Four ways only</text><rect x="28" y="98" width="469" height="28" rx="8" fill="#dbeafe"/><text x="38" y="117" fill="#1e40af" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Properties, emitter, RxJS, route. That is the list.</text><circle cx="263" cy="222" r="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="263" y="227" fill="#5b21b6" font-size="13" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">this screen</text><line x1="263" y1="222" x2="263" y2="144" stroke="#7c3aed" stroke-width="2.4"  stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="215" y="132" width="96" height="24" rx="8" fill="#86efac"/><text x="263" y="149" fill="#166534" font-size="11" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1 @Input field</text><line x1="263" y1="222" x2="439" y2="222" stroke="#7c3aed" stroke-width="2.4"  stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="391" y="210" width="96" height="24" rx="8" fill="#86efac"/><text x="439" y="227" fill="#166534" font-size="11" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2 EventEmitter</text><line x1="263" y1="222" x2="263" y2="298" stroke="#7c3aed" stroke-width="2.4"  stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="215" y="286" width="96" height="24" rx="8" fill="#86efac"/><text x="263" y="303" fill="#166534" font-size="11" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3 RxJS store</text><line x1="263" y1="222" x2="86" y2="222" stroke="#7c3aed" stroke-width="2.4"  stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="38" y="210" width="96" height="24" rx="8" fill="#86efac"/><text x="86" y="227" fill="#166534" font-size="11" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4 route id</text><rect x="521" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><circle cx="543" cy="80" r="11" fill="#16a34a"/><text x="543" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="561" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Pick by relationship</text><rect x="533" y="98" width="469" height="28" rx="8" fill="#dcfce7"/><text x="543" y="117" fill="#166534" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Parent template = 1+2. No parent = 3. New URL = 4.</text><rect x="533" y="130" width="469" height="26" rx="4" fill="#4338ca" stroke="#cbd5e1" stroke-width="1"/><text x="541" y="148" fill="#fff" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Path</text><text x="776" y="148" fill="#fff" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Use when</text><rect x="533" y="156" width="469" height="40" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="541" y="171" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="541" dy="0">1 @Input</tspan></text><text x="776" y="171" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="776" dy="0">Parent sets a field on the child</tspan></text><rect x="533" y="196" width="469" height="40" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="541" y="211" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="541" dy="0">2 Emitter</tspan></text><text x="776" y="211" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="776" dy="0">Child EventEmitter, parent</tspan><tspan x="776" dy="15">listens</tspan></text><rect x="533" y="235" width="469" height="40" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="541" y="250" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="541" dy="0">3 RxJS</tspan></text><text x="776" y="250" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="776" dy="0">Root service + BehaviorSubject</tspan></text><rect x="533" y="274" width="469" height="40" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="541" y="290" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="541" dy="0">4 Route</tspan></text><text x="776" y="290" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="776" dy="0">Navigate with id, not the token</tspan></text><rect x="1027" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="1049" cy="80" r="11" fill="#4f46e5"/><text x="1049" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1067" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Trap</text><rect x="1039" y="98" width="469" height="28" rx="8" fill="#ede9fe"/><text x="1049" y="117" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Query string is not a session.</text><rect x="1039" y="130" width="230" height="184" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><circle cx="1053" cy="146" r="8" fill="#dc2626"/><text x="1053" y="150" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="1067" y="151" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Secrets in the URL</text><rect x="1049" y="166" width="210" height="138" rx="6" fill="#fff" stroke="#fecaca" stroke-width="1"/><text x="1057" y="190" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1057" dy="0">queryParams: { token, ssn</tspan><tspan x="1057" dy="16">}</tspan></text><text x="1057" y="232" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1057" dy="0">Child injects parent</tspan></text><text x="1057" y="274" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1057" dy="0">Chain Inputs across lazy</tspan><tspan x="1057" dy="16">modules</tspan></text><rect x="1278" y="130" width="230" height="184" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><circle cx="1292" cy="146" r="8" fill="#16a34a"/><text x="1292" y="150" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="1306" y="151" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Id + store</text><rect x="1288" y="166" width="210" height="138" rx="6" fill="#fff" stroke="#bbf7d0" stroke-width="1"/><text x="1296" y="190" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1296" dy="0">navigate({ state: { id }</tspan><tspan x="1296" dy="16">})</tspan></text><text x="1296" y="232" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1296" dy="0">BehaviorSubject last value</tspan></text><text x="1296" y="274" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1296" dy="0">Resolver loads by id</tspan></text><rect x="16" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="38" cy="360" r="11" fill="#7c3aed"/><text x="38" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="56" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Parent ↔ child</text><rect x="28" y="378" width="722" height="28" rx="8" fill="#f3e8ff"/><text x="38" y="397" fill="#6b21a8" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Template is the contract.</text><rect x="28" y="410" width="722" height="144" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="38" y="428" fill="#3730a3" font-size="12" font-weight="800" text-anchor="start" font-family="Consolas,Menlo,monospace">user-editor</text><text x="38" y="462" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">@Input() user!: User;</text><text x="38" y="493" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">ngOnInit() { this.user.name }</text><text x="38" y="525" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">{{ user.email }} in child html</text><rect x="28" y="562" width="722" height="32" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/><text x="38" y="584" fill="#334155" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">Child template: {{ user.name }}  Parent: [user]=&quot;row&quot;</text><rect x="774" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="796" cy="360" r="11" fill="#ea580c"/><text x="796" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="814" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Module to module</text><rect x="786" y="378" width="722" height="28" rx="8" fill="#ffedd5"/><text x="796" y="397" fill="#9a3412" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Id in the route; payload in a store.</text><rect x="786" y="462" width="222" height="48" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.6"/><text x="897" y="494" fill="#1e40af" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Users module</text><line x1="1010" y1="486" x2="1034" y2="486" stroke="#1e40af" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="1036" y="462" width="222" height="48" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="1147" y="494" fill="#166534" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">SelectionStore</text><line x1="1260" y1="486" x2="1284" y2="486" stroke="#1e40af" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="1286" y="462" width="222" height="48" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.6"/><text x="1397" y="494" fill="#9a3412" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Facility module</text><rect x="16" y="618" width="1504" height="398" rx="12" fill="#fff" stroke="#e11d48" stroke-width="1.5"/><circle cx="38" cy="640" r="11" fill="#e11d48"/><text x="38" y="644" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="56" y="645" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice &amp; comparison</text><rect x="28" y="658" width="1480" height="28" rx="8" fill="#ffe4e6"/><text x="38" y="677" fill="#9f1239" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Draw it for the screen you built.</text><rect x="28" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#fda4af" stroke-width="1.5"/><text x="40" y="710" fill="#9f1239" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Draw three paths</text><rect x="40" y="718" width="461" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="750" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// Input / Output on one screen</text><text x="50" y="800" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// Subject for unrelated</text><rect x="40" y="851" width="461" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="883" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// Never PII in query string</text><rect x="525" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#86efac" stroke-width="1.5"/><text x="537" y="714" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do</text><circle cx="545" cy="747" r="7" fill="#16a34a"/><text x="545" y="751" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="559" y="741" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Name all three for ONE screen</tspan></text><circle cx="545" cy="810" r="7" fill="#16a34a"/><text x="545" y="814" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="559" y="804" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Module-to-module = root store</tspan></text><text x="537" y="857" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><circle cx="545" cy="889" r="7" fill="#dc2626"/><text x="545" y="893" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="559" y="883" fill="#7f1d1d" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Inject the parent component</tspan></text><circle cx="545" cy="952" r="7" fill="#dc2626"/><text x="545" y="956" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="559" y="946" fill="#7f1d1d" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Token in the URL</tspan></text><rect x="1023" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/><text x="1035" y="710" fill="#6d28d9" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Quick C# comparison</text><rect x="1035" y="718" width="461" height="26" rx="4" fill="#f3e8ff" stroke="#cbd5e1" stroke-width="1"/><text x="1043" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Concept</text><text x="1196" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">C#</text><text x="1350" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interview</text><rect x="1035" y="744" width="461" height="83" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="775" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Down</tspan></text><text x="1196" y="775" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">service field</tspan></text><text x="1350" y="775" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">@Input bind</tspan></text><rect x="1035" y="827" width="461" height="83" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="858" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Up</tspan></text><text x="1196" y="858" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">callback soup</tspan></text><text x="1350" y="858" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">@Output EventEmitter</tspan></text><rect x="1035" y="909" width="461" height="83" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="941" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Side</tspan></text><text x="1196" y="941" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">copy via URL</tspan></text><text x="1350" y="941" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">providedIn root</tspan></text>
