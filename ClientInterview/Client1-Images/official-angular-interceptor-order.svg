<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1180" width="1536">
  <rect width="1536" height="1180" fill="#ffffff"/>
  <text x="768" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Three paths — Angular URL, logged-in API, no token</text>
  <text x="768" y="60" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">Opening a page = guard. HttpClient = interceptors. No token = interceptor still runs, but adds no Bearer — the API returns 401. Request down, response up.</text>
<rect x="12" y="76" width="496" height="1048" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><rect x="12" y="76" width="496" height="46" rx="14" fill="#1e3a5f"/><rect x="12" y="100" width="496" height="22" fill="#1e3a5f"/><text x="260" y="106" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">Scenario 1 — Angular URL</text><rect x="520" y="76" width="496" height="1048" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><rect x="520" y="76" width="496" height="46" rx="14" fill="#0f766e"/><rect x="520" y="100" width="496" height="22" fill="#0f766e"/><text x="768" y="106" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">Scenario 2 — API (logged in)</text><rect x="1028" y="76" width="496" height="1048" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><rect x="1028" y="76" width="496" height="46" rx="14" fill="#9a3412"/><rect x="1028" y="100" width="496" height="22" fill="#9a3412"/><text x="1276" y="106" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">Scenario 3 — no token</text><rect x="36" y="136" width="448" height="64" rx="10" fill="#fff" stroke="#1e3a5f" stroke-width="2.2"/><text x="260.0" y="158" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Browser → /admin</text><text x="260.0" y="178" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">https://app.client1.local/admin</text><text x="260.0" y="194" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">SPA loads index.html. No API yet.</text><rect x="36" y="236" width="448" height="56" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2.2"/><text x="260.0" y="258" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Router matches /admin</text><text x="260.0" y="278" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Picks canActivate on that route</text><rect x="36" y="328" width="448" height="84" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2.2"/><text x="260.0" y="350" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">AuthGuard — logged in?</text><text x="260.0" y="370" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Reads token from storage.</text><text x="260.0" y="386" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">NOT AuthInterceptor. No HTTP.</text><rect x="36" y="448" width="448" height="62" rx="10" fill="#fff" stroke="#0f172a" stroke-width="2.2"/><text x="260.0" y="470" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">AdminComponent created</text><text x="260.0" y="490" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">constructor = DI only</text><rect x="36" y="546" width="448" height="72" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="260.0" y="568" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">ngOnInit → this.api.list()</text><text x="260.0" y="588" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">HttpClient. Interceptors start now.</text><text x="260.0" y="604" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">Continue → Scenario 2</text><line x1="260" y1="203" x2="260" y2="221" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/><polygon points="251,220 269,220 260,233" fill="#0f172a"/><line x1="260" y1="295" x2="260" y2="313" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/><polygon points="251,312 269,312 260,325" fill="#0f172a"/><line x1="260" y1="415" x2="260" y2="433" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/><polygon points="251,432 269,432 260,445" fill="#0f172a"/><line x1="260" y1="513" x2="260" y2="531" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/><polygon points="251,530 269,530 260,543" fill="#0f172a"/><rect x="36" y="640" width="448" height="460" rx="10" fill="#fef2f2" stroke="#dc2626"/><text x="260" y="672" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#991b1b">Does NOT run on an Angular URL</text><text x="56" y="708" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#7f1d1d">• AuthInterceptor — no Bearer (no HTTP yet)</text><text x="56" y="736" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#7f1d1d">• LoggingInterceptor — nothing on the wire</text><text x="56" y="764" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#7f1d1d">• ErrorInterceptor — no HTTP yet, nothing to toast</text><text x="56" y="808" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#7f1d1d">Say: “Opening /admin is the guard.</text><text x="56" y="832" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#7f1d1d">The interceptor starts when the screen</text><text x="56" y="856" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#7f1d1d">calls the service.”</text><text x="56" y="900" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#7f1d1d">If the guard finds no token → /login.</text><text x="56" y="924" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#7f1d1d">Component is never created. That is</text><text x="56" y="948" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#7f1d1d">Scenario 3 fork A — not this happy path.</text><text x="544" y="132" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#0f766e">REQ ↓</text><text x="996" y="132" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#64748b">RES ↑</text><rect x="568" y="140" width="400" height="56" rx="10" fill="#fff" stroke="#0f172a" stroke-width="2.2" stroke-dasharray="7 4"/><text x="768.0" y="162" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">HttpClient · this.api.list()</text><text x="768.0" y="182" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Component never calls intercept()</text><rect x="568" y="232" width="400" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2.2"/><text x="768.0" y="254" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">AuthInterceptor</text><text x="768.0" y="274" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Logged-in: clone + Authorization: Bearer</text><text x="768.0" y="290" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">401 on the way up: refresh once, retry</text><rect x="568" y="348" width="400" height="68" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.2"/><text x="768.0" y="370" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">LoggingInterceptor</text><text x="768.0" y="390" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Log method + URL + status</text><text x="768.0" y="406" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">Never log the Bearer token</text><rect x="568" y="452" width="400" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/><text x="768.0" y="474" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">ErrorInterceptor</text><text x="768.0" y="494" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">500 / network fail → toast once</text><text x="768.0" y="510" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">Leave 401 to Auth (refresh). Not a guard.</text><rect x="568" y="564" width="400" height="52" rx="10" fill="#fff" stroke="#0f172a" stroke-width="2.2"/><text x="768.0" y="586" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">HttpBackend</text><text x="768.0" y="606" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Last stop in Angular</text><rect x="568" y="652" width="400" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7 4"/><text x="768.0" y="674" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">.NET API · [Authorize]</text><text x="768.0" y="694" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Real lock: signature + exp + roles</text><line x1="544" y1="199" x2="544" y2="217" stroke="#0f766e" stroke-width="3.5" stroke-linecap="round"/><polygon points="535,216 553,216 544,229" fill="#0f766e"/><line x1="544" y1="315" x2="544" y2="333" stroke="#0f766e" stroke-width="3.5" stroke-linecap="round"/><polygon points="535,332 553,332 544,345" fill="#0f766e"/><line x1="544" y1="419" x2="544" y2="437" stroke="#0f766e" stroke-width="3.5" stroke-linecap="round"/><polygon points="535,436 553,436 544,449" fill="#0f766e"/><line x1="544" y1="531" x2="544" y2="549" stroke="#0f766e" stroke-width="3.5" stroke-linecap="round"/><polygon points="535,548 553,548 544,561" fill="#0f766e"/><line x1="544" y1="619" x2="544" y2="637" stroke="#0f766e" stroke-width="3.5" stroke-linecap="round"/><polygon points="535,636 553,636 544,649" fill="#0f766e"/><line x1="996" y1="229" x2="996" y2="211" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><polygon points="987,212 1005,212 996,199" fill="#64748b"/><line x1="996" y1="345" x2="996" y2="327" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><polygon points="987,328 1005,328 996,315" fill="#64748b"/><line x1="996" y1="449" x2="996" y2="431" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><polygon points="987,432 1005,432 996,419" fill="#64748b"/><line x1="996" y1="561" x2="996" y2="543" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><polygon points="987,544 1005,544 996,531" fill="#64748b"/><line x1="996" y1="649" x2="996" y2="631" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><polygon points="987,632 1005,632 996,619" fill="#64748b"/><rect x="568" y="740" width="400" height="360" rx="10" fill="#ecfdf5" stroke="#0f766e"/><text x="768" y="768" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#115e59">Register once (request order)</text><text x="584" y="800" font-family="Consolas,Menlo,monospace" font-size="12" fill="#134e4a">withInterceptors([</text><text x="584" y="824" font-family="Consolas,Menlo,monospace" font-size="12" fill="#134e4a">  authInterceptor,</text><text x="584" y="848" font-family="Consolas,Menlo,monospace" font-size="12" fill="#134e4a">  loggingInterceptor,</text><text x="584" y="872" font-family="Consolas,Menlo,monospace" font-size="12" fill="#134e4a">  errorInterceptor</text><text x="584" y="896" font-family="Consolas,Menlo,monospace" font-size="12" fill="#134e4a">])</text><text x="584" y="936" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#115e59">Left gutter = request down.</text><text x="584" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#115e59">Right gutter = response up.</text><text x="584" y="990" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#115e59">Arrow heads sit in the 36px gap.</text><text x="1276" y="140" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#9a3412">Same chain as Scenario 2 — storage is empty.</text><rect x="1052" y="156" width="448" height="52" rx="10" fill="#fff" stroke="#9a3412" stroke-width="2.2"/><text x="1276.0" y="178" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">A) Open /admin — no token</text><text x="1276.0" y="198" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Angular URL, same as Scenario 1</text><rect x="1052" y="244" width="448" height="48" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2.2"/><text x="1276.0" y="266" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Router matches /admin</text><text x="1276.0" y="286" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">canActivate still runs</text><rect x="1052" y="328" width="448" height="72" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="2.2"/><text x="1276.0" y="350" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">AuthGuard: no token</text><text x="1276.0" y="370" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Redirect → /login</text><text x="1276.0" y="386" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">AdminComponent is NEVER created</text><rect x="1052" y="436" width="448" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/><text x="1276.0" y="458" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">STOP — no interceptors</text><text x="1276.0" y="478" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Guard blocked the page. No HTTP.</text><line x1="1276" y1="211" x2="1276" y2="229" stroke="#9a3412" stroke-width="3.5" stroke-linecap="round"/><polygon points="1267,228 1285,228 1276,241" fill="#9a3412"/><line x1="1276" y1="295" x2="1276" y2="313" stroke="#9a3412" stroke-width="3.5" stroke-linecap="round"/><polygon points="1267,312 1285,312 1276,325" fill="#9a3412"/><line x1="1276" y1="403" x2="1276" y2="421" stroke="#9a3412" stroke-width="3.5" stroke-linecap="round"/><polygon points="1267,420 1285,420 1276,433" fill="#9a3412"/><rect x="1052" y="520" width="448" height="52" rx="10" fill="#fff" stroke="#0f172a" stroke-width="2.2" stroke-dasharray="7 4"/><text x="1276.0" y="542" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">B) Public page still calls API</text><text x="1276.0" y="562" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">HttpClient runs. Interceptors DO run.</text><rect x="1052" y="608" width="448" height="72" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2.2"/><text x="1276.0" y="630" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">AuthInterceptor: no Bearer</text><text x="1276.0" y="650" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">No token → pass through (do not fake one)</text><text x="1276.0" y="666" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">Not a guard. Request still goes out.</text><rect x="1052" y="716" width="448" height="52" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.2"/><text x="1276.0" y="738" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">LoggingInterceptor</text><text x="1276.0" y="758" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Still logs GET /api/… → 401</text><rect x="1052" y="804" width="448" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/><text x="1276.0" y="826" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">ErrorInterceptor</text><text x="1276.0" y="846" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">May toast 401; Auth has nothing to refresh</text><rect x="1052" y="892" width="448" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7 4"/><text x="1276.0" y="914" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">.NET API → 401</text><text x="1276.0" y="934" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">No Authorization header. Real lock.</text><line x1="1276" y1="575" x2="1276" y2="593" stroke="#9a3412" stroke-width="3.5" stroke-linecap="round"/><polygon points="1267,592 1285,592 1276,605" fill="#9a3412"/><line x1="1276" y1="683" x2="1276" y2="701" stroke="#9a3412" stroke-width="3.5" stroke-linecap="round"/><polygon points="1267,700 1285,700 1276,713" fill="#9a3412"/><line x1="1276" y1="771" x2="1276" y2="789" stroke="#9a3412" stroke-width="3.5" stroke-linecap="round"/><polygon points="1267,788 1285,788 1276,801" fill="#9a3412"/><line x1="1276" y1="859" x2="1276" y2="877" stroke="#9a3412" stroke-width="3.5" stroke-linecap="round"/><polygon points="1267,876 1285,876 1276,889" fill="#9a3412"/><rect x="1052" y="976" width="448" height="124" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="1276" y="1004" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#9a3412">Guard vs interceptor (no token)</text><text x="1068" y="1032" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#7c2d12">Guard on /admin: page never opens → /login.</text><text x="1068" y="1054" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#7c2d12">Interceptor on HTTP: call still leaves; API 401s.</text><text x="1068" y="1076" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#7c2d12">Nothing to refresh — send the user to login.</text><text x="768" y="1148" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">1 = may I open this page?  2 = stamp Bearer on HTTP.  3 = no token: guard blocks the page; interceptor does not invent a token — API 401.</text><text x="768" y="1170" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Onion from Angular HTTP docs. Real project: Auth (Bearer) + Logging + Error (toast). Last hop is always HttpBackend, then the server.</text></svg>
