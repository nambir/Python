<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Login Flow and Tokens  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Angular  ·  A04  ·  User submits credentials to the API. The API returns tokens. Angular stores them, attaches the access token on</text><rect x="16" y="78" width="747" height="303" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="16" y="78" width="7" height="303" rx="0" fill="#7c3aed"/><circle cx="44" cy="100" r="12" fill="#7c3aed"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Login → token → API</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Name each box, then the hand-off.</tspan></text><rect x="30" y="146" width="172" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="116" y="174" fill="#1e40af" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="116" dy="0">Login API</tspan></text><line x1="202" y1="178" x2="212" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="212" y="146" width="172" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="298" y="174" fill="#166534" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="298" dy="0">Store tokens</tspan></text><line x1="384" y1="178" x2="394" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="394" y="146" width="172" height="64" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="481" y="174" fill="#9a3412" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="481" dy="0">Interceptor Bearer</tspan></text><line x1="567" y1="178" x2="577" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="577" y="146" width="172" height="64" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="663" y="174" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="663" dy="0">Refresh on 401</tspan></text><text x="30" y="226" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">Name each box, then the hand-off. Walks the full chain and says what happens when the access token</tspan><tspan x="30" dy="13">expires</tspan></text><rect x="773" y="78" width="747" height="303" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="773" y="78" width="7" height="303" rx="0" fill="#ea580c"/><circle cx="801" cy="100" r="12" fill="#ea580c"/><text x="801" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="819" y="105" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What contains what</text><text x="789" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Outer box owns the inner ones.</tspan></text><rect x="787" y="146" width="719" height="223" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="797" y="164" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Login API</text><rect x="815" y="174" width="663" height="168" rx="10" fill="#bfdbfe" stroke="#1e40af" stroke-width="1.5"/><text x="825" y="192" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Store tokens</text><rect x="843" y="202" width="607" height="112" rx="10" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/><text x="853" y="220" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interceptor Bearer</text><rect x="871" y="230" width="552" height="56" rx="10" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/><text x="881" y="248" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Refresh on 401</text><rect x="16" y="391" width="747" height="303" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="391" width="7" height="303" rx="0" fill="#dc2626"/><circle cx="44" cy="413" r="12" fill="#dc2626"/><text x="44" y="417" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="62" y="418" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Numbers / interview drill</text><text x="32" y="433" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">What / where / why / how.</tspan></text><rect x="30" y="459" width="356" height="108" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="40" y="477" fill="#1e40af" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">1</text><text x="40" y="497" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Access token</text><text x="40" y="517" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">Short-lived JWT sent as Authorization:</tspan><tspan x="40" dy="12">Bearer. Proves the caller to the API.</tspan></text><rect x="394" y="459" width="356" height="108" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="404" y="477" fill="#166534" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">2</text><text x="404" y="497" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Refresh token</text><text x="404" y="517" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="404" dy="0">Longer-lived; used only against the token</tspan><tspan x="404" dy="12">endpoint, not on every API.</tspan></text><rect x="30" y="575" width="356" height="108" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="40" y="593" fill="#9a3412" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">3</text><text x="40" y="613" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Expiry</text><text x="40" y="633" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">Interceptor sees 401 → try refresh once →</tspan><tspan x="40" dy="12">retry original request → else logout.</tspan></text><rect x="394" y="575" width="356" height="108" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="404" y="593" fill="#854d0e" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">4</text><text x="404" y="613" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Backend still rules</text><text x="404" y="633" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="404" dy="0">A stolen token is still validated</tspan><tspan x="404" dy="12">server-side. Frontend storage is not</tspan><tspan x="404" dy="12">security by itself.</tspan></text><rect x="773" y="391" width="747" height="303" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="773" y="391" width="7" height="303" rx="0" fill="#2563eb"/><circle cx="801" cy="413" r="12" fill="#2563eb"/><text x="801" y="417" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="819" y="418" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When A vs when B</text><text x="789" y="433" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Pick a path with a project example.</tspan></text><polygon points="1146,467 1216,507 1146,547 1076,507" fill="#fef9c3" stroke="#b45309" stroke-width="1.8"/><text x="1146" y="511" fill="#b45309" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Which?</text><rect x="787" y="559" width="345" height="115" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><rect x="1161" y="559" width="345" height="115" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="797" y="581" fill="#1e40af" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Access token</text><text x="797" y="603" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="797" dy="0">Short-lived JWT sent as Authorization:</tspan><tspan x="797" dy="13">Bearer. Proves the caller to the API.</tspan></text><text x="1171" y="581" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Refresh token</text><text x="1171" y="603" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1171" dy="0">Longer-lived; used only against the token</tspan><tspan x="1171" dy="13">endpoint, not on every API.</tspan></text><rect x="16" y="705" width="747" height="303" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="16" y="705" width="7" height="303" rx="0" fill="#16a34a"/><circle cx="44" cy="727" r="12" fill="#16a34a"/><text x="44" y="731" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="62" y="732" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Compare — pick with a reason</text><text x="32" y="747" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Say the criterion, then the choice.</tspan></text><rect x="30" y="773" width="719" height="28" rx="6" fill="#1e3a5f"/><text x="36" y="792" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Idea</text><text x="396" y="792" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><rect x="30" y="801" width="719" height="28" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="820" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Access token</text><text x="396" y="820" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Short-lived JWT sent</text><rect x="30" y="829" width="719" height="28" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="848" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Refresh token</text><text x="396" y="848" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Longer-lived; used o</text><rect x="30" y="857" width="719" height="28" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="876" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Expiry</text><text x="396" y="876" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interceptor sees 401</text><rect x="30" y="885" width="719" height="28" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="904" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Backend still rules</text><text x="396" y="904" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">A stolen token is st</text><rect x="773" y="705" width="747" height="303" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="773" y="705" width="7" height="303" rx="0" fill="#4f46e5"/><circle cx="801" cy="727" r="12" fill="#4f46e5"/><text x="801" y="731" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="819" y="732" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The scale you must name</text><text x="789" y="747" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Set one level; everything below it goes quiet — or name the lifetime.</tspan></text><rect x="787" y="773" width="719" height="50" rx="8" fill="#2563eb"/><text x="799" y="795" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Access token</text><text x="799" y="812" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Short-lived JWT sent as Authorization: B</text><rect x="787" y="830" width="661" height="50" rx="8" fill="#16a34a"/><text x="799" y="853" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Refresh token</text><text x="799" y="869" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Longer-lived; used only against the toke</text><rect x="787" y="888" width="604" height="50" rx="8" fill="#4f46e5"/><text x="799" y="911" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Expiry</text><text x="799" y="927" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interceptor sees 401 → try refresh once </text><rect x="787" y="946" width="546" height="50" rx="8" fill="#7c3aed"/><text x="799" y="969" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Backend still rules</text><text x="799" y="985" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">A stolen token is still validated server</text>
</svg>
