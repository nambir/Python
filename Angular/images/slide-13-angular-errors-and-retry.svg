<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#15803d"/><text x="28" y="36" fill="#15803d" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Angular  ·  A13  ·  before after</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Angular Errors and Retry</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">Users should not see stack traces. The interceptor (or a global ErrorHandler) maps failures. Retry only idempotent reads. Payments and deletes need</tspan><tspan x="28" dy="17">the API’s idempotency story.</tspan></text><rect x="28" y="140" width="730" height="760" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><rect x="778" y="140" width="730" height="760" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="56" y="190" fill="#b91c1c" font-size="24" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Before — alert(err.message)</text><text x="56" y="240" fill="#7f1d1d" font-size="18" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="56" dy="0">error: err =&gt; alert(err)</tspan></text><text x="56" y="560" fill="#b91c1c" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What it sounds like</text><text x="56" y="600" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">catchError(err =&gt; {</text><text x="56" y="624" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  if (err.status === 401) this.auth.logout();</text><text x="56" y="648" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  else this.toasts.show('Something went wrong', err.</text><text x="56" y="672" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  return EMPTY;</text><text x="56" y="696" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">})</text><text x="806" y="190" fill="#166534" font-size="24" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">After — do this</text><text x="806" y="240" fill="#14532d" font-size="18" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="806" dy="0">Map status → message; log details; retry GET</tspan><tspan x="806" dy="22">only.</tspan></text><text x="806" y="520" fill="#166534" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Path to say</text><rect x="806" y="550" width="670" height="58" rx="10" fill="#fff" stroke="#166534" stroke-width="1.5"/><circle cx="836" cy="579" r="16" fill="#166534"/><text x="836" y="585" fill="#fff" font-size="13" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="864" y="585" fill="#166534" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">HTTP error</text><rect x="806" y="620" width="670" height="58" rx="10" fill="#fff" stroke="#166534" stroke-width="1.5"/><circle cx="836" cy="579" r="16" fill="#166534"/><text x="836" y="585" fill="#fff" font-size="13" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="864" y="585" fill="#166534" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Friendly text</text><rect x="806" y="690" width="670" height="58" rx="10" fill="#fff" stroke="#166534" stroke-width="1.5"/><circle cx="836" cy="579" r="16" fill="#166534"/><text x="836" y="585" fill="#fff" font-size="13" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="864" y="585" fill="#166534" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Trace id</text><rect x="806" y="760" width="670" height="58" rx="10" fill="#fff" stroke="#166534" stroke-width="1.5"/><circle cx="836" cy="579" r="16" fill="#166534"/><text x="836" y="585" fill="#fff" font-size="13" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="864" y="585" fill="#166534" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Retry only safe</text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Maps 401/403/5xx and names one retry they would refuse</tspan></text>
</svg>
