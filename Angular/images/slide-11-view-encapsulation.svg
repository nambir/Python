<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">View Encapsulation  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Angular  ·  A11  ·  View encapsulation controls whether a component’s CSS can leak. Default Emulated scopes styles with attributes</text><rect x="16" y="78" width="1504" height="210" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="16" y="78" width="7" height="210" rx="0" fill="#ea580c"/><circle cx="44" cy="100" r="12" fill="#ea580c"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Compare — pick with a reason</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Say the criterion, then the choice.</tspan></text><rect x="30" y="146" width="1476" height="24" rx="6" fill="#1e3a5f"/><text x="36" y="163" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Idea</text><text x="774" y="163" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><rect x="30" y="170" width="1476" height="24" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="187" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Emulated</text><text x="774" y="187" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Default. Styles stay</text><rect x="30" y="195" width="1476" height="24" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="212" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ShadowDom</text><text x="774" y="212" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">True isolation; some</text><rect x="30" y="219" width="1476" height="24" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="236" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">None</text><text x="774" y="236" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Component CSS become</text><rect x="30" y="244" width="1476" height="24" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="261" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">::ng-deep</text><text x="774" y="261" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Deprecated piercing.</text><rect x="16" y="298" width="495" height="355" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="298" width="7" height="355" rx="0" fill="#dc2626"/><circle cx="44" cy="320" r="12" fill="#dc2626"/><text x="44" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="62" y="325" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Inside the system</text><text x="32" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Top to bottom, then the hand-off.</tspan></text><rect x="30" y="366" width="467" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="42" y="393" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Emulated</text><text x="42" y="412" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Default. Styles stay in the component unless you</text><text x="263" y="435" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="30" y="436" width="467" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="42" y="463" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ShadowDom</text><text x="42" y="483" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">True isolation; some global CSS and third-party </text><text x="263" y="506" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="30" y="506" width="467" height="64" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="42" y="533" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">None</text><text x="42" y="553" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Component CSS becomes global — last resort for a</text><text x="263" y="576" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="30" y="577" width="467" height="64" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="42" y="604" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">::ng-deep</text><text x="42" y="623" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Deprecated piercing. Prefer a shared stylesheet </text><rect x="521" y="298" width="495" height="355" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="521" y="298" width="7" height="355" rx="0" fill="#2563eb"/><circle cx="549" cy="320" r="12" fill="#2563eb"/><text x="549" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="567" y="325" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What contains what</text><text x="537" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Outer box owns the inner ones.</tspan></text><rect x="535" y="366" width="467" height="275" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="545" y="384" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Emulated default</text><rect x="569" y="400" width="398" height="206" rx="10" fill="#bfdbfe" stroke="#1e40af" stroke-width="1.5"/><text x="579" y="418" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ShadowDom</text><rect x="603" y="435" width="329" height="138" rx="10" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/><text x="613" y="453" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">None = leak</text><rect x="638" y="469" width="260" height="69" rx="10" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/><text x="648" y="487" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Avoid ::ng-deep</text><rect x="1025" y="298" width="495" height="355" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="1025" y="298" width="7" height="355" rx="0" fill="#16a34a"/><circle cx="1053" cy="320" r="12" fill="#16a34a"/><text x="1053" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="1071" y="325" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Numbers / interview drill</text><text x="1041" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">What / where / why / how.</tspan></text><rect x="1039" y="366" width="229" height="134" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="1049" y="384" fill="#1e40af" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">1</text><text x="1049" y="404" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Emulated</text><text x="1049" y="424" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1049" dy="0">Default. Styles stay in the</tspan><tspan x="1049" dy="12">component unless you pierce</tspan><tspan x="1049" dy="12">them.</tspan></text><rect x="1277" y="366" width="229" height="134" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="1287" y="384" fill="#166534" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">2</text><text x="1287" y="404" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ShadowDom</text><text x="1287" y="424" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1287" dy="0">True isolation; some global</tspan><tspan x="1287" dy="12">CSS and third-party widgets</tspan><tspan x="1287" dy="12">may break.</tspan></text><rect x="1039" y="508" width="229" height="134" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="1049" y="526" fill="#9a3412" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1049" y="546" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">None</text><text x="1049" y="566" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1049" dy="0">Component CSS becomes global</tspan><tspan x="1049" dy="12">— last resort for a</tspan><tspan x="1049" dy="12">third-party widget.</tspan></text><rect x="1277" y="508" width="229" height="134" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="1287" y="526" fill="#854d0e" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">4</text><text x="1287" y="546" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">::ng-deep</text><text x="1287" y="566" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1287" dy="0">Deprecated piercing. Prefer</tspan><tspan x="1287" dy="12">a shared stylesheet or None</tspan><tspan x="1287" dy="12">on a tiny wrapper.</tspan></text><rect x="16" y="663" width="747" height="345" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="663" width="7" height="345" rx="0" fill="#4f46e5"/><circle cx="44" cy="685" r="12" fill="#4f46e5"/><text x="44" y="689" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="62" y="690" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When A vs when B</text><text x="32" y="705" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Pick a path with a project example.</tspan></text><polygon points="390,739 460,779 390,819 320,779" fill="#fef9c3" stroke="#b45309" stroke-width="1.8"/><text x="390" y="783" fill="#b45309" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Which?</text><rect x="30" y="831" width="345" height="157" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><rect x="404" y="831" width="345" height="157" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="40" y="853" fill="#1e40af" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Emulated</text><text x="40" y="875" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">Default; unique attributes.</tspan></text><text x="414" y="853" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">None</text><text x="414" y="875" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="414" dy="0">Styles leak globally — avoid.</tspan></text><rect x="773" y="663" width="747" height="345" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="773" y="663" width="7" height="345" rx="0" fill="#7c3aed"/><circle cx="801" cy="685" r="12" fill="#7c3aed"/><text x="801" y="689" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="819" y="690" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The scale you must name</text><text x="789" y="705" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Set one level; everything below it goes quiet — or name the lifetime.</tspan></text><rect x="787" y="731" width="719" height="60" rx="8" fill="#3b82f6"/><text x="799" y="758" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Emulated</text><text x="799" y="778" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">default — unique attributes</text><rect x="787" y="799" width="661" height="60" rx="8" fill="#7c3aed"/><text x="799" y="826" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ShadowDom</text><text x="799" y="846" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">true shadow boundary</text><rect x="787" y="868" width="604" height="60" rx="8" fill="#dc2626"/><text x="799" y="895" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">None</text><text x="799" y="914" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">styles leak globally</text><rect x="787" y="936" width="546" height="60" rx="8" fill="#f97316"/><text x="799" y="963" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">::ng-deep</text><text x="799" y="983" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">avoid — piercing is a smell</text>
