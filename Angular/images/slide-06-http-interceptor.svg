<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">HTTP Interceptor  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Angular  ·  A06  ·  An interceptor sits on every HttpClient call. Typical jobs: attach Authorization, map errors, retry safe GETs,</text><rect x="16" y="78" width="495" height="460" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="78" width="7" height="460" rx="0" fill="#dc2626"/><circle cx="44" cy="100" r="12" fill="#dc2626"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How a request is cloned</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Name each box, then the hand-off.</tspan></text><rect x="30" y="146" width="109" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="85" y="174" fill="#1e40af" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="85" dy="0">Clone request</tspan></text><line x1="139" y1="178" x2="149" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="149" y="146" width="109" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="204" y="174" fill="#166534" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="204" dy="0">Add Bearer</tspan></text><line x1="258" y1="178" x2="268" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="268" y="146" width="109" height="64" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="323" y="174" fill="#9a3412" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="323" dy="0">401?</tspan></text><line x1="378" y1="178" x2="388" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="388" y="146" width="109" height="64" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="442" y="174" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="442" dy="0">Refresh once</tspan><tspan x="442" dy="13">/ fail</tspan></text><text x="30" y="226" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">Name each box, then the hand-off. Explains the actual interceptor:</tspan><tspan x="30" dy="13">clone request, handle 401, do not infinite-loop refresh</tspan></text><rect x="521" y="78" width="495" height="460" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="521" y="78" width="7" height="460" rx="0" fill="#2563eb"/><circle cx="549" cy="100" r="12" fill="#2563eb"/><text x="549" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="567" y="105" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What contains what</text><text x="537" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Outer box owns the inner ones.</tspan></text><rect x="535" y="146" width="467" height="380" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="545" y="164" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Clone request</text><rect x="571" y="182" width="395" height="308" rx="10" fill="#bfdbfe" stroke="#1e40af" stroke-width="1.5"/><text x="581" y="200" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Add Bearer</text><rect x="607" y="218" width="323" height="236" rx="10" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/><text x="617" y="236" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">401?</text><rect x="643" y="254" width="251" height="164" rx="10" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/><text x="653" y="272" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Refresh once / fail</text><rect x="1025" y="78" width="495" height="460" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="1025" y="78" width="7" height="460" rx="0" fill="#16a34a"/><circle cx="1053" cy="100" r="12" fill="#16a34a"/><text x="1053" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1071" y="105" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Numbers / interview drill</text><text x="1041" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">What / where / why / how.</tspan></text><rect x="1039" y="146" width="229" height="186" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="1049" y="164" fill="#1e40af" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">1</text><text x="1049" y="184" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Attach token</text><text x="1049" y="204" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1049" dy="0">req.clone({ setHeaders: {</tspan><tspan x="1049" dy="12">Authorization: `Bearer</tspan><tspan x="1049" dy="12">${token}` } }).</tspan></text><rect x="1277" y="146" width="229" height="186" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="1287" y="164" fill="#166534" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">2</text><text x="1287" y="184" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Skip auth URL</text><text x="1287" y="204" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1287" dy="0">Do not attach or</tspan><tspan x="1287" dy="12">refresh-loop the login/token</tspan><tspan x="1287" dy="12">endpoints.</tspan></text><rect x="1039" y="340" width="229" height="186" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="1049" y="358" fill="#9a3412" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1049" y="378" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Refresh single-flight</text><text x="1049" y="398" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1049" dy="0">One refresh in flight; queue</tspan><tspan x="1049" dy="12">other 401s until it</tspan><tspan x="1049" dy="12">finishes.</tspan></text><rect x="1277" y="340" width="229" height="186" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="1287" y="358" fill="#854d0e" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">4</text><text x="1287" y="378" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Errors</text><text x="1287" y="398" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1287" dy="0">Map 0/network vs 401 vs 403</tspan><tspan x="1287" dy="12">vs 5xx to user messages; log</tspan><tspan x="1287" dy="12">trace id if the API sent…</tspan></text><rect x="16" y="548" width="495" height="460" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="548" width="7" height="460" rx="0" fill="#4f46e5"/><circle cx="44" cy="570" r="12" fill="#4f46e5"/><text x="44" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="62" y="575" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When A vs when B</text><text x="32" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Pick a path with a project example.</tspan></text><polygon points="263,624 333,664 263,704 193,664" fill="#fef9c3" stroke="#b45309" stroke-width="1.8"/><text x="263" y="668" fill="#b45309" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Which?</text><rect x="30" y="716" width="224" height="272" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><rect x="273" y="716" width="224" height="272" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="40" y="738" fill="#1e40af" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Attach token</text><text x="40" y="760" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">req.clone({ setHeaders: {</tspan><tspan x="40" dy="13">Authorization: `Bearer</tspan><tspan x="40" dy="13">${token}` } }).</tspan></text><text x="283" y="738" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Skip auth URL</text><text x="283" y="760" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="283" dy="0">Do not attach or</tspan><tspan x="283" dy="13">refresh-loop the login/token</tspan><tspan x="283" dy="13">endpoints.</tspan></text><rect x="521" y="548" width="495" height="460" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="521" y="548" width="7" height="460" rx="0" fill="#7c3aed"/><circle cx="549" cy="570" r="12" fill="#7c3aed"/><text x="549" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="567" y="575" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Compare — pick with a reason</text><text x="537" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Say the criterion, then the choice.</tspan></text><rect x="535" y="616" width="467" height="28" rx="6" fill="#1e3a5f"/><text x="541" y="636" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Idea</text><text x="774" y="636" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><rect x="535" y="644" width="467" height="28" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="541" y="664" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Attach token</text><text x="774" y="664" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">req.clone({ setHeade</text><rect x="535" y="672" width="467" height="28" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/><text x="541" y="692" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Skip auth URL</text><text x="774" y="692" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do not attach or ref</text><rect x="535" y="700" width="467" height="28" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="541" y="720" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Refresh single-fligh</text><text x="774" y="720" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">One refresh in fligh</text><rect x="535" y="728" width="467" height="28" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/><text x="541" y="748" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Errors</text><text x="774" y="748" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Map 0/network vs 401</text><rect x="1025" y="548" width="495" height="460" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="1025" y="548" width="7" height="460" rx="0" fill="#ea580c"/><circle cx="1053" cy="570" r="12" fill="#ea580c"/><text x="1053" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="1071" y="575" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The scale you must name</text><text x="1041" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Set one level; everything below it goes quiet — or name the</tspan><tspan x="1041" dy="13">lifetime.</tspan></text><rect x="1039" y="616" width="467" height="89" rx="8" fill="#2563eb"/><text x="1051" y="656" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Attach token</text><text x="1051" y="685" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">req.clone({ setHeaders: { Authorization:</text><rect x="1039" y="713" width="429" height="89" rx="8" fill="#16a34a"/><text x="1051" y="753" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Skip auth URL</text><text x="1051" y="782" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do not attach or refresh-loop the login/</text><rect x="1039" y="810" width="392" height="89" rx="8" fill="#4f46e5"/><text x="1051" y="850" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Refresh single-flight</text><text x="1051" y="879" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">One refresh in flight; queue other 401s </text><rect x="1039" y="907" width="355" height="89" rx="8" fill="#7c3aed"/><text x="1051" y="947" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Errors</text><text x="1051" y="976" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Map 0/network vs 401 vs 403 vs 5xx to us</text>
