<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Environments and Angular CI/CD  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Angular  ·  A12  ·  Each environment has a different API URL and feature flags. Angular historically used environment.ts + fileRep</text><rect x="16" y="78" width="495" height="460" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="78" width="7" height="460" rx="0" fill="#dc2626"/><circle cx="44" cy="100" r="12" fill="#dc2626"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How the pieces connect</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Name each box, then the hand-off.</tspan></text><rect x="30" y="146" width="109" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="85" y="174" fill="#1e40af" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="85" dy="0">environment.*</tspan></text><line x1="139" y1="178" x2="149" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="149" y="146" width="109" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="204" y="174" fill="#166534" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="204" dy="0">Build config</tspan></text><line x1="258" y1="178" x2="268" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="268" y="146" width="109" height="64" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="323" y="174" fill="#9a3412" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="323" dy="0">CI pipeline</tspan></text><line x1="378" y1="178" x2="388" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="388" y="146" width="109" height="64" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="442" y="174" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="442" dy="0">Same artifact</tspan></text><text x="30" y="226" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">Name each box, then the hand-off. Names how API base URLs change</tspan><tspan x="30" dy="13">per environment and how the build is deployed</tspan></text><rect x="521" y="78" width="495" height="460" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="521" y="78" width="7" height="460" rx="0" fill="#2563eb"/><circle cx="549" cy="100" r="12" fill="#2563eb"/><text x="549" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="567" y="105" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The scale you must name</text><text x="537" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Set one level; everything below it goes quiet — or name the</tspan><tspan x="537" dy="13">lifetime.</tspan></text><rect x="535" y="146" width="467" height="89" rx="8" fill="#2563eb"/><text x="547" y="186" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Config</text><text x="547" y="215" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">apiBaseUrl, feature flags — never produc</text><rect x="535" y="243" width="429" height="89" rx="8" fill="#16a34a"/><text x="547" y="283" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Build</text><text x="547" y="312" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ng build --configuration production → st</text><rect x="535" y="340" width="392" height="89" rx="8" fill="#4f46e5"/><text x="547" y="380" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">CI/CD</text><text x="547" y="409" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Git → PR → build → unit tests → artifact</text><rect x="535" y="437" width="355" height="89" rx="8" fill="#7c3aed"/><text x="547" y="477" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Manual vs auto</text><text x="547" y="506" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Be honest: if QA was a folder copy, say </text><rect x="1025" y="78" width="495" height="460" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="1025" y="78" width="7" height="460" rx="0" fill="#16a34a"/><circle cx="1053" cy="100" r="12" fill="#16a34a"/><text x="1053" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1071" y="105" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Minimal setup / sample</text><text x="1041" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Configure once; point at a real line.</tspan></text><rect x="1039" y="146" width="467" height="344" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="1049" y="164" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">export const environment = {</text><text x="1049" y="180" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  production: false,</text><text x="1049" y="196" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  apiBaseUrl: 'https://qa-api.example.com'</text><text x="1049" y="212" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">};</text><text x="1043" y="514" fill="#166534" font-size="11" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">URL comes from configuration, not a hard-coded prod host.</text><rect x="16" y="548" width="495" height="460" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="548" width="7" height="460" rx="0" fill="#4f46e5"/><circle cx="44" cy="570" r="12" fill="#4f46e5"/><text x="44" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="62" y="575" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The trap vs the fix</text><text x="32" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Preferred form vs the interview trap.</tspan></text><rect x="30" y="616" width="228" height="380" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="38" y="634" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Hard-code production U</text><text x="38" y="656" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="38" dy="0">const API =</tspan><tspan x="38" dy="13">'https://prod.company.com';</tspan></text><rect x="268" y="616" width="228" height="380" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="276" y="634" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="276" y="656" fill="#14532d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="276" dy="0">environment.apiBaseUrl or</tspan><tspan x="276" dy="13">runtime /config.json per deploy.</tspan></text><rect x="521" y="548" width="495" height="460" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="521" y="548" width="7" height="460" rx="0" fill="#7c3aed"/><circle cx="549" cy="570" r="12" fill="#7c3aed"/><text x="549" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="567" y="575" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice, C#, remember</text><text x="537" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Recite practice, then the C# cousin.</tspan></text><rect x="535" y="616" width="150" height="380" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="543" y="632" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><text x="543" y="650" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Config</text><text x="549" y="664" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">apiBaseUrl, feature fl</text><text x="543" y="677" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Build</text><text x="549" y="691" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ng build --configurati</text><text x="543" y="704" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• CI/CD</text><text x="549" y="718" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Git → PR → build → uni</text><text x="543" y="731" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Manual vs auto</text><text x="549" y="745" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Be honest: if QA was a</text><rect x="693" y="616" width="150" height="380" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="701" y="632" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice</text><text x="701" y="650" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Explain Config wit</text><text x="701" y="664" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Compare Build with</text><text x="701" y="678" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Answer the Intervi</text><rect x="851" y="616" width="150" height="380" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="859" y="632" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">C# map</text><text x="859" y="650" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Component</text><text x="865" y="664" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Razor / UserControl</text><text x="859" y="677" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• @Input / @Output</text><text x="865" y="691" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">parameters / events</text><text x="859" y="704" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Interceptor</text><text x="865" y="718" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">DelegatingHandler</text><text x="859" y="731" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• CanActivate</text><text x="865" y="745" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">[Authorize] still requ</text><rect x="1025" y="548" width="495" height="460" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="1025" y="548" width="7" height="460" rx="0" fill="#ea580c"/><circle cx="1053" cy="570" r="12" fill="#ea580c"/><text x="1053" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="1071" y="575" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Good practice</text><text x="1041" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Do / don't you can recite.</tspan></text><text x="1039" y="628" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do</text><text x="1039" y="648" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Explain Config with a project example.</text><text x="1039" y="670" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Compare Build with an alternative.</text><text x="1039" y="692" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Answer the Interview 5 for: Names how API base U</text><text x="1039" y="722" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><text x="1039" y="744" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1039" dy="0">✗ Hard-code production URL — const API =</tspan><tspan x="1039" dy="13">'https://prod.company.com';</tspan></text>
