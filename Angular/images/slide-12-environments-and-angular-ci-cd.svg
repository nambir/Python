<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#1e3a5f"/><text x="28" y="36" fill="#1e3a5f" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Angular  ·  A12  ·  hero flow</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Environments and Angular CI/CD</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">Each environment has a different API URL and feature flags. Angular historically used environment.ts + fileReplacements; newer apps inject</tspan><tspan x="28" dy="17">configuration at deploy time.</tspan></text><rect x="28" y="150" width="354" height="150" rx="16" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><circle cx="56" cy="178" r="18" fill="#1e3a5f"/><text x="56" y="184" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="44" y="228" fill="#1e40af" font-size="18" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">environment.*</tspan></text><line x1="382" y1="225" x2="404" y2="225" stroke="#1e3a5f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="404" y="150" width="354" height="150" rx="16" fill="#dcfce7" stroke="#166534" stroke-width="2"/><circle cx="432" cy="178" r="18" fill="#1e3a5f"/><text x="432" y="184" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="420" y="228" fill="#166534" font-size="18" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="420" dy="0">Build config</tspan></text><line x1="757" y1="225" x2="779" y2="225" stroke="#1e3a5f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="779" y="150" width="354" height="150" rx="16" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><circle cx="807" cy="178" r="18" fill="#1e3a5f"/><text x="807" y="184" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="795" y="228" fill="#9a3412" font-size="18" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="795" dy="0">CI pipeline</tspan></text><line x1="1132" y1="225" x2="1154" y2="225" stroke="#1e3a5f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1154" y="150" width="354" height="150" rx="16" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><circle cx="1182" cy="178" r="18" fill="#1e3a5f"/><text x="1182" y="184" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="1170" y="228" fill="#854d0e" font-size="18" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1170" dy="0">Same artifact</tspan></text><rect x="28" y="330" width="733" height="220" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="42" y="356" fill="#b91c1c" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Hard-code production URL</text><text x="42" y="380" fill="#7f1d1d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="42" dy="0">const API =</tspan><tspan x="42" dy="16">'https://prod.company.com';</tspan></text><rect x="775" y="330" width="733" height="220" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="789" y="356" fill="#166534" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="789" y="380" fill="#14532d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">environment.apiBaseUrl or</tspan><tspan x="789" dy="16">runtime /config.json per deploy.</tspan></text><rect x="28" y="570" width="900" height="340" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="48" y="600" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Code you can point at</text><text x="48" y="630" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">export const environment = {</text><text x="48" y="652" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  production: false,</text><text x="48" y="674" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  apiBaseUrl: 'https://qa-api.example.com'</text><text x="48" y="696" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">};</text><rect x="948" y="570" width="560" height="340" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="968" y="600" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><text x="968" y="640" fill="#0f172a" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Config</text><text x="968" y="660" fill="#475569" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="968" dy="0">apiBaseUrl, feature flags — never</tspan><tspan x="968" dy="15">production secrets in the SPA bundle if…</tspan></text><text x="968" y="700" fill="#0f172a" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Build</text><text x="968" y="720" fill="#475569" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="968" dy="0">ng build --configuration production →</tspan><tspan x="968" dy="15">static files on a CDN or S3/CloudFront.</tspan></text><text x="968" y="760" fill="#0f172a" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">CI/CD</text><text x="968" y="780" fill="#475569" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="968" dy="0">Git → PR → build → unit tests → artifact →</tspan><tspan x="968" dy="15">deploy to the matching bucket/host.</tspan></text><text x="968" y="820" fill="#0f172a" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Manual vs auto</text><text x="968" y="840" fill="#475569" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="968" dy="0">Be honest: if QA was a folder copy, say</tspan><tspan x="968" dy="15">so; if the pipeline deployed, name the…</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Names how API base URLs change per environment and how the build is deployed</tspan></text>
</svg>
