<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#0369a1"/><text x="28" y="36" fill="#0369a1" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Angular  ·  A10  ·  cards</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">State Management and Reducers</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">Not every app needs a global store. Local component state is fine for one screen. A service + BehaviorSubject is enough for auth. A reducer is a pure</tspan><tspan x="28" dy="17">function: old state + action → new state.</tspan></text><rect x="28" y="140" width="720" height="330" rx="18" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><circle cx="76" cy="188" r="26" fill="#0369a1"/><text x="76" y="196" fill="#fff" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="118" y="196" fill="#1e40af" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Local</text><text x="64" y="250" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="64" dy="0">Form fields, accordion open — keep in the component.</tspan></text><rect x="788" y="140" width="720" height="330" rx="18" fill="#dcfce7" stroke="#166534" stroke-width="2"/><circle cx="836" cy="188" r="26" fill="#0369a1"/><text x="836" y="196" fill="#fff" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="878" y="196" fill="#166534" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Service</text><text x="824" y="250" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="824" dy="0">Auth tokens, current customer — one service.</tspan></text><rect x="28" y="500" width="720" height="330" rx="18" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><circle cx="76" cy="548" r="26" fill="#0369a1"/><text x="76" y="556" fill="#fff" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="118" y="556" fill="#9a3412" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Store / NgRx</text><text x="64" y="610" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="64" dy="0">Many screens writing the same entities, time-travel,</tspan><tspan x="64" dy="20">strict action log. Only if the project used it.</tspan></text><rect x="788" y="500" width="720" height="330" rx="18" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><circle cx="836" cy="548" r="26" fill="#0369a1"/><text x="836" y="556" fill="#fff" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="878" y="556" fill="#854d0e" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Reducer</text><text x="824" y="610" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="824" dy="0">Must not call HTTP. Side effects live in</tspan><tspan x="824" dy="20">effects/services.</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Describes the actual state approach in the project without overclaiming NgRx</tspan></text>
</svg>
