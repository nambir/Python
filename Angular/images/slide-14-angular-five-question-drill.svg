<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Angular Five-Question Drill  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Angular  ·  A14  ·  Practice the five questions on the interceptor, AuthService, and one feature component.</text><rect x="16" y="78" width="1504" height="210" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="16" y="78" width="7" height="210" rx="0" fill="#16a34a"/><circle cx="44" cy="100" r="12" fill="#16a34a"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Numbers / interview drill</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">What / where / why / how.</tspan></text><rect x="30" y="146" width="734" height="61" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="40" y="164" fill="#1e40af" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What?</text><text x="40" y="184" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interceptor</text><text x="40" y="204" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">What: clones HTTP and adds Bearer. Where: AuthInterceptor. Why: avoid copy-paste headers.</tspan><tspan x="40" dy="12">How: HttpInterceptor + 401 refresh. Problem: expired tokens were failing every screen.</tspan></text><rect x="772" y="146" width="734" height="61" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="782" y="164" fill="#166534" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Where?</text><text x="782" y="184" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Guard</text><text x="782" y="204" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="782" dy="0">Stops honest users hitting /users; API still authorizes.</tspan></text><rect x="30" y="215" width="734" height="61" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="40" y="233" fill="#9a3412" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Why?</text><text x="40" y="253" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Component</text><text x="40" y="273" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">Name the feature, the Inputs/Outputs, and the service it calls.</tspan></text><rect x="772" y="215" width="734" height="61" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="782" y="233" fill="#854d0e" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How / proof?</text><text x="782" y="253" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Honesty</text><text x="782" y="273" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="782" dy="0">If you did not write the interceptor, say who did and what you know of it.</tspan></text><rect x="16" y="298" width="495" height="355" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="298" width="7" height="355" rx="0" fill="#4f46e5"/><circle cx="44" cy="320" r="12" fill="#4f46e5"/><text x="44" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="62" y="325" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The scale you must name</text><text x="32" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Set one level; everything below it goes quiet — or name the</tspan><tspan x="32" dy="13">lifetime.</tspan></text><rect x="30" y="366" width="467" height="63" rx="8" fill="#2563eb"/><text x="42" y="394" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interceptor</text><text x="42" y="415" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What: clones HTTP and adds Bearer. Where</text><rect x="30" y="437" width="429" height="63" rx="8" fill="#16a34a"/><text x="42" y="465" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Guard</text><text x="42" y="486" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Stops honest users hitting /users; API s</text><rect x="30" y="508" width="392" height="63" rx="8" fill="#4f46e5"/><text x="42" y="536" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Component</text><text x="42" y="556" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Name the feature, the Inputs/Outputs, an</text><rect x="30" y="578" width="355" height="63" rx="8" fill="#7c3aed"/><text x="42" y="606" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Honesty</text><text x="42" y="627" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">If you did not write the interceptor, sa</text><rect x="521" y="298" width="495" height="355" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="521" y="298" width="7" height="355" rx="0" fill="#7c3aed"/><circle cx="549" cy="320" r="12" fill="#7c3aed"/><text x="549" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="567" y="325" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Minimal setup / sample</text><text x="537" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Configure once; point at a real line.</tspan></text><rect x="535" y="366" width="467" height="239" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="545" y="384" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// Say aloud:</text><text x="545" y="400" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// What / Where / Why / How / Problem — interceptor</text><text x="545" y="416" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// What / Where / Why / How / Problem — User Management </text><text x="539" y="629" fill="#166534" font-size="11" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Two drills, ten sentences, then stop.</text><rect x="1025" y="298" width="495" height="355" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="1025" y="298" width="7" height="355" rx="0" fill="#ea580c"/><circle cx="1053" cy="320" r="12" fill="#ea580c"/><text x="1053" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="1071" y="325" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How the pieces connect</text><text x="1041" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Name each box, then the hand-off.</tspan></text><rect x="1039" y="366" width="109" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="1094" y="394" fill="#1e40af" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="1094" dy="0">What / where</tspan></text><line x1="1149" y1="398" x2="1159" y2="398" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1159" y="366" width="109" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="1213" y="394" fill="#166534" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="1213" dy="0">Interceptor</tspan></text><line x1="1268" y1="398" x2="1278" y2="398" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1278" y="366" width="109" height="64" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="1332" y="394" fill="#9a3412" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="1332" dy="0">Guard vs API</tspan></text><line x1="1387" y1="398" x2="1397" y2="398" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1397" y="366" width="109" height="64" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="1451" y="394" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="1451" dy="0">Honesty</tspan></text><text x="1039" y="446" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1039" dy="0">Name each box, then the hand-off. Answers all five for the HTTP</tspan><tspan x="1039" dy="13">interceptor without stalling</tspan></text><rect x="16" y="663" width="747" height="345" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="663" width="7" height="345" rx="0" fill="#dc2626"/><circle cx="44" cy="685" r="12" fill="#dc2626"/><text x="44" y="689" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="62" y="690" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The trap vs the fix</text><text x="32" y="705" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Preferred form vs the interview trap.</tspan></text><rect x="30" y="731" width="354" height="265" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="38" y="749" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  We used Angular for th</text><text x="38" y="771" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="38" dy="0">Angular is the frontend.</tspan></text><rect x="394" y="731" width="354" height="265" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="749" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="402" y="771" fill="#14532d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="402" dy="0">Five sentences for interceptor, five for guard.</tspan></text><rect x="773" y="663" width="747" height="345" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="773" y="663" width="7" height="345"