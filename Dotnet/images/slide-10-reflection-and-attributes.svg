<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#1e40af"/><text x="28" y="36" fill="#1e40af" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D10  ·  matrix</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Reflection and Attributes</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">A small attribute did nothing by itself; framework code used reflection to discover its metadata and apply behavior.</tspan></text><rect x="28" y="150" width="1480" height="70" rx="8" fill="#1e3a5f"/><text x="38" y="174" fill="#fff" font-size="12" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Idea</text><text x="778" y="174" fill="#fff" font-size="12" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><rect x="28" y="220" width="1480" height="70" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="38" y="244" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Attribute</text><text x="778" y="244" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Adds metadata to assemblies, typ</text><rect x="28" y="290" width="1480" height="70" rx="0" fill="#eff6ff" stroke="#e2e8f0" stroke-width="1"/><text x="38" y="314" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Reflection</text><text x="778" y="314" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Reads type metadata and can insp</text><rect x="28" y="360" width="1480" height="70" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="38" y="384" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Framework action</text><text x="778" y="384" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">A scanner, filter provider, seri</text><rect x="28" y="430" width="1480" height="70" rx="0" fill="#eff6ff" stroke="#e2e8f0" stroke-width="1"/><text x="38" y="454" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Cost</text><text x="778" y="454" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Cache repeated metadata lookups </text><rect x="28" y="620" width="733" height="280" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="42" y="646" fill="#b91c1c" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Assume an attribute execut</text><text x="42" y="670" fill="#7f1d1d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="42" dy="0">[Audit] automatically runs</tspan><tspan x="42" dy="16">auditing.</tspan></text><rect x="775" y="620" width="733" height="280" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="789" y="646" fill="#166534" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="789" y="670" fill="#14532d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">A runtime component must</tspan><tspan x="789" dy="16">discover [Audit] and invoke the</tspan><tspan x="789" dy="16">audit behavior.</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Explains how attributes are discovered and acted upon at runtime in a framework or feature they used</tspan></text>
