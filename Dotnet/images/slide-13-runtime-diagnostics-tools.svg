<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#c2410c"/><text x="28" y="36" fill="#c2410c" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D13  ·  hub</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Runtime Diagnostics Tools</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">CPU was high but logs were quiet, so runtime counters narrowed the symptom and a trace revealed the hot call stacks.</tspan></text><circle cx="520" cy="500" r="90" fill="#c2410c"/><text x="520" y="490" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="520" dy="0">Runtime</tspan><tspan x="520" dy="17">Diagnostics</tspan><tspan x="520" dy="17">Tool</tspan></text><line x1="520" y1="500" x2="520" y2="220" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="370" y="150" width="300" height="140" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="520" y="196" fill="#1e40af" font-size="15" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Counters</text><text x="520" y="228" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="520" dy="0">Observe live rates and</tspan><tspan x="520" dy="15">gauges such as CPU,</tspan><tspan x="520" dy="15">allocation rate, GC,…</tspan></text><line x1="520" y1="500" x2="900" y2="500" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="750" y="430" width="300" height="140" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="900" y="476" fill="#166534" font-size="15" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Trace</text><text x="900" y="508" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="900" dy="0">Capture time-based runtime</tspan><tspan x="900" dy="15">events and stacks to</tspan><tspan x="900" dy="15">locate expensive or…</tspan></text><line x1="520" y1="500" x2="520" y2="780" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="370" y="710" width="300" height="140" rx="14" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><text x="520" y="756" fill="#9a3412" font-size="15" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Dump</text><text x="520" y="788" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="520" dy="0">Inspect a process snapshot</tspan><tspan x="520" dy="15">for heaps, roots, threads,</tspan><tspan x="520" dy="15">locks, and exception…</tspan></text><line x1="520" y1="500" x2="140" y2="500" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="-10" y="430" width="300" height="140" rx="14" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><text x="140" y="476" fill="#854d0e" font-size="15" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Method</text><text x="140" y="508" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="140" dy="0">Start with a hypothesis,</tspan><tspan x="140" dy="15">collect the least</tspan><tspan x="140" dy="15">disruptive evidence, and…</tspan></text><rect x="1080" y="150" width="428" height="740" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="1100" y="180" width="187" height="420" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="1114" y="206" fill="#b91c1c" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Collect everything without</text><text x="1114" y="230" fill="#7f1d1d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1114" dy="0">Take large dumps repeatedly in</tspan><tspan x="1114" dy="16">production.</tspan></text><rect x="1301" y="180" width="187" height="420" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="1315" y="206" fill="#166534" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="1315" y="230" fill="#14532d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1315" dy="0">Form a hypothesis and choose</tspan><tspan x="1315" dy="16">counters, trace, or dump with</tspan><tspan x="1315" dy="16">known operational cost.</tspan></text><text x="1100" y="640" fill="#713f12" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1100" dy="0">Has diagnosed a real issue with</tspan><tspan x="1100" dy="17">runtime diagnostics tooling</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Has diagnosed a real issue with runtime diagnostics tooling</tspan></text>
