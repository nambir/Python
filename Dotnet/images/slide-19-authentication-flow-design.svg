 UI,Arial,sans-serif">Identity</text><text x="797" y="917" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="797" dy="0">ASP.NET Core Identity manages local users,</tspan><tspan x="797" dy="13">credentials, tokens, and related account</tspan><tspan x="797" dy="13">workflows.</tspan></text><text x="1171" y="895" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">OAuth2</text><text x="1171" y="917" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1171" dy="0">Delegates authorization and access to</tspan><tspan x="1171" dy="13">protected resources through defined flows.</tspan></text>
