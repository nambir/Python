">What / where / why / how.</tspan></text><rect x="30" y="773" width="356" height="108" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="40" y="791" fill="#1e40af" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">1</text><text x="40" y="811" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Identity</text><text x="40" y="831" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">ASP.NET Core Identity manages local users,</tspan><tspan x="40" dy="12">credentials, tokens, and related account</tspan><tspan x="40" dy="12">workflows.</tspan></text><rect x="394" y="773" width="356" height="108" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="404" y="791" fill="#166534" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">2</text><text x="404" y="811" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">OAuth2</text><text x="404" y="831" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="404" dy="0">Delegates authorization and access to</tspan><tspan x="404" dy="12">protected resources through defined flows.</tspan></text><rect x="30" y="888" width="356" height="108" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="40" y="906" fill="#9a3412" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">3</text><text x="40" y="926" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">OIDC</text><text x="40" y="946" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">Adds authentication and identity claims on</tspan><tspan x=