oe UI,Arial,sans-serif">SQL model</text><text x="40" y="603" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">Joins, constraints, transactions.</tspan></text><text x="414" y="581" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">NoSQL model</text><text x="414" y="603" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="414" dy="0">Access pattern first, then store.</tspan></text><rect x="773" y="391" width="747" height="303" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="773" y="391" width="7" height="303" rx="0" fill="#2563eb"/><circle cx="801" cy="413" r="12" fill="#2563eb"/><text x="801" y="417" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="819" y="418" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The scale you must name</text><text x="789" y="433" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Set one level; everything below it goes quiet — or name the lifetime.</tspan></text><rect x="787" y="459" width="719" height="50" rx="8" fill="#2563eb"/><text x="799" y="482" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Document</text><text x="799" y="498" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Fits aggregate-shaped records retrieved </text><rect x="787" y="517" width="661" height="50" rx="8" fill="#16a34a"/><text x="799" y="540" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Key-value</text><text x="799" y="556" fill="#f8fafc" font-size="10" font-wei