xt x="280" y="789" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice</text><text x="280" y="807" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Sketch one service</text><text x="280" y="821" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Draw dependency ar</text><text x="280" y="835" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Justify each bound</text><rect x="515" y="773" width="234" height="223" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="523" y="789" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">C# map</text><text x="523" y="807" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Interface</text><text x="529" y="821" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">the contract callers d</text><text x="523" y="834" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Scoped</text><text x="529" y="848" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">one instance per HTTP </text><text x="523" y="861" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• SaveChanges</text><text x="529" y="875" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">the unit of work</text><text x="523" y="888" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Middleware</text><text x="529" y="902" fill="#475569" font-size="9" font-weight="500" text-anchor=