<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#0e7490"/><text x="28" y="36" fill="#0e7490" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D08  ·  containment</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Channels and Backpressure</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">When producers outran workers, an unbounded queue turned a traffic spike into an outage; a bounded channel made overload explicit.</tspan></text><rect x="80" y="150" width="900" height="740" rx="18" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="100" y="184" fill="#1e40af" font-size="18" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Producer</text><rect x="160" y="250" width="740" height="540" rx="18" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="180" y="284" fill="#166534" font-size="18" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Bounded channel</text><rect x="250" y="360" width="560" height="330" rx="18" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><text x="270" y="394" fill="#9a3412" font-size="18" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Consumer</text><rect x="340" y="450" width="380" height="160" rx="18" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><text x="360" y="484" fill="#854d0e" font-size="18" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Backpressure</text><rect x="1020" y="150" width="488" height="740" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="1040" y="190" fill="#0e7490" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When / when not</text><rect x="1040" y="220" width="217" height="360" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="1054" y="246" fill="#b91c1c" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Hide overload in an unboun</text><text x="1054" y="270" fill="#7f1d1d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1054" dy="0">Queue every item indefinitely.</tspan></text><rect x="1271" y="220" width="217" height="360" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="1285" y="246" fill="#166534" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="1285" y="270" fill="#14532d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1285" dy="0">Set a measured capacity and</tspan><tspan x="1285" dy="16">define wait, reject, or drop</tspan><tspan x="1285" dy="16">behavior.</tspan></text><text x="1040" y="620" fill="#713f12" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1040" dy="0">Explains a producer/consumer flow they</tspan><tspan x="1040" dy="17">built, why they chose a concurrent</tspan><tspan x="1040" dy="17">collection or Channel, and how</tspan><tspan x="1040" dy="17">overload, completion and failure were</tspan><tspan x="1040" dy="17">handled</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Explains a producer/consumer flow they built, why they chose a concurrent collection or Channel, and how overload, completion and failure…</tspan></text>
</svg>
