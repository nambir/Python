<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#334155"/><text x="28" y="36" fill="#334155" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D66  ·  code callout</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">EF Mapping: Code First, Fluent API, SPs</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">Code First starts from classes and migrations. Database First starts from an existing schema. Fluent API configures mappings that attributes cannot</tspan><tspan x="28" dy="17">express cleanly. SPs are called explicitly, not magically.</tspan></text><rect x="28" y="140" width="780" height="760" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="48" y="178" fill="#334155" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Sample</text><text x="48" y="220" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">protected override void OnModelCreating(ModelBuilder b) {</text><text x="48" y="248" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">    b.Entity&lt;Wallet&gt;(e =&gt; {</text><text x="48" y="276" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">        e.HasKey(x =&gt; x.Id);</text><text x="48" y="304" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">        e.Property(x =&gt; x.Balance).HasPrecision(18, 2);</text><text x="48" y="332" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">    });</text><text x="48" y="360" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">}</text><text x="48" y="388" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">var rows = await _db.Set&lt;OrderRow&gt;()</text><text x="48" y="416" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">    .FromSqlInterpolated($&quot;EXEC dbo.GetOpenOrders {custome</text><rect x="828" y="140" width="680" height="175" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><circle cx="858" cy="176" r="18" fill="#334155"/><text x="858" y="182" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="888" y="182" fill="#1e40af" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Code First</text><text x="848" y="212" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="848" dy="0">Entities + migrations in source control. Good</tspan><tspan x="848" dy="17">for new services you own.</tspan></text><rect x="828" y="330" width="680" height="175" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="2"/><circle cx="858" cy="366" r="18" fill="#334155"/><text x="858" y="372" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="888" y="372" fill="#166534" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Database First</text><text x="848" y="402" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="848" dy="0">Scaffold or maintain mappings against a legacy</tspan><tspan x="848" dy="17">SQL Server schema you cannot rewrite overnight.</tspan></text><rect x="828" y="520" width="680" height="175" rx="14" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><circle cx="858" cy="556" r="18" fill="#334155"/><text x="858" y="562" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="888" y="562" fill="#9a3412" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Fluent API</text><text x="848" y="592" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="848" dy="0">HasConversion, composite keys, restrict delete —</tspan><tspan x="848" dy="17">keep OnModelCreating for mappings that clutter</tspan><tspan x="848" dy="17">entities.</tspan></text><rect x="828" y="710" width="680" height="175" rx="14" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><circle cx="858" cy="746" r="18" fill="#334155"/><text x="858" y="752" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="888" y="752" fill="#854d0e" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Stored procedures</text><text x="848" y="782" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="848" dy="0">FromSqlInterpolated / ExecuteSql for set-based</tspan><tspan x="848" dy="17">work already proven in SQL. Wrap in a</tspan><tspan x="848" dy="17">transaction if it must pair with other writes.</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Names which approach the project used and how a stored procedure is invoked without breaking tracking</tspan></text>
</svg>
