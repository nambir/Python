<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><text x="768" y="28" fill="#1e3a5f" font-size="24" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">EF Mapping: Code First, Fluent API, SPs  –  Visual Guide</text><text x="768" y="48" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">.NET · D66  ·  Name the approach — parameterized SPs, not string concat</text><rect x="16" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="38" cy="80" r="11" fill="#2563eb"/><text x="38" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="56" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Three mapping choices</text><rect x="28" y="98" width="469" height="28" rx="8" fill="#dbeafe"/><text x="38" y="117" fill="#1e40af" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Code First, Database First, Fluent.</text><rect x="28" y="130" width="469" height="26" rx="4" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1"/><text x="36" y="148" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Approach</text><text x="192" y="148" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Starts from</text><text x="349" y="148" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When</text><rect x="28" y="156" width="469" height="53" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="176" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Code First</tspan></text><text x="192" y="176" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="192" dy="0">classes + migrations</tspan></text><text x="349" y="176" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="349" dy="0">new service you own</tspan></text><rect x="28" y="209" width="469" height="53" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="229" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Database First</tspan></text><text x="192" y="229" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="192" dy="0">existing schema</tspan></text><text x="349" y="229" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="349" dy="0">legacy SQL Server</tspan></text><rect x="28" y="261" width="469" height="53" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="281" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Fluent API</tspan></text><text x="192" y="281" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="192" dy="0">OnModelCreating</tspan></text><text x="349" y="281" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="349" dy="0">keys, precision,</tspan><tspan x="349" dy="15">delete</tspan></text><rect x="521" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><circle cx="543" cy="80" r="11" fill="#16a34a"/><text x="543" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="561" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Fluent that does not clutter entities</text><rect x="533" y="98" width="469" height="28" rx="8" fill="#dcfce7"/><text x="543" y="117" fill="#166534" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Keys, precision, restrict delete.</text><rect x="533" y="130" width="469" height="184" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="543" y="148" fill="#3730a3" font-size="12" font-weight="800" text-anchor="start" font-family="Consolas,Menlo,monospace">Fluent — keep entities clean</text><text x="543" y="182" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">b.Entity&lt;Wallet&gt;(e =&gt; {</text><text x="543" y="209" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  e.HasKey(x =&gt; x.Id);</text><text x="543" y="236" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  e.Property(x =&gt; x.Balance)</text><text x="543" y="262" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">    .HasPrecision(18, 2);</text><text x="543" y="289" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">});</text><rect x="1027" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="1049" cy="80" r="11" fill="#4f46e5"/><text x="1049" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1067" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The SP trap</text><rect x="1039" y="98" width="469" height="28" rx="8" fill="#ede9fe"/><text x="1049" y="117" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Concatenation is injection.</text><rect x="1039" y="130" width="230" height="184" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><circle cx="1053" cy="146" r="8" fill="#dc2626"/><text x="1053" y="150" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="1067" y="151" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">String concat</text><rect x="1049" y="166" width="210" height="138" rx="6" fill="#fff" stroke="#fecaca" stroke-width="1"/><text x="1057" y="194" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1057" dy="0">ExecuteSqlRaw(&quot;exec &quot; +</tspan><tspan x="1057" dy="16">id)</tspan></text><text x="1057" y="257" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1057" dy="0">Injection + broken</tspan><tspan x="1057" dy="16">tracking</tspan></text><rect x="1278" y="130" width="230" height="184" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><circle cx="1292" cy="146" r="8" fill="#16a34a"/><text x="1292" y="150" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="1306" y="151" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interpolated + no track</text><rect x="1288" y="166" width="210" height="138" rx="6" fill="#fff" stroke="#bbf7d0" stroke-width="1"/><text x="1296" y="194" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1296" dy="0">FromSqlInterpolated($&quot;EXEC</tspan><tspan x="1296" dy="16">…&quot;)</tspan></text><text x="1296" y="257" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1296" dy="0">AsNoTracking for reads</tspan></text><rect x="16" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="38" cy="360" r="11" fill="#7c3aed"/><text x="38" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="56" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How an SP is invoked</text><rect x="28" y="378" width="722" height="28" rx="8" fill="#f3e8ff"/><text x="38" y="397" fill="#6b21a8" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Map, parameterize, don't track lists.</text><rect x="100" y="410" width="578" height="34" rx="6" fill="#ffedd5" stroke="#9a3412" stroke-width="1.6"/><text x="389" y="431" fill="#9a3412" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">OnModelCreating mappings</text><line x1="389" y1="444" x2="389" y2="460" stroke="#9a3412" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="100" y="460" width="578" height="34" rx="6" fill="#ffedd5" stroke="#9a3412" stroke-width="1.6"/><text x="389" y="481" fill="#9a3412" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">FromSqlInterpolated EXEC</text><line x1="389" y1="494" x2="389" y2="510" stroke="#9a3412" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="100" y="510" width="578" height="34" rx="6" fill="#ffedd5" stroke="#9a3412" stroke-width="1.6"/><text x="389" y="531" fill="#9a3412" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">AsNoTracking for lists</text><line x1="389" y1="544" x2="389" y2="560" stroke="#9a3412" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="100" y="560" width="578" height="34" rx="6" fill="#ffedd5" stroke="#9a3412" stroke-width="1.6"/><text x="389" y="581" fill="#9a3412" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Txn if paired with writes</text><rect x="774" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="796" cy="360" r="11" fill="#ea580c"/><text x="796" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="814" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The call they want</text><rect x="786" y="378" width="722" height="28" rx="8" fill="#ffedd5"/><text x="796" y="397" fill="#9a3412" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">FromSqlInterpolated + AsNoTracking.</text><rect x="786" y="410" width="722" height="144" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="796" y="428" fill="#3730a3" font-size="12" font-weight="800" text-anchor="start" font-family="Consolas,Menlo,monospace">call the procedure on purpose</text><text x="796" y="461" fill="#1d4ed8" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">var rows = await _db.Set&lt;OrderRow&gt;()</text><text x="796" y="484" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  .FromSqlInterpolated(</text><text x="796" y="508" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">    $&quot;EXEC dbo.GetOpenOrders {id}&quot;)</text><text x="796" y="531" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  .AsNoTracking().ToListAsync();</text><rect x="786" y="562" width="722" height="32" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/><text x="796" y="584" fill="#334155" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">parameterized SP — never concatenated</text><rect x="16" y="618" width="1504" height="398" rx="12" fill="#fff" stroke="#e11d48" stroke-width="1.5"/><circle cx="38" cy="640" r="11" fill="#e11d48"/><text x="38" y="644" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="56" y="645" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice &amp; interview lines</text><rect x="28" y="658" width="1480" height="28" rx="8" fill="#ffe4e6"/><text x="38" y="677" fill="#9f1239" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SPs for proven set-based SQL only.</text><rect x="28" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#fda4af" stroke-width="1.5"/><text x="40" y="710" fill="#9f1239" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Name the approach</text><rect x="40" y="718" width="453" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="750" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// brownfield: database-first</text><text x="50" y="800" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// Fluent for conversions</text><rect x="40" y="851" width="453" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="883" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// SP: FromSqlInterpolated</text><text x="50" y="932" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// AsNoTracking on reads</text><rect x="525" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#86efac" stroke-width="1.5"/><text x="537" y="714" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do</text><circle cx="545" cy="741" r="7" fill="#16a34a"/><text x="545" y="745" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="559" y="735" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Name Code First vs Database First</tspan></text><circle cx="545" cy="792" r="7" fill="#16a34a"/><text x="545" y="796" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="559" y="786" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Show one Fluent mapping</tspan></text><circle cx="545" cy="842" r="7" fill="#16a34a"/><text x="545" y="846" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="559" y="836" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Call SPs parameterized</tspan></text><text x="537" y="881" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><circle cx="545" cy="909" r="7" fill="#dc2626"/><text x="545" y="913" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="559" y="903" fill="#7f1d1d" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Concatenate SQL into ExecuteSqlRaw</tspan></text><circle cx="545" cy="959" r="7" fill="#dc2626"/><text x="545" y="963" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="559" y="953" fill="#7f1d1d" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Hide all C# in stored procedures</tspan></text><rect x="1023" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/><text x="1035" y="710" fill="#6d28d9" font-size="13" font-weight="800" text-anchor="start" font-fam