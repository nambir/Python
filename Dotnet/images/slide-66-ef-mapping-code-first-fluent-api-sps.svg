dle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1071" y="105" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The scale you must name</text><text x="1041" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Set one level; everything below it goes quiet — or name the</tspan><tspan x="1041" dy="13">lifetime.</tspan></text><rect x="1039" y="146" width="467" height="89" rx="8" fill="#2563eb"/><text x="1051" y="186" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Code First</text><text x="1051" y="215" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Entities + migrations in source control.</text><rect x="1039" y="243" width="429" height="89" rx="8" fill="#16a34a"/><text x="1051" y="283" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Database First</text><text x="1051" y="312" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Scaffold or maintain mappings against a </text><rect x="1039" y="340" width="392" height="89" rx="8" fill="#4f46e5"/><text x="1051" y="380" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Fluent API</text><text x="1051" y="409" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">HasConversion, composite keys, restrict </text><rect x="1039" y="437" width="355" height="89" rx="8" fill="#7c3aed"/><text x="1051" y="477" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Stored procedures</text><text x="1051" y="506" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI