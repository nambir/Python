,Arial,sans-serif"><tspan x="545" dy="0">Wrap MVC or endpoint</tspan><tspan x="545" dy="12">execution at</tspan><tspan x="545" dy="12">framework-specific stages,…</tspan></text><rect x="772" y="810" width="229" height="186" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="782" y="828" fill="#854d0e" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">4</text><text x="782" y="848" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Order</text><text x="782" y="868" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="782" dy="0">Exception handling, routing,</tspan><tspan x="782" dy="12">authentication,</tspan><tspan x="782" dy="12">authorization, and endpoint…</tspan></text><rect x="1025" y="548" width="495" height="460" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="1025" y="548" width="7" height="460" rx="0" fill="#16a34a"/><circle cx="1053" cy="570" r="12" fill="#16a34a"/><text x="1053" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="1071" y="575" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When A vs when B</text><text x="1041" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Pick a path with a project example.</tspan></text><polygon points="1273,624 1343,664 1273,704 1203,664" fill="#fef9c3" stroke="#b45309" stroke-width="1.8"/><text x="1273" y="668" fill="#b45309" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Which?</text><rect x="1039" y="716" width="224" height="272" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><rect x="1282" y="716" width="224" height="272" rx="8" fill