are with a project example.</text><text x="535" y="200" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Compare Routing with an alternative.</text><text x="535" y="222" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Prepare evidence for: Traces a request end to en</text><text x="535" y="252" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><text x="535" y="274" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="535" dy="0">✗ Place exception handling too late — Register the exception</tspan><tspan x="535" dy="13">handler after endpoints.</tspan></text><rect x="1025" y="78" width="495" height="460" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="1025" y="78" width="7" height="460" rx="0" fill="#ea580c"/><circle cx="1053" cy="100" r="12" fill="#ea580c"/><text x="1053" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1071" y="105" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Inside the system</text><text x="1041" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Top to bottom, then the hand-off.</tspan></text><rect x="1039" y="146" width="467" height="90" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="1051" y="184" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Middleware</text><text x="1051" y="211" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Runs in registration order on the way in and unw</text><text x="1273" y="242" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="1039" y="242" width="467" height="90" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="1051" y="281" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Routing</text><text x="1051" y="308" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Matches an endpoint and exposes its metadata for</text><text x="1273" y="338" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="1039" y="339" width="467" height="90" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="1051" y="377" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Filters</text><text x="1051" y="404" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Wrap MVC or endpoint execution at framework-spec</text><text x="1273" y="434" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="1039" y="436" width="467" height="90" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="1051" y="474" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Order</text><text x="1051" y="501" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Exception handling, routing, authentication, aut</text><rect x="16" y="548" width="495" height="460" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="548" width="7" height="460" rx="0" fill="#dc2626"/><circle cx="44" cy="570" r="12" fill="#dc2626"/><text x="44" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="62" y="575" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What contains what</text><text x="32" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Outer box owns the inner ones.</tspan></text><rect x="30" y="616" width="467" height="380" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="40" y="634" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">HTTP in</text><rect x="66" y="652" width="395" height="308" rx="10" fill="#bfdbfe" stroke="#1e40af" stroke-width="1.5"/><text x="76" y="670" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">AuthZ</text><rect x="102" y="688" width="323" height="236" rx="10" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/><text x="112" y="706" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Action</text><rect x="138" y="724" width="251" height="164" rx="10" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/><text x="148" y="742" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Unwind out</text><rect x="521" y="548" width="495" height="460" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="521" y="548" width="7" height="460" rx="0" fill="#2563eb"/><circle cx="549" cy="570" r="12" fill="#2563eb"/><text x="549" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="567" y="575" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Numbers / interview drill</text><text x="537" y="590" fill="#475569" font-size="11" font-weight="500"