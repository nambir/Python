<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#334155"/><text x="28" y="36" fill="#334155" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D02  ·  code callout</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">LINQ Execution Internals</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">A query looked frozen in time, but every enumeration reran it against changed data because LINQ had stored a recipe , not results. Remember: LINQ =</tspan><tspan x="28" dy="17">Language Integrated Query — C# query syntax for collections/SQL-like filters.</tspan></text><rect x="28" y="140" width="780" height="760" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="48" y="178" fill="#334155" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Sample</text><text x="48" y="220" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">var numbers = new List&lt;int&gt; { 1, 2, 3 };</text><text x="48" y="248" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">var evens = numbers.Where(n =&gt; n % 2 == 0);</text><text x="48" y="276" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">numbers.Add(4);</text><text x="48" y="304" fill="#0f172a" font-size="15" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">Console.WriteLine(string.Join(&quot;,&quot;, evens));</text><rect x="828" y="140" width="680" height="175" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><circle cx="858" cy="176" r="18" fill="#334155"/><text x="858" y="182" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="888" y="182" fill="#1e40af" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Deferred</text><text x="848" y="212" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="848" dy="0">Most LINQ operators execute when the sequence is</tspan><tspan x="848" dy="17">enumerated, not when the query is declared.</tspan></text><rect x="828" y="330" width="680" height="175" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="2"/><circle cx="858" cy="366" r="18" fill="#334155"/><text x="858" y="372" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="888" y="372" fill="#166534" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">IEnumerable</text><text x="848" y="402" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="848" dy="0">Runs .NET delegates in the process over objects</tspan><tspan x="848" dy="17">the application can enumerate.</tspan></text><rect x="828" y="520" width="680" height="175" rx="14" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><circle cx="858" cy="556" r="18" fill="#334155"/><text x="858" y="562" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="888" y="562" fill="#9a3412" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">IQueryable</text><text x="848" y="592" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="848" dy="0">Builds an expression tree that a provider</tspan><tspan x="848" dy="17">translates, often into SQL.</tspan></text><rect x="828" y="710" width="680" height="175" rx="14" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><circle cx="858" cy="746" r="18" fill="#334155"/><text x="858" y="752" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="888" y="752" fill="#854d0e" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Materialize</text><text x="848" y="782" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="848" dy="0">Use ToList() deliberately when a stable snapshot</tspan><tspan x="848" dy="17">or single execution is required.</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Explains a bug caused by deferred execution or multiple enumeration</tspan></text>
</svg>
