<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Contain Failures by Design  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D50  ·  Resilience is not retrying everything; it is bounding damage and preserving the most valuable service behavior</text><rect x="16" y="78" width="1504" height="210" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="16" y="78" width="7" height="210" rx="0" fill="#16a34a"/><circle cx="44" cy="100" r="12" fill="#16a34a"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The trap vs the fix</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Preferred form vs the interview trap.</tspan></text><rect x="30" y="146" width="733" height="130" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="38" y="164" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Retry amplification</text><text x="38" y="186" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="38" dy="0">Retries without budgets or limits</tspan></text><rect x="773" y="146" width="733" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="781" y="164" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="781" y="186" fill="#14532d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="781" dy="0">Retries only transient failures within an end-to-end budget</tspan></text><rect x="16" y="298" width="495" height="355" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="298" width="7" height="355" rx="0" fill="#4f46e5"/><circle cx="44" cy="320" r="12" fill="#4f46e5"/><text x="44" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="62" y="325" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Inside the system</text><text x="32" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Top to bottom, then the hand-off.</tspan></text><rect x="30" y="366" width="467" height="88" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="42" y="403" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Slow dependency</text><text x="42" y="429" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Timeout</text><text x="263" y="459" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="30" y="460" width="467" height="88" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="42" y="496" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Repeated failure</text><text x="42" y="523" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Circuit breaker</text><text x="263" y="552" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-