<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#0369a1"/><text x="28" y="36" fill="#0369a1" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D11  ·  cards</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Allocation Aware C#</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">A parser became cheaper when it sliced existing buffers with Span&lt;T&gt; instead of creating a new string for every field.</tspan></text><rect x="28" y="140" width="720" height="330" rx="18" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><circle cx="76" cy="188" r="26" fill="#0369a1"/><text x="76" y="196" fill="#fff" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="118" y="196" fill="#1e40af" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Span</text><text x="64" y="250" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="64" dy="0">A stack-only view over contiguous memory, useful for</tspan><tspan x="64" dy="20">synchronous parsing and slicing.</tspan></text><rect x="788" y="140" width="720" height="330" rx="18" fill="#dcfce7" stroke="#166534" stroke-width="2"/><circle cx="836" cy="188" r="26" fill="#0369a1"/><text x="836" y="196" fill="#fff" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="878" y="196" fill="#166534" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Memory</text><text x="824" y="250" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="824" dy="0">A heap-storable memory view suitable across</tspan><tspan x="824" dy="20">asynchronous boundaries.</tspan></text><rect x="28" y="500" width="720" height="330" rx="18" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><circle cx="76" cy="548" r="26" fill="#0369a1"/><text x="76" y="556" fill="#fff" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="118" y="556" fill="#9a3412" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Allocation</text><text x="64" y="610" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="64" dy="0">Remove allocations only on measured hot paths;</tspan><tspan x="64" dy="20">readability remains a design constraint.</tspan></text><rect x="788" y="500" width="720" height="330" rx="18" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><circle cx="836" cy="548" r="26" fill="#0369a1"/><text x="836" y="556" fill="#fff" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="878" y="556" fill="#854d0e" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Benchmark</text><text x="824" y="610" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="824" dy="0">Use representative data, warmup, multiple runs, and</tspan><tspan x="824" dy="20">allocation diagnostics.</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Has measured with BenchmarkDotNet or similar on a real hot path</tspan></text>
</svg>
