<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><text x="768" y="28" fill="#1e3a5f" font-size="24" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Allocation Aware C#  –  Visual Guide</text><text x="768" y="48" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Dotnet · D11  ·  Profile first. Span slices buffers — it does not guess.</text><rect x="16" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="38" cy="80" r="11" fill="#2563eb"/><text x="38" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="56" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Span vs Memory vs string</text><rect x="28" y="98" width="469" height="28" rx="8" fill="#dbeafe"/><text x="38" y="117" fill="#1e40af" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Stack view, await-safe view, or a new allocation.</text><rect x="28" y="130" width="469" height="26" rx="4" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1"/><text x="36" y="148" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Type</text><text x="192" y="148" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Lives</text><text x="349" y="148" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Use</text><rect x="28" y="156" width="469" height="53" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="176" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Span&lt;T&gt;</tspan></text><text x="192" y="176" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="192" dy="0">stack-only view</tspan></text><text x="349" y="176" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="349" dy="0">sync parse / slice</tspan></text><rect x="28" y="209" width="469" height="53" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="229" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Memory&lt;T&gt;</tspan></text><text x="192" y="229" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="192" dy="0">heap-storable view</tspan></text><text x="349" y="229" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="349" dy="0">across await</tspan></text><rect x="28" y="261" width="469" height="53" rx="0" fill="#dcfce7" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="281" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">string</tspan></text><text x="192" y="281" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="192" dy="0">immutable alloc</tspan></text><text x="349" y="281" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="349" dy="0">when you must own text</tspan></text><rect x="521" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><circle cx="543" cy="80" r="11" fill="#16a34a"/><text x="543" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="561" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The interview trap</text><rect x="533" y="98" width="469" height="28" rx="8" fill="#dcfce7"/><text x="543" y="117" fill="#166534" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Intuition is not a benchmark.</text><rect x="533" y="130" width="230" height="184" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><circle cx="547" cy="146" r="8" fill="#dc2626"/><text x="547" y="150" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="561" y="151" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Optimize from intuition</text><rect x="543" y="166" width="210" height="138" rx="6" fill="#fff" stroke="#fecaca" stroke-width="1"/><text x="551" y="190" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="551" dy="0">Rewrite all strings as</tspan><tspan x="551" dy="16">spans</tspan></text><text x="551" y="232" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="551" dy="0">before measuring.</tspan></text><text x="551" y="274" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="551" dy="0">Readability dies; maybe no</tspan><tspan x="551" dy="16">win.</tspan></text><rect x="773" y="130" width="230" height="184" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><circle cx="787" cy="146" r="8" fill="#16a34a"/><text x="787" y="150" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="801" y="151" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Measure the hot path</text><rect x="783" y="166" width="210" height="138" rx="6" fill="#fff" stroke="#bbf7d0" stroke-width="1"/><text x="791" y="190" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="791" dy="0">Profile first.</tspan></text><text x="791" y="232" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="791" dy="0">Benchmark one</tspan><tspan x="791" dy="16">representative case.</tspan></text><text x="791" y="274" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="791" dy="0">Then slice that proven</tspan><tspan x="791" dy="16">path.</tspan></text><rect x="1027" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="1049" cy="80" r="11" fill="#4f46e5"/><text x="1049" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1067" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">A cheaper parser</text><rect x="1039" y="98" width="469" height="28" rx="8" fill="#ede9fe"/><text x="1049" y="117" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">IndexOf + slice — no substring per field.</text><rect x="1039" y="130" width="469" height="184" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="1049" y="148" fill="#3730a3" font-size="12" font-weight="800" text-anchor="start" font-family="Consolas,Menlo,monospace">slice the buffer you already have</text><text x="1049" y="182" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">ReadOnlySpan&lt;char&gt; line = buffer;</text><text x="1049" y="216" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">int comma = line.IndexOf(',');</text><text x="1049" y="249" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">var field = line[..comma];  // no new string</text><text x="1049" y="282" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// across await: Memory&lt;byte&gt; instead</text><rect x="16" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="38" cy="360" r="11" fill="#7c3aed"/><text x="38" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="56" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The measured loop</text><rect x="28" y="378" width="722" height="28" rx="8" fill="#f3e8ff"/><text x="38" y="397" fill="#6b21a8" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Profile → isolate → benchmark → allocs.</text><text x="28" y="418" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Smallest change that you can prove</text><rect x="28" y="450" width="160" height="48" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.6"/><text x="108" y="482" fill="#1e40af" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">profile</text><line x1="190" y1="474" x2="214" y2="474" stroke="#1e40af" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="216" y="450" width="160" height="48" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="295" y="482" fill="#166534" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">isolate</text><line x1="377" y1="474" x2="401" y2="474" stroke="#1e40af" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="403" y="450" width="160" height="48" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.6"/><text x="483" y="482" fill="#9a3412" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">benchmark</text><line x1="564" y1="474" x2="588" y2="474" stroke="#1e40af" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="590" y="450" width="160" height="48" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.6"/><text x="670" y="482" fill="#854d0e" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">alloc diag</text><rect x="28" y="570" width="722" height="22" rx="6" fill="#dcfce7"/><text x="36" y="586" fill="#166534" font-size="11" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Report time and allocations. Span must still parse correctly.</text><rect x="774" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="796" cy="360" r="11" fill="#ea580c"/><text x="796" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="814" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What you put on the slide</text><rect x="786" y="378" width="722" height="28" rx="8" fill="#ffedd5"/><text x="796" y="397" fill="#9a3412" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Mean and allocated bytes, same input.</text><rect x="786" y="410" width="722" height="184" rx="8" fill="#0f172a"/><text x="798" y="436" fill="#86efac" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">&gt; dotnet run -c Release --project Parser.Bench</text><text x="798" y="476" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">Method        Mean     Alloc</text><text x="798" y="516" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">Substring     420 ns   168 B</text><text x="798" y="556" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">SpanSlice      38 ns     0 B</text><rect x="16" y="618" width="1504" height="398" rx="12" fill="#fff" stroke="#e11d48" stroke-width="1.5"/><circle cx="38" cy="640" r="11" fill="#e11d48"/><text x="38" y="644" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="56" y="645" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Recite, trap &amp; C#</text><rect x="28" y="658" width="1480" height="28" rx="8" fill="#ffe4e6"/><text x="38" y="677" fill="#9f1239" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Evidence, then Span on that path.</text><rect x="28" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#fda4af" stroke-width="1.5"/><text x="40" y="710" fill="#9f1239" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Order of work</text><rect x="40" y="718" width="461" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="750" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># 1 profile  2 isolate hot path</text><text x="50" y="800" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># 3 BenchmarkDotNet + allocs</text><rect x="40" y="851" width="461" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="883" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">ReadOnlySpan&lt;char&gt; field = line[..n];</text><text x="50" y="932" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// Memory&lt;T&gt; if it must outlive await</text><rect x="525" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#86efac" stroke-width="1.5"/><text x="537" y="714" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do</text><circle cx="545" cy="747" r="7" fill="#16a34a"/><text x="545" y="751" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="559" y="741" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Profile, then benchmark the smallest honest change</tspan></text><circle cx="545" cy="810" r="7" fill="#16a34a"/><text x="545" y="814" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="559" y="804" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Span for sync slices; Memory across async</tspan></text><text x="537" y="857" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><circle cx="545" cy="889" r="7" fill="#dc2626"/><text x="545" y="893" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="559" y="883" fill="#7f1d1d" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Rewrite the codebase as spans from a hunch</tspan></text><circle cx="545" cy="952" r="7" fill="#dc2626"/><text x="545" y="956" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="559" y="946" fill="#7f1d1d" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Quote microseconds without allocation numbers</tspan></text><rect x="1023" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/><text x="1035" y="710" fill="#6d28d9" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Quick C# comparison</text><rect x="1035" y="718" width="461" height="26" rx="4" fill="#f3e8ff" stroke="#cbd5e1" stroke-width="1"/><text x="1043" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Concept</text><text x="1196" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">C#</text><text x="1350" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interview</text><rect x="1035" y="744" width="461" height="62" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Span</tspan></text><text x="1196" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">stack-only view</tspan></text><text x="1350" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">sync parse/slice</tspan></text><rect x="1035" y="806" width="461" height="62" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Memory</tspan></text><text x="1196" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">heap-storable view</tspan></text><text x="1350" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">cross await</tspan></text><rect x="1035" y="868" width="461" height="62" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Alloc</tspan></text><text x="1196" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">hot path only</tspan></text><text x="1350" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">readability still</tspan><tspan x="1350" dy="15">counts</tspan></text><rect x="1035" y="930" width="461" height="62" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Proof</tspan></text><text x="1196" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">BenchmarkDotNet</tspan></text><text x="1350" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">time + Gen0/alloc</tspan></text>
