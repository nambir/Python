<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">CLR Memory Management  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D05  ·  Memory kept climbing after traffic fell, so the team separated allocation rate from retained objects and leake</text><rect x="16" y="78" width="1504" height="210" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="16" y="78" width="7" height="210" rx="0" fill="#ea580c"/><circle cx="44" cy="100" r="12" fill="#ea580c"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The scale you must name</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Set one level; everything below it goes quiet — or name the lifetime.</tspan></text><rect x="30" y="146" width="1476" height="26" rx="8" fill="#94a3b8"/><text x="42" y="158" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Gen 0</text><text x="42" y="167" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">short-lived objects</text><rect x="30" y="180" width="1358" height="26" rx="8" fill="#3b82f6"/><text x="42" y="192" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Gen 1</text><text x="42" y="201" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">survived one collection</text><rect x="30" y="215" width="1240" height="26" rx="8" fill="#1d4ed8"/><text x="42" y="227" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Gen 2</text><text x="42" y="236" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">long-lived</text><rect x="30" y="250" width="1122" height="26" rx="8" fill="#dc2626"/><text x="42" y="261" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">LOH</text><text x="42" y="270" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">large objects — expensive</text><rect x="16" y="298" width="495" height="355" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="298" width="7" height="355" rx="0" fill="#dc2626"/><circle cx="44" cy="320" r="12" fill="#dc2626"/><text x="44" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="62" y="325" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Minimal setup / sample</text><text x="32" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Configure once; point at a real line.</tspan></text><rect x="30" y="366" width="467" height="239" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="40" y="384" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># walk the diagram — no sample on this slide</text><text x="34" y="629" fill="#166534" font-size="11" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Explains a real memory or resource-pressure issue, identifies whet</text><rect x="521" y="298" width="495" height="355" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="521" y="298" width="7" height="355" rx="0" fill="#2563eb"/><circle cx="549" cy="320" r="12" fill="#2563eb"/><text x="549" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="567" y="325" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How the pieces connect</text><text x="537" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Name each box, then the hand-off.</tspan></text><rect x="535" y="366" width="109" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="589" y="394" fill="#1e40af" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="589" dy="0">Alloc</tspan></text><line x1="644" y1="398" x2="654" y2="398" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="654" y="366" width="109" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="708" y="394" fill="#166534" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="708" dy="0">Gen0/1/2</tspan></text><line x1="763" y1="398" x2="773" y2="398" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="773" y="366" width="109" height="64" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="828" y="394" fill="#9a3412" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="828" dy="0">LOH if large</tspan></text><line x1="882" y1="398" x2="892" y2="398" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="892" y="366" width="109" height="64" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="947" y="394" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="947" dy="0">Dispose</tspan><tspan x="947" dy="13">natives</tspan></text><text x="535" y="446" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="535" dy="0">Name each box, then the hand-off. Explains a real memory or</tspan><tspan x="535" dy="13">resource-pressure issue, identifies whether it was caused by</tspan><tspan x="535" dy="13">allocations, retained references or undisposed resources, and</tspan><tspan x="535" dy="13">describes how it was verified.</tspan></text><rect x="1025" y="298" width="495" height="355" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="1025" y="298" width="7" height="355" rx="0" fill="#16a34a"/><circle cx="1053" cy="320" r="12" fill="#16a34a"/><text x="1053" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="1071" y="325" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The trap vs the fix</text><text x="1041" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Preferred form vs the interview trap.</tspan></text><rect x="1039" y="366" width="228" height="275" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="1047" y="384" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Use a finalizer as nor</text><text x="1047" y="406" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1047" dy="0">Wait for GC to close streams and</tspan><tspan x="1047" dy="13">database handles.</tspan></text><rect x="1278" y="366" width="228" height="275" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="1286" y="384" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="1286" y="406" fill="#14532d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1286" dy="0">Use using/await using; reserve</tspan><tspan x="1286" dy="13">finalizers for owned unmanaged</tspan><tspan x="1286" dy="13">resources.</tspan></text><rect x="16" y="663" width="747" height="345" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="663" width="7" height="345" rx="0" fill="#4f46e5"/><circle cx="44" cy="685" r="12" fill="#4f46e5"/><text x="44" y="689" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="62" y="690" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice, C#, remember</text><text x="32" y="705" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Recite practice, then the C# cousin.</tspan></text><rect x="30" y="731" width="234" height="265" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="38" y="747" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><text x="38" y="765" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Generations</text><text x="44" y="779" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The GC promotes surviv</text><text x="38" y="792" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• LOH</text><text x="44" y="806" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Large allocations gene</text><text x="38" y="819" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• IDisposable</text><text x="44" y="833" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Dispose deterministic </text><text x="38" y="846" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Diagnosis</text><text x="44" y="860" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Use counters and dumps</text><rect x="272" y="731" width="234" height="265" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="280" y="747" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice</text><text x="280" y="765" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Explain Generation</text><text x="280" y="779" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Compare LOH with a</text><text x="280" y="793" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Prepare evidence f</text><rect x="515" y="731" width="234" height="265" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="523" y="747" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">C# map</text><text x="523" y="765" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Interface</text><text x="529" y="779" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">the contract callers d</text><text x="523" y="792" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Scoped</text><text x="529" y="806" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">one instance per HTTP </text><text x="523" y="819" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• SaveChanges</text><text x="529" y="833" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">the unit of work</text><text x="523" y="846" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Middleware</text><text x="529" y="860" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">runs in, then unwinds </text><rect x="773" y="663" width="747" height="345" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="773" y="663" width="7" height="345" rx="0" fill="#7c3aed"/><circle cx="801" cy="685" r="12" fill="#7c3aed"/><text x="801" y="689" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="819" y="690" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Good practice</text><text x="789" y="705" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Do / don't you can recite.</tspan></text><text x="787" y="743" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do</text><text x="787" y="763" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Explain Generations with a project example.</text><text x="787" y="785" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Compare LOH with an alternative.</text><text x="787" y="807" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Prepare evidence for: Explains a real memory or </text><text x="787" y="837" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><text x="787" y="859" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="787" dy="0">✗ Use a finalizer as normal cleanup — Wait for GC to close streams and database handles.</tspan></text>
