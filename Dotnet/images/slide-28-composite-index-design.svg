sans-serif"><tspan x="32" dy="0">Outer box owns the inner ones.</tspan></text><rect x="30" y="773" width="719" height="223" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="40" y="791" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Equality cols</text><rect x="58" y="801" width="663" height="168" rx="10" fill="#bfdbfe" stroke="#1e40af" stroke-width="1.5"/><text x="68" y="819" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Range col last</text><rect x="86" y="828" width="607" height="112" rx="10" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/><text x="96" y="846" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Cover includes</text><rect x="114" y="856" width="552" height="56" rx="10" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/><text x="124" y="874" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Seek vs scan</text><rect x="773" y="705" width="747" height="303" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="773" y="705" width="7" height="303" rx="0" fill="#4f46e5"/><circle cx="801" cy="727" r="12" fill="#4f46e5"/><text x="801" y="731" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="819" y="732" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Numbers / interview drill</text><text x="789" y="747" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">What / where / why / how.</tspan></text><rect x="787" y="773" width="356" height="108" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="797" y="791" fill="#1e40af" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">1</text><text x="797" y="811" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Index</text><text x="797" y="831" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="797" dy="0">An index trades storage and write work for</tspan><tspan x="797" dy="12">faster qualifying reads.</tspan></text><rect x="1150" y="773" width="356" height="108" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="1160" y="791" fill="#166534" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">2</text><text x="1160" y="811" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Order</text><text x="1160" y="831" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1160" dy="0">Composite column order should reflect</tspan><tspan x="1160" dy="12">equality, range, sorting, selectivity, and</tspan><tspan x="1160" dy="12">engine behavior.</tspan></text><rect x="787" y="888" width="356" height="108" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="797" y="906" fill="#9a3412" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">3</text><text x="797" y="926" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Covering</text><text x="797" y="946" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="797" dy="0">Included columns may avoid base-table</tspan><tspan x="797" dy="12">lookups but increase index size and</tspan><tspan x="797" dy="12">maintenance.</tspan></text><rect x="1150" y="888" width="356" height="108" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="1160" y="906" fill="#854d0e" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">4</text><text x="1160" y="926" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Cost</text><text x="1160" y="946" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1160" dy="0">Every insert, update, and delete may</tspan><tspan x="1160" dy="12">maintain indexes; unused overlap hurts write</tspan><tspan x="1160" dy="12">throughput.</tspan></text>
