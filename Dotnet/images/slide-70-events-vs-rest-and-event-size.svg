<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#0f766e"/><text x="28" y="36" fill="#0f766e" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D70  ·  vs split</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Events vs REST and Event Size</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">REST is a request/response you need now (get device status). Events are for work others must react to without blocking the caller (order placed →</tspan><tspan x="28" dy="17">notify, invoice, analytics).</tspan></text><rect x="28" y="140" width="700" height="760" rx="18" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><rect x="808" y="140" width="700" height="760" rx="18" fill="#dcfce7" stroke="#166534" stroke-width="2"/><circle cx="768" cy="420" r="36" fill="#0f766e"/><text x="768" y="428" fill="#fff" font-size="18" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">VS</text><text x="48" y="190" fill="#1e40af" font-size="26" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">REST</text><text x="48" y="240" fill="#1e3a5f" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="48" dy="0">Request/response, easier debugging.</tspan></text><text x="828" y="190" fill="#166534" font-size="26" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Events</text><text x="828" y="240" fill="#14532d" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="828" dy="0">Decouple; at-least-once; size matters.</tspan></text><text x="48" y="520" fill="#1e40af" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Failure</text><text x="48" y="548" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="48" dy="0">Timeouts and retries on REST; at-least-once +</tspan><tspan x="48" dy="17">idempotency + DLQ on events.</tspan></text><text x="828" y="520" fill="#166534" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Large payload</text><text x="828" y="548" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="828" dy="0">Same as D67: object store + reference on the</tspan><tspan x="828" dy="17">message.</tspan></text><text x="48" y="780" fill="#b91c1c" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Events for every call</text><text x="48" y="808" fill="#7f1d1d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="48" dy="0">We made everything event-driven including GetById.</tspan></text><text x="828" y="780" fill="#166534" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="828" y="808" fill="#14532d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="828" dy="0">GetById stays REST. State-change notifications go</tspan><tspan x="828" dy="16">to the bus with an id + URI.</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Picks REST or events with a reason, and never puts a large blob on the event</tspan></text>
</svg>
