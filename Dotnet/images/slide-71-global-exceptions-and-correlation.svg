<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#1d4ed8"/><text x="28" y="36" fill="#1d4ed8" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D71  ·  layers</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Global Exceptions and Correlation</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">One middleware catches unhandled exceptions, logs with a correlation / trace id , and returns a stable error contract. After the controller returns,</tspan><tspan x="28" dy="17">middleware does run again on the way out (the pipeline unwinds).</tspan></text><rect x="28" y="140" width="1000" height="150" rx="16" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><circle cx="70" cy="215" r="22" fill="#1d4ed8"/><text x="70" y="221" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="110" y="188" fill="#1e40af" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">On the way in</text><text x="110" y="222" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="110" dy="0">Request hits exception, auth, then endpoint — registration order.</tspan></text><text x="528" y="304" fill="#1d4ed8" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="28" y="308" width="1000" height="150" rx="16" fill="#dcfce7" stroke="#166534" stroke-width="2"/><circle cx="70" cy="383" r="22" fill="#1d4ed8"/><text x="70" y="389" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="110" y="356" fill="#166534" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">On the way out</text><text x="110" y="390" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="110" dy="0">Yes: each middleware's code after await next() runs in reverse. That</tspan><tspan x="110" dy="17">is how you add headers or time the request.</tspan></text><text x="528" y="472" fill="#1d4ed8" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="28" y="476" width="1000" height="150" rx="16" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><circle cx="70" cy="551" r="22" fill="#1d4ed8"/><text x="70" y="557" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="110" y="524" fill="#9a3412" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Contract</text><text x="110" y="558" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="110" dy="0">ProblemDetails + trace id. Never leak SQL or stack traces to Angular.</tspan></text><text x="528" y="640" fill="#1d4ed8" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="28" y="644" width="1000" height="150" rx="16" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><circle cx="70" cy="719" r="22" fill="#1d4ed8"/><text x="70" y="725" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="110" y="692" fill="#854d0e" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Angular side</text><text x="110" y="726" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="110" dy="0">Interceptor maps 401 to login and 5xx to a friendly message using the</tspan><tspan x="110" dy="17">same trace id for support.</tspan></text><rect x="1050" y="140" width="458" height="760" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="1070" y="180" fill="#1d4ed8" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When / when not</text><rect x="1070" y="210" width="202" height="400" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="1084" y="236" fill="#b91c1c" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  return BadRequest(ex.Messa</text><text x="1084" y="260" fill="#7f1d1d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1084" dy="0">catch (Exception ex) { return</tspan><tspan x="1084" dy="16">StatusCode(500, ex.ToString());</tspan><tspan x="1084" dy="16">}</tspan></text><rect x="1286" y="210" width="202" height="400" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="1300" y="236" fill="#166534" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="1300" y="260" fill="#14532d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1300" dy="0">UseExceptionHandler / custom</tspan><tspan x="1300" dy="16">middleware → ProblemDetails +</tspan><tspan x="1300" dy="16">trace id; log the exception</tspan><tspan x="1300" dy="16">server-side.</tspan></text><text x="1070" y="650" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1070" dy="0">Shows middleware that logs with a</tspan><tspan x="1070" dy="17">trace id and returns ProblemDetails,</tspan><tspan x="1070" dy="17">not ex.Message</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Shows middleware that logs with a trace id and returns ProblemDetails, not ex.Message</tspan></text>
</svg>
