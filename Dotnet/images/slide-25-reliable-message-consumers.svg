<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Reliable Message Consumers  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D25  ·  A consumer processed the same payment twice after crashing before acknowledgement, proving that at-least-once </text><rect x="16" y="78" width="747" height="303" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="16" y="78" width="7" height="303" rx="0" fill="#2563eb"/><circle cx="44" cy="100" r="12" fill="#2563eb"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How the pieces connect</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Name each box, then the hand-off.</tspan></text><rect x="30" y="146" width="172" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="116" y="174" fill="#1e40af" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="116" dy="0">Receive</tspan></text><line x1="202" y1="178" x2="212" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="212" y="146" width="172" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="298" y="174" fill="#166534" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="298" dy="0">Process</tspan></text><line x1="384" y1="178" x2="394" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="394" y="146" width="172" height="64" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="481" y="174" fill="#9a3412" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="481" dy="0">Ack or retry</tspan></text><line x1="567" y1="178" x2="577" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="577" y="146" width="172" height="64" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="663" y="174" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="663" dy="0">DLQ if poison</tspan></text><text x="30" y="226" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">Name each box, then the hand-off. Explains consumer failure handling: retry, DLQ, idempotency</tspan></text><rect x="773" y="78" width="747" height="303" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="773" y="78" width="7" height="303" rx="0" fill="#16a34a"/><circle cx="801" cy="100" r="12" fill="#16a34a"/><text x="801" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="819" y="105" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When A vs when B</text><text x="789" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Pick a path with a project example.</tspan></text><polygon points="1146,154 1216,194 1146,234 1076,194" fill="#fef9c3" stroke="#b45309" stroke-width="1.8"/><text x="1146" y="198" fill="#b45309" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Which?</text><rect x="787" y="246" width="345" height="115" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><rect x="1161" y="246" width="345" height="115" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="797" y="268" fill="#1e40af" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Ack</text><text x="797" y="290" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="797" dy="0">Acknowledge only after required processing</tspan><tspan x="797" dy="13">succeeds; understand each broker's delivery</tspan><tspan x="797" dy="13">semantics.</tspan></text><text x="1171" y="268" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Retry</text><text x="1171" y="290" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1171" dy="0">Retry transient failures with limits and</tspan><tspan x="1171" dy="13">backoff, not permanent validation failures.</tspan></text><rect x="16" y="391" width="747" height="303" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="391" width="7" height="303" rx="0" fill="#4f46e5"/><circle cx="44" cy="413" r="12" fill="#4f46e5"/><text x="44" y="417" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="62" y="418" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Compare — pick with a reason</text><text x="32" y="433" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Say the criterion, then the choice.</tspan></text><rect x="30" y="459" width="719" height="28" rx="6" fill="#1e3a5f"/><text x="36" y="479" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Idea</text><text x="396" y="479" fill