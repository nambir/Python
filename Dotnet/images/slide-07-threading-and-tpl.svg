<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><text x="768" y="28" fill="#1e3a5f" font-size="24" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Threading and TPL  –  Visual Guide</text><text x="768" y="48" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Dotnet · D07  ·  Task for I/O. Parallel for CPU. Interlocked for ++.</text><rect x="16" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="38" cy="80" r="11" fill="#2563eb"/><text x="38" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="56" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Pick the construct</text><rect x="28" y="98" width="469" height="28" rx="8" fill="#dbeafe"/><text x="38" y="117" fill="#1e40af" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Three scenario types — one reason each.</text><rect x="28" y="130" width="469" height="26" rx="4" fill="#4338ca" stroke="#cbd5e1" stroke-width="1"/><text x="36" y="148" fill="#fff" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Need</text><text x="192" y="148" fill="#fff" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Pick</text><text x="349" y="148" fill="#fff" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Not</text><rect x="28" y="156" width="469" height="53" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="176" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">I/O composition</tspan></text><text x="192" y="176" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="192" dy="0">Task / async</tspan></text><text x="349" y="176" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="349" dy="0">new Thread per call</tspan></text><rect x="28" y="209" width="469" height="53" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="229" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">CPU fan-out</tspan></text><text x="192" y="229" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="192" dy="0">bounded Parallel / TPL</tspan></text><text x="349" y="229" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="349" dy="0">unbounded Task.Run</tspan><tspan x="349" dy="15">storm</tspan></text><rect x="28" y="261" width="469" height="53" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="281" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Affinity / loop</tspan></text><text x="192" y="281" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="192" dy="0">dedicated Thread</tspan></text><text x="349" y="281" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="349" dy="0">thread-pool for</tspan><tspan x="349" dy="15">blocking forever</tspan></text><rect x="521" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><circle cx="543" cy="80" r="11" fill="#16a34a"/><text x="543" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="561" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The interview trap</text><rect x="533" y="98" width="469" height="28" rx="8" fill="#dcfce7"/><text x="543" y="117" fill="#166534" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">++ is a race. Interlocked or lock.</text><rect x="533" y="130" width="230" height="184" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><circle cx="547" cy="146" r="8" fill="#dc2626"/><text x="547" y="150" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="561" y="151" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Race on ++</text><rect x="543" y="166" width="210" height="138" rx="6" fill="#fff" stroke="#fecaca" stroke-width="1"/><text x="551" y="190" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="551" dy="0">Parallel.For(0, 1000,</tspan></text><text x="551" y="232" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="551" dy="0">_ =&gt; count++);</tspan></text><text x="551" y="274" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="551" dy="0">Read-modify-write is not</tspan><tspan x="551" dy="16">atomic.</tspan></text><rect x="773" y="130" width="230" height="184" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><circle cx="787" cy="146" r="8" fill="#16a34a"/><text x="787" y="150" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="801" y="151" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Atomic increment</text><rect x="783" y="166" width="210" height="138" rx="6" fill="#fff" stroke="#bbf7d0" stroke-width="1"/><text x="791" y="190" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="791" dy="0">Parallel.For(0, 1000,</tspan></text><text x="791" y="232" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="791" dy="0">_ =&gt;</tspan><tspan x="791" dy="16">Interlocked.Increment(ref</tspan></text><text x="791" y="274" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="791" dy="0">lock if the invariant is</tspan><tspan x="791" dy="16">multi-step.</tspan></text><rect x="1027" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="1049" cy="80" r="11" fill="#4f46e5"/><text x="1049" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1067" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">A counter that adds up</text><rect x="1039" y="98" width="469" height="28" rx="8" fill="#ede9fe"/><text x="1049" y="117" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">1000 increments must yield 1000.</text><rect x="1039" y="130" width="469" height="144" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="1049" y="148" fill="#3730a3" font-size="12" font-weight="800" text-anchor="start" font-family="Consolas,Menlo,monospace">shared counter</text><text x="1049" y="181" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">int count = 0;</text><text x="1049" y="204" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">Parallel.For(0, 1000,</text><text x="1049" y="228" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">    _ =&gt; Interlocked.Increment(ref count));</text><text x="1049" y="251" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">Console.WriteLine(count);</text><rect x="1039" y="282" width="469" height="32" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/><text x="1049" y="304" fill="#334155" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">1000   — without Interlocked you will not always get 1000</text><rect x="16" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="38" cy="360" r="11" fill="#7c3aed"/><text x="38" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="56" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Decision order</text><rect x="28" y="378" width="722" height="28" rx="8" fill="#f3e8ff"/><text x="38" y="397" fill="#6b21a8" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">I/O, then CPU, then the shared invariant.</text><rect x="115" y="410" width="549" height="51" rx="6" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.6"/><text x="389" y="441" fill="#5b21b6" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">I/O? → async Task</text><line x1="389" y1="461" x2="389" y2="477" stroke="#5b21b6" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="115" y="477" width="549" height="51" rx="6" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.6"/><text x="389" y="508" fill="#5b21b6" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Independent CPU? → bounded Parallel</text><line x1="389" y1="527" x2="389" y2="543" stroke="#5b21b6" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="115" y="543" width="549" height="51" rx="6" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.6"/><text x="389" y="575" fill="#5b21b6" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Shared invariant? → Interlocked / lock</text><rect x="774" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="796" cy="360" r="11" fill="#ea580c"/><text x="796" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="814" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Share as little as possible</text><rect x="786" y="378" width="722" height="28" rx="8" fill="#ffedd5"/><text x="796" y="397" fill="#9a3412" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Name the four tools; prefer isolation.</text><circle cx="1147" cy="502" r="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1147" y="507" fill="#5b21b6" font-size="13" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">share little</text><line x1="1147" y1="502" x2="1147" y2="424" stroke="#7c3aed" stroke-width="2.4"  stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="1099" y="412" width="96" height="24" rx="8" fill="#86efac"/><text x="1147" y="429" fill="#166534" font-size="11" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Task</text><line x1="1147" y1="502" x2="1450" y2="502" stroke="#7c3aed" stroke-width="2.4"  stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="1402" y="490" width="96" height="24" rx="8" fill="#86efac"/><text x="1450" y="507" fill="#166534" font-size="11" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Thread</text><line x1="1147" y1="502" x2="1147" y2="578" stroke="#7c3aed" stroke-width="2.4"  stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="1099" y="566" width="96" height="24" rx="8" fill="#86efac"/><text x="1147" y="583" fill="#166534" font-size="11" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Parallel</text><line x1="1147" y1="502" x2="844" y2="502" stroke="#7c3aed" stroke-width="2.4"  stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="796" y="490" width="96" height="24" rx="8" fill="#86efac"/><text x="844" y="507" fill="#166534" font-size="11" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Interlocked</text><rect x="16" y="618" width="1504" height="398" rx="12" fill="#fff" stroke="#e11d48" stroke-width="1.5"/><circle cx="38" cy="640" r="11" fill="#e11d48"/><text x="38" y="644" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="56" y="645" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Recite, trap &amp; C#</text><rect x="28" y="658" width="1480" height="28" rx="8" fill="#ffe4e6"/><text x="38" y="677" fill="#9f1239" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Right construct + why the counter was wrong.</text><rect x="28" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#fda4af" stroke-width="1.5"/><text x="40" y="710" fill="#9f1239" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Three scenarios</text><rect x="40" y="718" width="461" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="750" fill="#1d4ed8" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">await http.GetAsync(url, ct);</text><text x="50" y="800" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// Task — I/O, not new Thread</text><rect x="40" y="851" width="461" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="883" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">Interlocked.Increment(ref n);</text><text x="50" y="932" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// lock { multi-step invariant }</text><rect x="525" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#86efac" stroke-width="1.5"/><text x="537" y="714" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do</text><circle cx="545" cy="747" r="7" fill="#16a34a"/><text x="545" y="751" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="559" y="741" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Pick Task vs Thread vs Parallel with a reason</tspan></text><circle cx="545" cy="810" r="7" fill="#16a34a"/><text x="545" y="814" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="559" y="804" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Minimize shared state; Interlocked vs lock by invariant</tspan></text><text x="537" y="857" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><circle cx="545" cy="889" r="7" fill="#dc2626"/><text x="545" y="893" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="559" y="883" fill="#7f1d1d" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">count++ inside Parallel.For</tspan></text><circle cx="545" cy="952" r="7" fill="#dc2626"/><text x="545" y="956" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="559" y="946" fill="#7f1d1d" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">new Thread for every HTTP call</tspan></text><rect x="1023" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/><text x="1035" y="710" fill="#6d28d9" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Quick C# comparison</text><rect x="1035" y="718" width="461" height="26" rx="4" fill="#f3e8ff" stroke="#cbd5e1" stroke-width="1"/><text x="1043" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Concept</text><text x="1196" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">C#</text><text x="1350" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interview</text><rect x="1035" y="744" width="461" height="62" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Task</tspan></text><text x="1196" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">async work + pool</tspan></text><text x="1350" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">compose I/O</tspan></text><rect x="1035" y="806" width="461" height="62" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Thread</tspan></text><text x="1196" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">affinity / long block</tspan></text><text x="1350" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">rare on APIs</tspan></text><rect x="1035" y="868" width="461" height="62" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Parallel</tspan></text><text x="1196" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">bounded CPU fan-out</tspan></text><text x="1350" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">not fake-sync I/O</tspan></text><rect x="1035" y="930" width="461" height="62" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Interlocked</tspan></text><text x="1196" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">simple shared counter</tspan></text><text x="1350" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">lock for multi-step</tspan></text>
