<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Threading and TPL  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D07  ·  A counter lost updates even though every worker ran successfully; ++ was a read-modify-write race.</text><rect x="16" y="78" width="747" height="303" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="16" y="78" width="7" height="303" rx="0" fill="#2563eb"/><circle cx="44" cy="100" r="12" fill="#2563eb"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When A vs when B</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Pick a path with a project example.</tspan></text><polygon points="390,154 460,194 390,234 320,194" fill="#fef9c3" stroke="#b45309" stroke-width="1.8"/><text x="390" y="198" fill="#b45309" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Which?</text><rect x="30" y="246" width="345" height="115" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><rect x="404" y="246" width="345" height="115" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="40" y="268" fill="#1e40af" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Task</text><text x="40" y="290" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">Represents asynchronous work; use it for</tspan><tspan x="40" dy="13">composition and thread-pool scheduling.</tspan></text><text x="414" y="268" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Thread</text><text x="414" y="290" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="414" dy="0">Use a dedicated thread only for</tspan><tspan x="414" dy="13">requirements such as affinity or a</tspan><tspan x="414" dy="13">long-lived blocking loop.</tspan></text><rect x="773" y="78" width="747" height="303" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="773" y="78" width="7" height="303" rx="0" fill="#16a34a"/><circle cx="801" cy="100" r="12" fill="#16a34a"/><text x="801" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="819" y="105" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The scale you must name</text><text x="789" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Set one level; everything below it goes quiet — or name the lifetime.</tspan></text><rect x="787" y="146" width="719" height="50" rx="8" fill="#2563eb"/><text x="799" y="168" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Task</text><text x="799" y="185" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Represents asynchronous work; use it for</text><rect x="787" y="204" width="661" height="50" rx="8" fill="#16a34a"/><text x="799" y="226" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Thread</text><text x="799" y="243" fill="#f8fafc" font-size="10" font-weigh