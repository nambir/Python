<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><text x="768" y="28" fill="#1e3a5f" font-size="24" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Reliable Web API Contracts  –  Visual Guide</text><text x="768" y="48" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Dotnet · D17  ·  One ProblemDetails envelope — success and errors together</text><rect x="16" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="38" cy="80" r="11" fill="#2563eb"/><text x="38" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="56" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Four pieces of the contract</text><rect x="28" y="98" width="469" height="28" rx="8" fill="#dbeafe"/><text x="38" y="117" fill="#1e40af" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Bind, validate, version, ProblemDetails.</text><rect x="28" y="130" width="469" height="26" rx="4" fill="#ffe4e6" stroke="#cbd5e1" stroke-width="1"/><text x="36" y="148" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Piece</text><text x="271" y="148" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Client sees</text><rect x="28" y="156" width="469" height="40" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="171" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Binding</tspan></text><text x="271" y="171" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="271" dy="0">route / query / body → model</tspan></text><rect x="28" y="196" width="469" height="40" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="211" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Validation</tspan></text><text x="271" y="211" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="271" dy="0">field errors at the boundary</tspan></text><rect x="28" y="235" width="469" height="40" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="250" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Versioning</tspan></text><text x="271" y="250" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="271" dy="0">compatibility + retirement policy</tspan></text><rect x="28" y="274" width="469" height="40" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="290" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">ProblemDetails</tspan></text><text x="271" y="290" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="271" dy="0">stable type, status, trace id</tspan></text><rect x="521" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><circle cx="543" cy="80" r="11" fill="#16a34a"/><text x="543" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="561" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The interview trap</text><rect x="533" y="98" width="469" height="28" rx="8" fill="#dcfce7"/><text x="543" y="117" fill="#166534" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ex.Message is not an API. It is a leak.</text><rect x="533" y="130" width="230" height="184" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><circle cx="547" cy="146" r="8" fill="#dc2626"/><text x="547" y="150" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="561" y="151" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Arbitrary error strings</text><rect x="543" y="166" width="210" height="138" rx="6" fill="#fff" stroke="#fecaca" stroke-width="1"/><text x="551" y="190" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="551" dy="0">return</tspan><tspan x="551" dy="16">BadRequest(ex.Message);</tspan></text><text x="551" y="232" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="551" dy="0">Shape changes per action.</tspan></text><text x="551" y="274" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="551" dy="0">May leak internals.</tspan></text><rect x="773" y="130" width="230" height="184" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><circle cx="787" cy="146" r="8" fill="#16a34a"/><text x="787" y="150" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="801" y="151" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">One error contract</text><rect x="783" y="166" width="210" height="138" rx="6" fill="#fff" stroke="#bbf7d0" stroke-width="1"/><text x="791" y="190" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="791" dy="0">Documented ProblemDetails.</tspan></text><text x="791" y="232" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="791" dy="0">Safe detail + trace ID.</tspan></text><text x="791" y="274" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="791" dy="0">Validation and 500 share a</tspan><tspan x="791" dy="16">shape.</tspan></text><rect x="1027" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="1049" cy="80" r="11" fill="#4f46e5"/><text x="1049" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1067" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How a call is shaped</text><rect x="1039" y="98" width="469" height="28" rx="8" fill="#ede9fe"/><text x="1049" y="117" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Invalid input never reaches the domain as a surprise.</text><text x="1039" y="138" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Success and error are one design</text><rect x="1039" y="170" width="96" height="48" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.6"/><text x="1087" y="202" fill="#1e40af" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">bind</text><line x1="1137" y1="194" x2="1161" y2="194" stroke="#1e40af" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="1163" y="170" width="96" height="48" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="1211" y="202" fill="#166534" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">validate</text><line x1="1261" y1="194" x2="1285" y2="194" stroke="#1e40af" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="1287" y="170" width="96" height="48" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.6"/><text x="1336" y="202" fill="#9a3412" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">handler</text><line x1="1386" y1="194" x2="1410" y2="194" stroke="#1e40af" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="1412" y="170" width="96" height="48" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.6"/><text x="1460" y="202" fill="#854d0e" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">contract</text><rect x="1039" y="290" width="469" height="22" rx="6" fill="#dcfce7"/><text x="1047" y="306" fill="#166534" font-size="11" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Normalize validation centrally. Map domain exceptions to documented statuses.</text><rect x="16" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="38" cy="360" r="11" fill="#7c3aed"/><text x="38" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="56" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What the client parses</text><rect x="28" y="378" width="722" height="28" rx="8" fill="#f3e8ff"/><text x="38" y="397" fill="#6b21a8" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">type, title, status, traceId — always.</text><rect x="28" y="410" width="722" height="184" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="38" y="428" fill="#3730a3" font-size="12" font-weight="800" text-anchor="start" font-family="Consolas,Menlo,monospace">machine-readable — no stack in the body</text><text x="38" y="460" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">{</text><text x="38" y="483" fill="#b45309" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  &quot;type&quot;: &quot;https://api/errors/order-closed&quot;,</text><text x="38" y="505" fill="#b45309" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  &quot;title&quot;: &quot;Order closed&quot;,</text><text x="38" y="527" fill="#b45309" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  &quot;status&quot;: 409,</text><text x="38" y="550" fill="#b45309" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  &quot;traceId&quot;: &quot;00-abc-01&quot;</text><text x="38" y="572" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">}</text><rect x="774" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="796" cy="360" r="11" fill="#ea580c"/><text x="796" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="814" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Three statuses you map</text><rect x="786" y="378" width="722" height="28" rx="8" fill="#ffedd5"/><text x="796" y="397" fill="#9a3412" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Validation, domain conflict, unexpected.</text><rect x="786" y="410" width="722" height="57" rx="6" fill="#ea580c"/><text x="798" y="446" fill="#fff" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">400 validation</text><text x="1496" y="446" fill="#fff" font-size="13" font-weight="500" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">field-level, safe, same envelope</text><rect x="786" y="473" width="722" height="57" rx="6" fill="#2563eb"/><text x="798" y="509" fill="#fff" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">409 / 422 domain</text><text x="1496" y="509" fill="#fff" font-size="13" font-weight="500" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">documented type URI</text><rect x="786" y="537" width="722" height="57" rx="6" fill="#dc2626"/><text x="798" y="572" fill="#fff" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">500 unexpected</text><text x="1496" y="572" fill="#fff" font-size="13" font-weight="500" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">trace id, log once, hide internals</text><rect x="16" y="618" width="1504" height="398" rx="12" fill="#fff" stroke="#e11d48" stroke-width="1.5"/><circle cx="38" cy="640" r="11" fill="#e11d48"/><text x="38" y="644" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="56" y="645" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Recite, trap &amp; C#</text><rect x="28" y="658" width="1480" height="28" rx="8" fill="#ffe4e6"/><text x="38" y="677" fill="#9f1239" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Envelope + documented statuses + trace id.</text><rect x="28" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#fda4af" stroke-width="1.5"/><text x="40" y="710" fill="#9f1239" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Contract pair</text><rect x="40" y="718" width="461" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="750" fill="#1d4ed8" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">return TypedResults.Problem(</text><text x="50" y="800" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">    statusCode: 409, title: &quot;Order closed&quot;);</text><rect x="40" y="851" width="461" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="883" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// validation → 400 ProblemDetails</text><text x="50" y="932" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// never return ex.Message as the API</text><rect x="525" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#86efac" stroke-width="1.5"/><text x="537" y="714" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do</text><circle cx="545" cy="747" r="7" fill="#16a34a"/><text x="545" y="751" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="559" y="741" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Design 2xx and error shapes together</tspan></text><circle cx="545" cy="810" r="7" fill="#16a34a"/><text x="545" y="814" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="559" y="804" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Trace ID for support — no internals in the body</tspan></text><text x="537" y="857" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><circle cx="545" cy="889" r="7" fill="#dc2626"/><text x="545" y="893" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="559" y="883" fill="#7f1d1d" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">return BadRequest(ex.Message)</tspan></text><circle cx="545" cy="952" r="7" fill="#dc2626"/><text x="545" y="956" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="559" y="946" fill="#7f1d1d" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">A new JSON error shape per controller</tspan></text><rect x="1023" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/><text x="1035" y="710" fill="#6d28d9" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Quick C# comparison</text><rect x="1035" y="718" width="461" height="26" rx="4" fill="#f3e8ff" stroke="#cbd5e1" stroke-width="1"/><text x="1043" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Concept</text><text x="1196" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">C#</text><text x="1350" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interview</text><rect x="1035" y="744" width="461" height="62" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Binding</tspan></text><text x="1196" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">FromRoute / body</tspan></text><text x="1350" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">inputs become models</tspan></text><rect x="1035" y="806" width="461" height="62" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Validation</tspan></text><text x="1196" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">DataAnnotations /</tspan><tspan x="1196" dy="15">Fluent</tspan></text><text x="1350" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">boundary 400</tspan></text><rect x="1035" y="868" width="461" height="62" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Version</tspan></text><text x="1196" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">URL / header policy</tspan></text><text x="1350" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">retire old contracts</tspan></text><rect x="1035" y="930" width="461" height="62" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">ProblemDetails</tspan></text><text x="1196" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">RFC 7807 shape</tspan></text><text x="1350" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">stable for clients</tspan></text>
