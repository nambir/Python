<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#9a3412"/><text x="28" y="36" fill="#9a3412" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D69  ·  star story</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Architecture 5–7 Minute Talk</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">Interviewers want one rehearsed architecture story. Cover all twelve beats. Spend most time on two or three services you owned and your contribution —</tspan><tspan x="28" dy="17">not a catalog of ten names.</tspan></text><rect x="28" y="140" width="720" height="330" rx="18" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="56" y="188" fill="#1e40af" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">S — Situation</text><text x="56" y="230" fill="#0f172a" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Users / flow</text><text x="56" y="270" fill="#475569" font-size="15" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="56" dy="0">Business problem, users, Angular shape,</tspan><tspan x="56" dy="18">JWT/OAuth/SSO.</tspan></text><rect x="788" y="140" width="720" height="330" rx="18" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="816" y="188" fill="#166534" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">T — Task</text><text x="816" y="230" fill="#0f172a" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Boxes / data</text><text x="816" y="270" fill="#475569" font-size="15" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="816" dy="0">API Gateway / .NET APIs, microservice</tspan><tspan x="816" dy="18">responsibilities, REST vs events, DB ownership.</tspan></text><rect x="28" y="500" width="720" height="330" rx="18" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><text x="56" y="548" fill="#9a3412" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">A — Action</text><text x="56" y="590" fill="#0f172a" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Failure / scale</text><text x="56" y="630" fill="#475569" font-size="15" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="56" dy="0">AWS services you actually used, Docker/ECS/CI-CD,</tspan><tspan x="56" dy="18">logs/metrics/traces.</tspan></text><rect x="788" y="500" width="720" height="330" rx="18" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><text x="816" y="548" fill="#854d0e" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">R — Result</text><text x="816" y="590" fill="#0f172a" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Tradeoff + next</text><text x="816" y="630" fill="#475569" font-size="15" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="816" dy="0">Exactly what you designed or built. 'I' not 'we'.</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Delivers a timed 5–7 minute walk without dumping every microservice name</tspan></text>
</svg>
