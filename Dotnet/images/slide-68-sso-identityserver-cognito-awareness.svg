<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#4338ca"/><text x="28" y="36" fill="#4338ca" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D68  ·  swimlane</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SSO, IdentityServer, Cognito Awareness</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">Authentication is usually delegated to an identity provider . The API validates tokens; it does not store passwords. Name the real IdP. Do not invent</tspan><tspan x="28" dy="17">IdentityServer if the project used Cognito or Azure AD.</tspan></text><rect x="28" y="150" width="1480" height="150" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><rect x="28" y="150" width="220" height="150" rx="14" fill="#4338ca"/><text x="138" y="238" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">IdP login</text><text x="270" y="200" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="270" dy="0">One login session used by several apps via the same IdP.</tspan></text><text x="140" y="316" fill="#4338ca" font-size="18" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="28" y="318" width="1480" height="150" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="2"/><rect x="28" y="318" width="220" height="150" rx="14" fill="#4338ca"/><text x="138" y="406" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">JWT</text><text x="270" y="368" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="270" dy="0">Issues tokens after an OAuth/OIDC flow. The API uses JWT bearer validation.</tspan></text><text x="140" y="484" fill="#4338ca" font-size="18" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="28" y="486" width="1480" height="150" rx="14" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><rect x="28" y="486" width="220" height="150" rx="14" fill="#4338ca"/><text x="138" y="574" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">API validate</text><text x="270" y="536" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="270" dy="0">AWS-managed user pools + tokens. Same idea: API trusts the issuer and audience.</tspan></text><text x="140" y="652" fill="#4338ca" font-size="18" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="28" y="654" width="1480" height="150" rx="14" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><rect x="28" y="654" width="220" height="150" rx="14" fill="#4338ca"/><text x="138" y="742" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">IAM ≠ user token</text><text x="270" y="704" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="270" dy="0">AWS identities and policies for services (who can assume a role), not the Angular user's</tspan><tspan x="270" dy="20">JWT.</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Draws login → IdP → tokens → API validation without claiming a product they did not run</tspan></text>
</svg>
