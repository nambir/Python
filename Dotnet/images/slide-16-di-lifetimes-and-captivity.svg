<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><text x="768" y="28" fill="#1e3a5f" font-size="24" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">DI Lifetimes and Captivity  –  Visual Guide</text><text x="768" y="48" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Dotnet · D16  ·  A singleton must not keep a scoped DbContext</text><rect x="16" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="38" cy="80" r="11" fill="#2563eb"/><text x="38" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="56" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Four words, one is a bug</text><rect x="28" y="98" width="469" height="28" rx="8" fill="#dbeafe"/><text x="38" y="117" fill="#1e40af" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Transient, scoped, singleton — captive is the trap.</text><rect x="28" y="130" width="469" height="42" rx="6" fill="#16a34a"/><text x="40" y="156" fill="#fff" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Transient</text><text x="485" y="156" fill="#fff" font-size="13" font-weight="500" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">new instance every resolve — stateless</text><rect x="28" y="178" width="469" height="42" rx="6" fill="#2563eb"/><text x="40" y="203" fill="#fff" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Scoped</text><text x="485" y="203" fill="#fff" font-size="13" font-weight="500" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">one per request / explicit work scope</text><rect x="28" y="225" width="469" height="42" rx="6" fill="#1e3a5f"/><text x="40" y="251" fill="#fff" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Singleton</text><text x="485" y="251" fill="#fff" font-size="13" font-weight="500" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">one for the process — must be thread-safe</text><rect x="28" y="272" width="469" height="42" rx="6" fill="#dc2626"/><text x="40" y="298" fill="#fff" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Captive</text><text x="485" y="298" fill="#fff" font-size="13" font-weight="500" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">singleton holding scoped — bug</text><rect x="521" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><circle cx="543" cy="80" r="11" fill="#16a34a"/><text x="543" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="561" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The interview trap</text><rect x="533" y="98" width="469" height="28" rx="8" fill="#dcfce7"/><text x="543" y="117" fill="#166534" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Worker(AppDbContext) captures a request object forever.</text><rect x="533" y="130" width="230" height="184" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><circle cx="547" cy="146" r="8" fill="#dc2626"/><text x="547" y="150" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="561" y="151" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">DbContext in a singleton</text><rect x="543" y="166" width="210" height="138" rx="6" fill="#fff" stroke="#fecaca" stroke-width="1"/><text x="551" y="190" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="551" dy="0">SingletonWorker(AppDbContext</tspan><tspan x="551" dy="16">db)</tspan></text><text x="551" y="232" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="551" dy="0">One context lives for the</tspan><tspan x="551" dy="16">app.</tspan></text><text x="551" y="274" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="551" dy="0">Cross-request state +</tspan><tspan x="551" dy="16">threading.</tspan></text><rect x="773" y="130" width="230" height="184" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><circle cx="787" cy="146" r="8" fill="#16a34a"/><text x="787" y="150" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="801" y="151" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Scope per unit of work</text><rect x="783" y="166" width="210" height="138" rx="6" fill="#fff" stroke="#bbf7d0" stroke-width="1"/><text x="791" y="190" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="791" dy="0">Inject</tspan><tspan x="791" dy="16">IServiceScopeFactory.</tspan></text><text x="791" y="232" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="791" dy="0">CreateScope() per job.</tspan></text><text x="791" y="274" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="791" dy="0">Resolve DbContext inside</tspan><tspan x="791" dy="16">it.</tspan></text><rect x="1027" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="1049" cy="80" r="11" fill="#4f46e5"/><text x="1049" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1067" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How a hosted service does work</text><rect x="1039" y="98" width="469" height="28" rx="8" fill="#ede9fe"/><text x="1049" y="117" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The service is singleton. The job gets a scope.</text><rect x="1086" y="130" width="375" height="51" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="1273" y="161" fill="#b91c1c" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">BackgroundService is a singleton</text><line x1="1273" y1="181" x2="1273" y2="197" stroke="#b91c1c" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="1086" y="197" width="375" height="51" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="1273" y="228" fill="#b91c1c" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">CreateScope for this item</text><line x1="1273" y1="247" x2="1273" y2="263" stroke="#b91c1c" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="1086" y="263" width="375" height="51" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="1273" y="295" fill="#b91c1c" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Resolve scoped services; dispose scope</text><rect x="16" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="38" cy="360" r="11" fill="#7c3aed"/><text x="38" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="56" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Choose from ownership</text><rect x="28" y="378" width="722" height="28" rx="8" fill="#f3e8ff"/><text x="38" y="397" fill="#6b21a8" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">State and threading, not habit.</text><rect x="28" y="410" width="722" height="26" rx="4" fill="#15803d" stroke="#cbd5e1" stroke-width="1"/><text x="36" y="428" fill="#fff" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Lifetime</text><text x="397" y="428" fill="#fff" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">From</text><rect x="28" y="436" width="722" height="53" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="456" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Transient</tspan></text><text x="397" y="456" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="397" dy="0">no state, cheap construct</tspan></text><rect x="28" y="489" width="722" height="53" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="509" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Scoped</tspan></text><text x="397" y="509" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="397" dy="0">per-request or per-job unit of work</tspan></text><rect x="28" y="541" width="722" height="53" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="561" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Singleton</tspan></text><text x="397" y="561" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="397" dy="0">shared, thread-safe, no scoped deps</tspan></text><rect x="774" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="796" cy="360" r="11" fill="#ea580c"/><text x="796" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="814" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Longer must not hold shorter</text><rect x="786" y="378" width="722" height="28" rx="8" fill="#ffedd5"/><text x="796" y="397" fill="#9a3412" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">That nesting is the captivity rule.</text><rect x="786" y="410" width="722" height="40" rx="8" fill="#1e3a5f"/><text x="1147" y="427" fill="#fff" font-size="13" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Captive  singleton → scoped</text><text x="1147" y="439" fill="#fff" font-size="10" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">the short-lived object is trapped</text><rect x="786" y="458" width="722" height="40" rx="8" fill="#2563eb"/><text x="1147" y="475" fill="#fff" font-size="13" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Singleton  process</text><text x="1147" y="487" fill="#fff" font-size="10" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">safe deps only</text><rect x="786" y="506" width="722" height="40" rx="8" fill="#86efac"/><text x="1147" y="523" fill="#14532d" font-size="13" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Scoped  request / job</text><text x="1147" y="535" fill="#14532d" font-size="10" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">DbContext lives here</text><rect x="786" y="554" width="722" height="40" rx="8" fill="#fde68a"/><text x="1147" y="571" fill="#854d0e" font-size="13" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Transient  each resolve</text><text x="1147" y="583" fill="#854d0e" font-size="10" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">no captured inner scope</text><rect x="16" y="618" width="1504" height="398" rx="12" fill="#fff" stroke="#e11d48" stroke-width="1.5"/><circle cx="38" cy="640" r="11" fill="#e11d48"/><text x="38" y="644" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="56" y="645" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Recite, trap &amp; C#</text><rect x="28" y="658" width="1480" height="28" rx="8" fill="#ffe4e6"/><text x="38" y="677" fill="#9f1239" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">IServiceScopeFactory per unit of work.</text><rect x="28" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#fda4af" stroke-width="1.5"/><text x="40" y="710" fill="#9f1239" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Worker pattern</text><rect x="40" y="718" width="461" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="750" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">public Worker(IServiceScopeFactory f)</text><text x="50" y="800" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">{ _f = f; }</text><rect x="40" y="851" width="461" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="883" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">using var scope = _f.CreateScope();</text><text x="50" y="916" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">var db = scope.ServiceProvider</text><text x="50" y="949" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">    .GetRequiredService&lt;AppDbContext&gt;();</text><rect x="525" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#86efac" stroke-width="1.5"/><text x="537" y="714" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do</text><circle cx="545" cy="747" r="7" fill="#16a34a"/><text x="545" y="751" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="559" y="741" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Choose lifetime from state and concurrency</tspan></text><circle cx="545" cy="810" r="7" fill="#16a34a"/><text x="545" y="814" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="559" y="804" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Singleton workers create a scope per unit of work</tspan></text><text x="537" y="857" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><circle cx="545" cy="889" r="7" fill="#dc2626"/><text x="545" y="893" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="559" y="883" fill="#7f1d1d" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Inject DbContext into a singleton</tspan></text><circle cx="545" cy="952" r="7" fill="#dc2626"/><text x="545" y="956" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="559" y="946" fill="#7f1d1d" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Make everything Singleton 'for performance'</tspan></text><rect x="1023" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/><text x="1035" y="710" fill="#6d28d9" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Quick C# comparison</text><rect x="1035" y="718" width="461" height="26" rx="4" fill="#f3e8ff" stroke="#cbd5e1" stroke-width="1"/><text x="1043" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Concept</text><text x="1196" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">C#</text><text x="1350" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interview</text><rect x="1035" y="744" width="461" height="62" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Transient</tspan></text><text x="1196" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">AddTransient</tspan></text><text x="1350" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">new each resolve</tspan></text><rect x="1035" y="806" width="461" height="62" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Scoped</tspan></text><text x="1196" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">AddScoped / HTTP</tspan><tspan x="1196" dy="15">scope</tspan></text><text x="1350" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">one DbContext per</tspan><tspan x="1350" dy="15">request</tspan></text><rect x="1035" y="868" width="461" height="62" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Singleton</tspan></text><text x="1196" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">AddSingleton</tspan></text><text x="1350" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">thread-safe, no</tspan><tspan x="1350" dy="15">scoped deps</tspan></text><rect x="1035" y="930" width="461" height="62" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Captive</tspan></text><text x="1196" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">scoped inside</tspan><tspan x="1196" dy="15">singleton</tspan></text><text x="1350" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">CreateScope per job</tspan></text>
</svg>
