weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Now I will test dupl</text><text x="1356" y="470" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Trace or execute tes</text><rect x="16" y="663" width="747" height="345" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="663" width="7" height="345" rx="0" fill="#dc2626"/><circle cx="44" cy="685" r="12" fill="#dc2626"/><text x="44" y="689" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="62" y="690" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The scale you must name</text><text x="32" y="705" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Set one level; everything below it goes quiet — or name the lifetime.</tspan></text><rect x="30" y="731" width="719" height="83" rx="8" fill="#2563eb"/><text x="42" y="768" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Clarify</text><text x="42" y="796" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">May input be null or empty?</text><rect x="30" y="822" width="661" height="83" rx="8" fill="#16a34a"/><text x="42" y="859" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Plan</text><text x="42" y="887" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">I will use a dictionary for lookup</text><rect x="30" y="913" width="604" height="83" rx="8" fill="#4f46e5"/><text x="42" y="950" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Verify</text><text x="42" y="978" fill="#f8fafc" font-s