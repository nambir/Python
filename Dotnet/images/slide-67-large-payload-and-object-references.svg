<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#0e7490"/><text x="28" y="36" fill="#0e7490" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D67  ·  containment</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Large Payload and Object References</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">A 200 MB file should not travel API Gateway → service A → queue → service B. Store the bytes in object storage, publish a reference (bucket/key or</tspan><tspan x="28" dy="17">URL), and let the consumer pull.</tspan></text><rect x="80" y="150" width="900" height="740" rx="18" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="100" y="184" fill="#1e40af" font-size="18" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Store blob</text><rect x="160" y="250" width="740" height="540" rx="18" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="180" y="284" fill="#166534" font-size="18" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Keep the key</text><rect x="250" y="360" width="560" height="330" rx="18" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><text x="270" y="394" fill="#9a3412" font-size="18" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Publish reference</text><rect x="340" y="450" width="380" height="160" rx="18" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><text x="360" y="484" fill="#854d0e" font-size="18" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Consumer pulls</text><rect x="1020" y="150" width="488" height="740" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="1040" y="190" fill="#0e7490" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When / when not</text><rect x="1040" y="220" width="217" height="360" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="1054" y="246" fill="#b91c1c" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Put the file on the event</text><text x="1054" y="270" fill="#7f1d1d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1054" dy="0">Publish(new FileReceived { Bytes</tspan><tspan x="1054" dy="16">= file.ToArray() });</tspan></text><rect x="1271" y="220" width="217" height="360" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="1285" y="246" fill="#166534" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="1285" y="270" fill="#14532d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1285" dy="0">Upload to object storage;</tspan><tspan x="1285" dy="16">publish FileReady { Bucket, Key,</tspan><tspan x="1285" dy="16">Sha256, Size }.</tspan></text><text x="1040" y="620" fill="#713f12" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1040" dy="0">Explains</tspan><tspan x="1040" dy="17">store-object-then-publish-location</tspan><tspan x="1040" dy="17">instead of putting the file on the bus</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Explains store-object-then-publish-location instead of putting the file on the bus</tspan></text>
</svg>
