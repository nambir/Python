<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#15803d"/><text x="28" y="36" fill="#15803d" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D04  ·  before after</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Exception Handling Strategy</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">A failed order should become one consistent API error at the boundary , while its original stack remains available to operations.</tspan></text><rect x="28" y="140" width="730" height="760" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><rect x="778" y="140" width="730" height="760" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="56" y="190" fill="#b91c1c" font-size="24" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Before — Destroy the original stack</text><text x="56" y="240" fill="#7f1d1d" font-size="18" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="56" dy="0">catch (Exception ex) { throw ex; }</tspan></text><text x="56" y="560" fill="#b91c1c" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What it sounds like</text><text x="56" y="600" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">try</text><text x="56" y="624" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">{</text><text x="56" y="648" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">    throw new InvalidOperationException(&quot;order close</text><text x="56" y="672" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">}</text><text x="56" y="696" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">catch (InvalidOperationException ex)</text><text x="56" y="720" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">{</text><text x="806" y="190" fill="#166534" font-size="24" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">After — do this</text><text x="806" y="240" fill="#14532d" font-size="18" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="806" dy="0">catch { throw; }</tspan></text><text x="806" y="520" fill="#166534" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Path to say</text><rect x="806" y="550" width="670" height="58" rx="10" fill="#fff" stroke="#166534" stroke-width="1.5"/><circle cx="836" cy="579" r="16" fill="#166534"/><text x="836" y="585" fill="#fff" font-size="13" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="864" y="585" fill="#166534" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Throw</text><rect x="806" y="620" width="670" height="58" rx="10" fill="#fff" stroke="#166534" stroke-width="1.5"/><circle cx="836" cy="579" r="16" fill="#166534"/><text x="836" y="585" fill="#fff" font-size="13" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="864" y="585" fill="#166534" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Boundary catch</text><rect x="806" y="690" width="670" height="58" rx="10" fill="#fff" stroke="#166534" stroke-width="1.5"/><circle cx="836" cy="579" r="16" fill="#166534"/><text x="836" y="585" fill="#fff" font-size="13" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="864" y="585" fill="#166534" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Log + map</text><rect x="806" y="760" width="670" height="58" rx="10" fill="#fff" stroke="#166534" stroke-width="1.5"/><circle cx="836" cy="579" r="16" fill="#166534"/><text x="836" y="585" fill="#fff" font-size="13" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="864" y="585" fill="#166534" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Client contract</text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Defends their project's exception strategy incl. global handling</tspan></text>
</svg>
