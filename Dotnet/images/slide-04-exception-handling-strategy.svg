<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><text x="768" y="28" fill="#1e3a5f" font-size="24" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Exception Handling Strategy  –  Visual Guide</text><text x="768" y="48" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Dotnet · D04  ·  Throw meaning. Map once. Keep the stack.</text><rect x="16" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="38" cy="80" r="11" fill="#2563eb"/><text x="38" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="56" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">One consistent API error</text><rect x="28" y="98" width="469" height="28" rx="8" fill="#dbeafe"/><text x="38" y="117" fill="#1e40af" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Domain throws. Boundary maps. Clients see a contract.</text><rect x="56" y="130" width="413" height="51" rx="6" fill="#ffedd5" stroke="#9a3412" stroke-width="1.6"/><text x="263" y="161" fill="#9a3412" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Domain throws OrderClosedException</text><line x1="263" y1="181" x2="263" y2="197" stroke="#9a3412" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="56" y="197" width="413" height="51" rx="6" fill="#ffedd5" stroke="#9a3412" stroke-width="1.6"/><text x="263" y="228" fill="#9a3412" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Global handler maps known types</text><line x1="263" y1="247" x2="263" y2="263" stroke="#9a3412" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="56" y="263" width="413" height="51" rx="6" fill="#ffedd5" stroke="#9a3412" stroke-width="1.6"/><text x="263" y="295" fill="#9a3412" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">ProblemDetails + correlation ID</text><rect x="521" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><circle cx="543" cy="80" r="11" fill="#16a34a"/><text x="543" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="561" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The interview trap</text><rect x="533" y="98" width="469" height="28" rx="8" fill="#dcfce7"/><text x="543" y="117" fill="#166534" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">throw ex; wipes the stack ops need.</text><rect x="533" y="130" width="230" height="184" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><circle cx="547" cy="146" r="8" fill="#dc2626"/><text x="547" y="150" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="561" y="151" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Destroy the stack</text><rect x="543" y="166" width="210" height="138" rx="6" fill="#fff" stroke="#fecaca" stroke-width="1"/><text x="551" y="190" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="551" dy="0">catch (Exception ex)</tspan></text><text x="551" y="232" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="551" dy="0">{ throw ex; }</tspan></text><text x="551" y="274" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="551" dy="0">Reset stack — ops lose the</tspan><tspan x="551" dy="16">origin.</tspan></text><rect x="773" y="130" width="230" height="184" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><circle cx="787" cy="146" r="8" fill="#16a34a"/><text x="787" y="150" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="801" y="151" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Preserve the stack</text><rect x="783" y="166" width="210" height="138" rx="6" fill="#fff" stroke="#bbf7d0" stroke-width="1"/><text x="791" y="190" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="791" dy="0">catch { throw; }</tspan></text><text x="791" y="232" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="791" dy="0">or catch and wrap with</tspan><tspan x="791" dy="16">InnerException</tspan></text><text x="791" y="274" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="791" dy="0">bare throw; keeps the</tspan><tspan x="791" dy="16">trace.</tspan></text><rect x="1027" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="1049" cy="80" r="11" fill="#4f46e5"/><text x="1049" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1067" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When to throw at all</text><rect x="1039" y="98" width="469" height="28" rx="8" fill="#ede9fe"/><text x="1049" y="117" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Failures, not validation ifs. Map once, not everywhere.</text><rect x="1039" y="130" width="469" height="26" rx="4" fill="#c2410c" stroke="#cbd5e1" stroke-width="1"/><text x="1047" y="148" fill="#fff" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Use</text><text x="1281" y="148" fill="#fff" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do not use</text><rect x="1039" y="156" width="469" height="53" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1047" y="176" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1047" dy="0">Exceptional failure</tspan></text><text x="1281" y="176" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1281" dy="0">ordinary validation branching</tspan></text><rect x="1039" y="209" width="469" height="53" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="1047" y="229" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1047" dy="0">Domain type + data</tspan></text><text x="1281" y="229" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1281" dy="0">one generic Exception everywhere</tspan></text><rect x="1039" y="261" width="469" height="53" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1047" y="281" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1047" dy="0">Map once at the boundary</tspan></text><text x="1281" y="281" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1281" dy="0">catch-log-swallow in every method</tspan></text><rect x="16" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="38" cy="360" r="11" fill="#7c3aed"/><text x="38" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="56" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Catch what you can handle</text><rect x="28" y="378" width="722" height="28" rx="8" fill="#f3e8ff"/><text x="38" y="397" fill="#6b21a8" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Typed catch at the seam that can recover.</text><rect x="28" y="410" width="722" height="144" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="38" y="428" fill="#3730a3" font-size="12" font-weight="800" text-anchor="start" font-family="Consolas,Menlo,monospace">catch the type you can act on</text><text x="38" y="457" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">try {</text><text x="38" y="472" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  throw new InvalidOperationException(&quot;order closed&quot;);</text><text x="38" y="488" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">}</text><text x="38" y="504" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">catch (InvalidOperationException ex) {</text><text x="38" y="519" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">  Console.WriteLine($&quot;Handled: {ex.Message}&quot;);</text><text x="38" y="535" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">}</text><rect x="28" y="562" width="722" height="32" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/><text x="38" y="584" fill="#334155" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">Handled: order closed</text><rect x="774" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="796" cy="360" r="11" fill="#ea580c"/><text x="796" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="814" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Three buckets at the edge</text><rect x="786" y="378" width="722" height="28" rx="8" fill="#ffedd5"/><text x="796" y="397" fill="#9a3412" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Known domain, known infra, unexpected.</text><rect x="786" y="410" width="722" height="57" rx="6" fill="#16a34a"/><text x="798" y="446" fill="#fff" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">known domain</text><text x="1496" y="446" fill="#fff" font-size="13" font-weight="500" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">map to 409 / 422 — log once</text><rect x="786" y="473" width="722" height="57" rx="6" fill="#2563eb"/><text x="798" y="509" fill="#fff" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">known infra</text><text x="1496" y="509" fill="#fff" font-size="13" font-weight="500" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">503 / retryable — no secrets</text><rect x="786" y="537" width="722" height="57" rx="6" fill="#dc2626"/><text x="798" y="572" fill="#fff" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">unexpected</text><text x="1496" y="572" fill="#fff" font-size="13" font-weight="500" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">500 + correlation — hide internals</text><rect x="16" y="618" width="1504" height="398" rx="12" fill="#fff" stroke="#e11d48" stroke-width="1.5"/><circle cx="38" cy="640" r="11" fill="#e11d48"/><text x="38" y="644" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="56" y="645" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Recite, trap &amp; C#</text><rect x="28" y="658" width="1480" height="28" rx="8" fill="#ffe4e6"/><text x="38" y="677" fill="#9f1239" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Strategy + global handler + throw;</text><rect x="28" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#fda4af" stroke-width="1.5"/><text x="40" y="710" fill="#9f1239" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Boundary</text><rect x="40" y="718" width="461" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="750" fill="#0f172a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">catch { throw; }  // keep stack</text><text x="50" y="800" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// wrap: throw new OrderEx(ex);</text><rect x="40" y="851" width="461" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="883" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// global handler → ProblemDetails</text><text x="50" y="932" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// unexpected: id + 500, log once</text><rect x="525" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#86efac" stroke-width="1.5"/><text x="537" y="714" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do</text><circle cx="545" cy="747" r="7" fill="#16a34a"/><text x="545" y="751" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="559" y="741" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Throw meaning at the domain; map at the edge</tspan></text><circle cx="545" cy="810" r="7" fill="#16a34a"/><text x="545" y="814" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="559" y="804" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Unexpected: correlation ID, log once, no internals</tspan></text><text x="537" y="857" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><circle cx="545" cy="889" r="7" fill="#dc2626"/><text x="545" y="893" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="559" y="883" fill="#7f1d1d" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">throw ex; and call it handling</tspan></text><circle cx="545" cy="952" r="7" fill="#dc2626"/><text x="545" y="956" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="559" y="946" fill="#7f1d1d" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Catch Exception in every service method</tspan></text><rect x="1023" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/><text x="1035" y="710" fill="#6d28d9" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Quick C# comparison</text><rect x="1035" y="718" width="461" height="26" rx="4" fill="#f3e8ff" stroke="#cbd5e1" stroke-width="1"/><text x="1043" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Concept</text><text x="1196" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">C#</text><text x="1350" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interview</text><rect x="1035" y="744" width="461" height="62" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Throw</tspan></text><text x="1196" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">exceptions for</tspan><tspan x="1196" dy="15">failures</tspan></text><text x="1350" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">not if/else flow</tspan></text><rect x="1035" y="806" width="461" height="62" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Custom</tspan></text><text x="1196" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">domain exception type</tspan></text><text x="1350" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">stable meaning for</tspan><tspan x="1350" dy="15">clients</tspan></text><rect x="1035" y="868" width="461" height="62" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Global</tspan></text><text x="1196" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">IExceptionHandler /</tspan><tspan x="1196" dy="15">mw</tspan></text><text x="1350" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">one map to</tspan><tspan x="1350" dy="15">ProblemDetails</tspan></text><rect x="1035" y="930" width="461" height="62" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Rethrow</tspan></text><text x="1196" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">bare throw;</tspan></text><text x="1350" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">preserve the original</tspan><tspan x="1350" dy="15">stack</tspan></text>
</svg>
