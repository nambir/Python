 font-family="Segoe UI,Arial,sans-serif">2</text><text x="819" y="105" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Good practice</text><text x="789" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Do / don't you can recite.</tspan></text><text x="787" y="158" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do</text><text x="787" y="178" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Explain Abstraction with a project example.</text><text x="787" y="200" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Compare Encapsulation with an alternative.</text><text x="787" y="222" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Prepare evidence for: Answers a scenario (not a </text><text x="787" y="252" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><text x="787" y="274" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="787" dy="0">✗ Recite definitions with no scenario — OOP is encapsulation, inheritance, polymorphism.</tspan></text><rect x="16" y="391" width="747" height="303" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="391" width="7" height="303" rx="0" fill="#4f46e5"/><circle cx="44" cy="413" r="12" fill="#4f46e5"/><text x="44" y="417" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="62" y="418" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Inside the system</text><text x="32" y="433" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Top to bottom, then the hand-off.</tspan></text><rect x="30" y="459" width="719" height="51" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="42" y="481" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Abstraction</text><text x="42" y="496" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Hide how work is done behind a stable contract (</text><text x="390" y="516" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="30" y="517" width="719" height="51" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="42" y="538" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Encapsulation</text><text x="42" y="554" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Keep invalid states impossible by making fields </text><text x="390" y="573" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="30" y="574" width="719" height="51" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="42" y="596" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interface vs abstract</text><text x="42" y="611" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interface = capability you can mix; abstract cla</text><text x="390" y="630" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="30" y="631" width="719" height="51" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="42" y="653" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Abstract vs virtual</text><text x="42" y="668" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Abstract must be overridden; virtual may be over</text><rect x="773" y="391" width="747" height="303" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="773" y="391" width="7" height="303" rx="0" fill="#7c3aed"/><circle cx="801" cy="413" r="12" fill="#7c3aed"/><text x="801" y="417" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="819" y="418" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What contains what</text><text x="789" y="433" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Outer box owns the inner ones.</tspan></text><rect x="787" y="459" width="719" height="223" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="797" y="477" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Abstract</text><rect x="815" y="487" width="663" height="168" rx="10" fill="#bfdbfe" stroke="#1e40af" stroke-width="1.5"/><text x="825" y="505" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Encapsulate</text><rect x="843" y="515" width="607" height="112" rx="10" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/><text x="853" y="533" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interface</text><rect x="871" y="543" width="552" height="56" rx="10" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/><text x="881" y="561" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Virtual vs abstract</text><rect x="16" y="705" width="747" height="303" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="16" y="705" width="7" height="303" rx="0" fill="#ea580c"/><circle cx="44" cy="727" r="12" fill="#ea580c"/><text x="44" y="731" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="62" y="732" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Numbers / interview drill</text><text x="32" y="747" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">What / where / why / how.</tspan></text><rect x="30" y="773" width="356" height="108" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="40" y="791" fill="#1e40af" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">1</text><text x="40" y="811" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Abstraction</text><text x="40" y="831" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">Hide how work is done behind a stable</tspan><tspan x="40" dy="12">contract (interface or abstract API) so</tspan><tspan x="40" dy="12">callers do not depend on a concrete class.</tspan></text><rect x="394" y="773" width="356" height="108" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="404" y="791" fill="#166534" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">2</text><text x="404" y="811" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Encapsulation</text><text x="404" y="831" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="404" dy="0">Keep invalid states impossible by making</tspan><tspan x="404" dy="12">fields private and exposing controlled</tspan><tspan x="404" dy="12">methods.</tspan></text><rect x="30" y="888" width="356" height="108" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="40" y="906" fill="#9a3412" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">3</text><text x="40" y="926" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interface vs abstract</text><text x="40" y="946" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">Interface = capability you can mix; abstract</tspan><tspan x="40" dy="12">class = shared base with optional</tspan><tspan x="40" dy="12">implementation. Prefer interface when…</tspan></text><rect x="394" y="888" width="356" height="108" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="404" y="906" fill="#854d0e" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">4</text><text x="404" y="926" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Abstract vs virtual</text><text x="404" y="946" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="404" dy="0">Abstract must be overridden; virtual may be</tspan><tspan x="404" dy="12">overridden. Use abstract when the base has</tspan><tspan x="404" dy="12">no sensible default.</tspan></text><rect x="773" y="705" width="747" height="303" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="773" y="705" width="7" height="303" rx="0" fill="#dc2626"/><circle cx="801" cy="727" r="12" fill="#dc2626"/><text x="801" y="731" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="819" y="732" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When A vs when B</text><text x="789" y="747" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Pick a path with a project example.</tspan></text><polygon points="1146,781 1216,821 1146,861 1076,821" fill="#fef9c3" stroke="#b45309" stroke-width="1.8"/><text x="1146" y="825" fill="#b45309" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Which?</text><rect x="787" y="873" width="345" height="115" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><rect x="1161" y="873" width="345" height="115" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="797" y="895" fill="#1e40af" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Interface</text><text x="797" y="917" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="797" dy="0">Can do — no shared code required.</tspan></text><text x="1171" y="895" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Abstract class</text><text x="1171" y="917" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1171" dy="0">Is a — shared implementation.</tspan></text>
