s-serif"><tspan x="192" dy="0">names your gap</tspan></text><text x="349" y="176" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="349" dy="0">blames another team</tspan></text><rect x="28" y="209" width="469" height="53" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="229" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Recover</tspan></text><text x="192" y="229" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="192" dy="0">users first</tspan></text><text x="349" y="229" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="349" dy="0">looking right</tspan></text><rect x="28" y="261" width="469" height="53" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="281" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Learn</tspan></text><text x="192" y="281" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="192" dy="0">changes system</tspan></text><text x="349" y="281" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="349" dy="0">I'll be careful</tspan></text><rect x="521" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><circle cx="543" cy="80" r="11" fill="#16a34a"/><text x="543" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="561" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The pool story</text><rect x="533" y="98" width="469" height="28" rx="8" fill="#dcfce7"/><text x="543" y="117" fill="#166534" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Skip test → exhaust → rollback → gates.</text><rect x="571" y="130" width="394" height="34" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="768" y="151" fill="#b91c1c" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">I skipped a load test</text><line x1="768" y1="164" x2="768" y2="180" stroke="#b91c1c" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="571" y="180" width="394" height="34" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="768" y="201" fill="#b91c1c" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Pool exhausted at peak</text><line x1="768" y1="214" x2="768" y2="230" stroke="#b91c1c" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="571" y="230" width="394" height="34" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="768" y="251" fill="#b91c1c" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">I led rollback</text><line x1="768" y1="264" x2="768" y2="280" stroke="#b91c1c" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="571" y="280" width="394" height="34" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="768" y="301" fill="#b91c1c" font-size="12" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Gate + alert + canary</text><rect x="1027" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="1049" cy="80" r="11" fill="#4f46e5"/><text x="1049" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1067" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What actually changed</text><rect x="1039" y="98" width="469" height="28" rx="8" fill="#ede9fe"/><text x="1049" y="117" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">A promise is not a control.</text><rect x="1039" y="130" width="469" height="42" rx="6" fill="#1d4ed8"/><text x="1051" y="156" fill="#fff" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Perf gate</text><text x="1496" y="156" fill="#fff" font-size="13" font-weight="500" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">load test in the pipeline</text><rect x="1039" y="178" width="469" height="42" rx="6" fill="#ea580c"/><text x="1051" y="203" fill="#fff" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Pool alert</text><text x="1496" y="203" fill="#fff" font-size="13" font-weight="500" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">saturation before users</text><rect x="1039" y="225" width="469" height="42" rx="6" fill="#16a34a"/><text x="1051" y="251" fill="#fff" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Canary</text><text x="1496" y="251" fill="#fff" font-size="13" font-weight="500" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">small % then promote</text><rect x="1039" y="272" width="469" height="42" rx="6" fill="#475569"/><text x="1051" y="298" fill="#fff" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Runbook</text><text x="1496" y="298" fill="#fff" font-size="13" font-weight="500" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">rollback is a step, not a hero</text><rect x="16" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="38" cy="360" r="11" fill="#7c3aed"/><text x="38" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="56" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The interview trap</text><rect x="28" y="378" width="722" height="28" rx="8" fill="#f3e8ff"/><text x="38" y="397" fill="#6b21a8" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Perfectionism is not a failure story.</text><rect x="28" y="410" width="356" height="184" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><circle cx="42" cy="426" r="8" fill="#dc2626"/><text x="42" y="430" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="56" y="431" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Safe fake</text><rect x="38" y="446" width="336" height="138" rx="6" fill="#fff" stroke="#fecaca" stroke-width="1"/><text x="46" y="470" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="46" dy="0">I care too much.</tspan></text><text x="46" y="512" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="46" dy="0">I work too hard.</tspan></text><text x="46" y="554" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="46" dy="0">No incident, no change.</tspan></text><rect x="394" y="410" width="356" height="184" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><circle cx="408" cy="426" r="8" fill="#16a34a"/><text x="408" y="430" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="422" y="431" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Real gap</text><rect x="404" y="446" width="336" height="138" rx="6" fill="#fff" stroke="#bbf7d0" stroke-width="1"/><text x="412" y="470" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="412" dy="0">I approved without load</tspan></text><text x="4