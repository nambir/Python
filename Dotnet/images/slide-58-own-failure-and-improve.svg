<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Own Failure and Improve  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D58  ·  A mature failure story is specific about your gap, responsible during recovery, and durable about what changed</text><rect x="16" y="78" width="747" height="303" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="16" y="78" width="7" height="303" rx="0" fill="#7c3aed"/><circle cx="44" cy="100" r="12" fill="#7c3aed"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The trap vs the fix</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Preferred form vs the interview trap.</tspan></text><rect x="30" y="146" width="354" height="223" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="38" y="164" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Safe fake failure</text><text x="38" y="186" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="38" dy="0">Uses perfectionism as the mistake</tspan></text><rect x="394" y="146" width="354" height="223" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="164" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text