#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="773" y="146" width="362" height="49" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="954" y="167" fill="#9a3412" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="954" dy="0">Inventory</tspan></text><line x1="1134" y1="171" x2="1144" y2="171" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1144" y="146" width="362" height="49" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="1325" y="167" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="1325" dy="0">Ship / compensate</tspan></text><text x="30" y="211" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">Name each box, then the hand-off. Walks a later-step failure and names the compensating event, not a distributed DB transaction</tspan></text><rect x="16" y="298" width="495" height="355" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="298" width="7" height="355" rx="0" fill="#dc2626"/><circle cx="44" cy="320" r="12" fill="#dc2626"/><text x="44" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="62" y="325" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Good practice</text><text x="32" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Do / don't you can recite.</tspan></text><text x="30" y="378" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do</text><text x="30" y="398" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Explain Why not one SQL transaction with a proje</text><text x="30" y="420" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Compare Happy path with an alternative.</text><text x="30" y="442" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Prepare evidence for: Walks a later-step failure</text><text x="30" y="472" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><text x="30" y="494" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">✗ Claim distributed SQL rollback — If shipment fails we rollback</tspan><tspan x="30" dy="13">the whole distributed transaction.</tspan></text><rect x="521" y="298" width="495" height="355" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="521" y="298" width="7" height="355" rx="0" fill="#2563eb"/><circle cx="549" cy="320" r="12" fill="#2563eb"/><text x="549" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="567" y="325" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Inside the system</text><text x="537" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Top to bottom, then the hand-off.</tspan></text><rect x="535" y="366" width="467" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="547" y="393" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Why not one SQL transaction</text><text x="547" y="412" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Each microservice owns its DB. You cannot BEGIN </text><text x="768" y="435" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="535" y="436" width="467" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="547" y="463" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Happy path</text><text x="547" y="483" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">OrderCreated → PaymentCaptured → InventoryReserv</text><text x="768" y="506" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="535" y="506" width="467" height="64" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="547" y="533" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Failure</text><text x="547" y="553" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">If InventoryReserved fails after payment, publis</text><text x="768" y="576" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="535" y="577" width="467" height="64" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="547" y="604" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Choreography vs orchestration</text><text x="547" y="623" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Choreography: each service reacts to events. Orc</text><rect x="1025" y="298" width="495" height="355" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="1025" y="298" width="7" height="355" rx="0" fill="#16a34a"/><circle cx="1053" cy="320" r="12" fill="#16a34a"/><text x="1053" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="1071" y="325" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What contains what</text><text x="1041" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Outer box owns the inner ones.</tspan></text><rect x="1039" y="366" width="467" height="275" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="1049" y="384" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Order</text><rect x="1074" y="400" width="398" height="206" rx="10" fill="#bfdbfe" stroke="#1e40af" stroke-width="1.5"/><text x="1084" y="418" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Payment</text><rect x="1108" y="435" width="329" height="138" rx="10" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/><text x="1118" y="453" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Inventory</text><rect x="1142" y="469" width="260" height="69" rx="10" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/><text x="1152" y="487" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Ship / compensate</text><rect x="16" y="663" width="747" height="345" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="663" width="7" height="345" rx="0" fill="#4f46e5"/><circle cx="44" cy="685" r="12" fill="#4f46e5"/><text x="44" y="689" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="62" y="690" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Numbers / interview drill</text><text x="32" y="705" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">What / where / why / how.</tspan></text><rect x="30" y="731" width="356" height="128" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="40" y="749" fill="#1e40af" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">1</text><text x="40" y="769" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Why not one SQL transa</text><text x="40" y="789" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">Each microservice owns its DB. You cannot</tspan><tspan x="40" dy="12">BEGIN TRAN across independently deployed</tspan><tspan x="40" dy="12">services.</tspan></text><rect x="394" y="731" width="356" height="128" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="404" y="749" fill="#166534" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">2</text><text x="404" y="769" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Happy path</text><text x="404" y="789" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="404" dy="0">OrderCreated → PaymentCaptured →</tspan><tspan x="404" dy="12">InventoryReserved → Shipped.</tspan></text><rect x="30" y="868" width="356" height="128" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="40" y="886" fill="#9a3412" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">3</text><text x="40" y="906" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Failure</text><text x="40" y="926" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="40" dy="0">If InventoryReserved fails after payment,</tspan><tspan x="40" dy="12">publish PaymentRefundRequested — a</tspan><tspan x="40" dy="12">compensating action.</tspan></text><rect x="394" y="868" width="356" height="128" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="404" y="886" fill="#854d0e" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">4</text><text x="404" y="906" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Choreography vs orches</text><text x="404" y="926" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="404" dy="0">Choreography: each service reacts to events.</tspan><tspan x="404" dy="12">Orchestration: one coordinator tells each</tspan><tspan x="404" dy="12">step. Name which you used.</tspan></text><rect x="773" y="663" width="747" height="345" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="773" y="663" width="7" height="345" rx="0" fill="#7c3aed"/><circle cx="801" cy="685" r="12" fill="#7c3aed"/><text x="801" y="689" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="819" y="690" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When A vs when B</text><text x="789" y="705" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Pick a path with a project example.</tspan></text><polygon points="1146,739 1216,779 1146,819 1076,779" fill="#fef9c3" stroke="#b45309" stroke-width="1.8"/><text x="1146" y="783" fill="#b45309" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Which?</text><rect x="787" y="831" width="345" height="157" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><rect x="1161" y="831" width="345" height="157" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="797" y="853" fill="#1e40af" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Why not one SQL tran</text><text x="797" y="875" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="797" dy="0">Each microservice owns its DB. You cannot</tspan><tspan x="797" dy="13">BEGIN TRAN across independently deployed</tspan><tspan x="797" dy="13">services.</tspan></text><text x="1171" y="853" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Happy path</text><text x="1171" y="875" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1171" dy="0">OrderCreated → PaymentCaptured →</tspan><tspan x="1171" dy="13">InventoryReserved → Shipped.</tspan></text>
