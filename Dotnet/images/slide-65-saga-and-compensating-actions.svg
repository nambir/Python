<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#1e3a5f"/><text x="28" y="36" fill="#1e3a5f" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D65  ·  hero flow</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Saga and Compensating Actions</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">A saga coordinates a business flow across services that each have their own database. There is no single SQL transaction. If shipment fails, you</tspan><tspan x="28" dy="17">compensate (refund, restock) with more events.</tspan></text><rect x="28" y="150" width="354" height="150" rx="16" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><circle cx="56" cy="178" r="18" fill="#1e3a5f"/><text x="56" y="184" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="44" y="228" fill="#1e40af" font-size="18" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Order</tspan></text><line x1="382" y1="225" x2="404" y2="225" stroke="#1e3a5f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="404" y="150" width="354" height="150" rx="16" fill="#dcfce7" stroke="#166534" stroke-width="2"/><circle cx="432" cy="178" r="18" fill="#1e3a5f"/><text x="432" y="184" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="420" y="228" fill="#166534" font-size="18" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="420" dy="0">Payment</tspan></text><line x1="757" y1="225" x2="779" y2="225" stroke="#1e3a5f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="779" y="150" width="354" height="150" rx="16" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><circle cx="807" cy="178" r="18" fill="#1e3a5f"/><text x="807" y="184" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="795" y="228" fill="#9a3412" font-size="18" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="795" dy="0">Inventory</tspan></text><line x1="1132" y1="225" x2="1154" y2="225" stroke="#1e3a5f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1154" y="150" width="354" height="150" rx="16" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><circle cx="1182" cy="178" r="18" fill="#1e3a5f"/><text x="1182" y="184" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="1170" y="228" fill="#854d0e" font-size="18" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1170" dy="0">Ship / compensate</tspan></text><rect x="28" y="330" width="733" height="220" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="42" y="356" fill="#b91c1c" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Claim distributed SQL roll</text><text x="42" y="380" fill="#7f1d1d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="42" dy="0">If shipment fails we rollback</tspan><tspan x="42" dy="16">the whole distributed</tspan><tspan x="42" dy="16">transaction.</tspan></text><rect x="775" y="330" width="733" height="220" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="789" y="356" fill="#166534" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="789" y="380" fill="#14532d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Shipment fails → ShipmentFailed</tspan><tspan x="789" dy="16">event → Payment service refunds</tspan><tspan x="789" dy="16">(idempotent) → Inventory</tspan><tspan x="789" dy="16">releases the hold.</tspan></text><rect x="28" y="570" width="900" height="340" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="48" y="600" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Code you can point at</text><text x="48" y="630" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// After PaymentCaptured, Inventory handler:</text><text x="48" y="652" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">try { await ReserveAsync(orderId); await _bus.Publish(new </text><text x="48" y="674" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">catch {</text><text x="48" y="696" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">    await _bus.Publish(new InventoryReserveFailed(orderId)</text><text x="48" y="718" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">}</text><text x="48" y="740" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">// Payment handler of InventoryReserveFailed:</text><text x="48" y="762" fill="#0f172a" font-size="14" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">await RefundAsync(orderId); // must be idempotent</text><rect x="948" y="570" width="560" height="340" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="968" y="600" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><text x="968" y="640" fill="#0f172a" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Why not one SQL transaction</text><text x="968" y="660" fill="#475569" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="968" dy="0">Each microservice owns its DB. You cannot</tspan><tspan x="968" dy="15">BEGIN TRAN across independently deployed…</tspan></text><text x="968" y="700" fill="#0f172a" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Happy path</text><text x="968" y="720" fill="#475569" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="968" dy="0">OrderCreated → PaymentCaptured →</tspan><tspan x="968" dy="15">InventoryReserved → Shipped.</tspan></text><text x="968" y="760" fill="#0f172a" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Failure</text><text x="968" y="780" fill="#475569" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="968" dy="0">If InventoryReserved fails after payment,</tspan><tspan x="968" dy="15">publish PaymentRefundRequested — a…</tspan></text><text x="968" y="820" fill="#0f172a" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Choreography vs orchestratio</text><text x="968" y="840" fill="#475569" font-size="12" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="968" dy="0">Choreography: each service reacts to</tspan><tspan x="968" dy="15">events. Orchestration: one coordinator…</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Walks a later-step failure and names the compensating event, not a distributed DB transaction</tspan></text>
</svg>
