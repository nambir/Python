<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Prove the Bug Fix  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D39  ·  A difficult bug becomes manageable when each observation narrows the fault until one testable cause remains.</text><rect x="16" y="78" width="495" height="460" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="78" width="7" height="460" rx="0" fill="#4f46e5"/><circle cx="44" cy="100" r="12" fill="#4f46e5"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Prove the bug, then lock it</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Name each box, then the hand-off.</tspan></text><rect x="30" y="146" width="109" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="85" y="174" fill="#1e40af" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="85" dy="0">Reproduce</tspan></text><line x1="139" y1="178" x2="149" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="149" y="146" width="109" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="204" y="174" fill="#166534" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="204" dy="0">Isolate</tspan></text><line x1="258" y1="178" x2="268" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="268" y="146" width="109" height="64" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="323" y="174" fill="#9a3412" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="323" dy="0">Prove cause</tspan></text><line x1="378" y1="178" x2="388" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="388" y="146" width="109" height="64" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="442" y="174" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="442" dy="0">Regression</tspan><tspan x="442" dy="13">test</tspan></text><text x="30" y="226" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">Name each box, then the hand-off. Tells a hard-bug story with the</tspan><tspan x="30" dy="13">actual isolation steps, not just the fix</tspan></text><rect x="521" y="78" width="495" height="460" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="521" y="78" width="7" height="460" rx="0" fill="#7c3aed"/><circle cx="549" cy="100" r="12" fill="#7c3aed"/><text x="549" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="567" y="105" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The trap vs the fix</text><text x="537" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Preferred form vs the interview trap.</tspan></text><rect x="535" y="146" width="228" height="380" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="543" y="164" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Fix-only story</text><text x="543" y="186" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="543" dy="0">Jumps directly to the code</tspan><tspan x="543" dy="13">change</tspan></text><rect x="773" y="146" width="228" height="380" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="781" y="164" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="781" y="186" fill="#14532d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="781" dy="0">Shows observations and isolation</tspan><tspan x="781" dy="13">experiments</tspan></text><rect x="1025" y="78" width="495" height="460" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="1025" y="78" width="7" height="460" rx="0" fill="#ea580c"/><circle cx="1053" cy="100" r="12" fill="#ea580c"/><text x="1053" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1071" y="105" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice, C#, remember</text><text x="1041" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Recite practice, then the C# cousin.</tspan></text><rect x="1039" y="146" width="150" height="380" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="1047" y="162" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><text x="1047" y="180" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Reproduce</text><text x="1053" y="194" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Same input fails consi</text><text x="1047" y="207" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Isolate</text><text x="1053" y="221" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">One dependency changes</text><text x="1047" y="234" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Prove</text><text x="1053" y="248" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Regression test passes</text><rect x="1198" y="146" width="150" height="380" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="1206" y="162" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice</text><text x="1206" y="180" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Write a five-step </text><text x="1206" y="194" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Name two rejected </text><text x="1206" y="208" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Identify the regre</text><rect x="1356" y="146" width="150" height="380" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="1364" y="162" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">C# map</text><text x="1364" y="180" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Interface</text><text x="1370" y="194" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">the contract callers d</text><text x="1364" y="207" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Scoped</text><text x="1370" y="221" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">one instance per HTTP </text><text x="1364" y="234" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• SaveChanges</text><text x="1370" y="248" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">the unit of work</text><text x="1364" y="261" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Middleware</text><text x="1370" y="275" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">runs in, then unwinds </text><rect x="16" y="548" width="495" height="460" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="548" width="7" height="460" rx="0" fill="#dc2626"/><circle cx="44" cy="570" r="12" fill="#dc2626"/><text x="44" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="62" y="575" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Good practice</text><text x="32" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Do / don't you can recite.</tspan></text><text x="30" y="628" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do</text><text x="30" y="648" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Write a five-step hard-bug timeline.</text><text x="30" y="670" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Name two rejected hypotheses.</text><text x="30" y="692" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Identify the regression test.</text><text x="30" y="722" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><text x="30" y="744" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">✗ Fix-only story — Jumps directly to the code change</tspan></text><rect x="521" y="548" width="495" height="460" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="521" y="548" width="7" height="460" rx="0" fill="#2563eb"/><circle cx="549" cy="570" r="12" fill="#2563eb"/><text x="549" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="567" y="575" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Inside the system</text><text x="537" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Top to bottom, then the hand-off.</tspan></text><rect x="535" y="616" width="467" height="123" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="547" y="668" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Reproduce</text><text x="547" y="704" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Same input fails consistently</text><text x="768" y="744" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="535" y="745" width="467" height="123" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="547" y="796" fill="#166534" font-size="13" font-weight="800" text-anchor