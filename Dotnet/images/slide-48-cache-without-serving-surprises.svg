<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#0f766e"/><text x="28" y="36" fill="#0f766e" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D48  ·  vs split</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Cache Without Serving Surprises</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">A cache is a deliberate consistency trade: every fast read needs an explicit freshness and failure policy.</tspan></text><rect x="28" y="140" width="700" height="760" rx="18" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><rect x="808" y="140" width="700" height="760" rx="18" fill="#dcfce7" stroke="#166534" stroke-width="2"/><circle cx="768" cy="420" r="36" fill="#0f766e"/><text x="768" y="428" fill="#fff" font-size="18" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">VS</text><text x="48" y="190" fill="#1e40af" font-size="26" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">TTL only</text><text x="48" y="240" fill="#1e3a5f" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="48" dy="0">Stale until the clock expires.</tspan></text><text x="828" y="190" fill="#166534" font-size="26" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Event invalidate</text><text x="828" y="240" fill="#14532d" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="828" dy="0">Drop the key when the write happens.</tspan></text><text x="48" y="520" fill="#1e40af" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Cache-aside</text><text x="48" y="548" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="48" dy="0">Read-heavy access</tspan></text><text x="48" y="780" fill="#b91c1c" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Permanent cache</text><text x="48" y="808" fill="#7f1d1d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="48" dy="0">Caches without expiry or invalidation</tspan></text><text x="828" y="780" fill="#166534" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="828" y="808" fill="#14532d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="828" dy="0">Defines freshness, eviction, and outage behavior</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Describes a cache they added: what was cached, TTL vs event invalidation, staleness handling</tspan></text>
</svg>
