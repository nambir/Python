<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Cache Without Serving Surprises  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D48  ·  A cache is a deliberate consistency trade: every fast read needs an explicit freshness and failure policy.</text><rect x="16" y="78" width="495" height="460" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="78" width="7" height="460" rx="0" fill="#dc2626"/><circle cx="44" cy="100" r="12" fill="#dc2626"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Compare — pick with a reason</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Say the criterion, then the choice.</tspan></text><rect x="30" y="146" width="467" height="28" rx="6" fill="#1e3a5f"/><text x="36" y="166" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Policy</text><text x="192" y="166" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Best fit</text><text x="347" y="166" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Tradeoff</text><rect x="30" y="174" width="467" height="28" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="194" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">TTL only</text><text x="192" y="194" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Bounded staleness ac</text><text x="347" y="194" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Changes remain stale</text><rect x="30" y="202" width="467" height="28" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="222" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Event invalidation</text><text x="192" y="222" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Fast freshness neede</text><text x="347" y="222" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Events may be delaye</text><rect x="30" y="230" width="467" height="28" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="250" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Cache-aside</text><text x="192" y="250" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Read-heavy access</text><text x="347" y="250" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">First request pays m</text><rect x="521" y="78" width="495" height="460" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="521" y="78" width="7" height="460" rx="0" fill="#2563eb"/><circle cx="549" cy="100" r="12" fill="#2563eb"/><text x="549" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="567" y="105" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How the pieces connect</text><text x="537" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Name each box, then the hand-off.</tspan></text><rect x="535" y="146" width="109" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="589" y="174" fill="#1e40af" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="589" dy="0">Read path</tspan></text><line x1="644" y1="178" x2="654" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="654" y="146" width="109" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="708" y="174" fill="#166534" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="708" dy="0">Cache-aside</tspan></text><line x1="763" y1="178" x2="773" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="773" y="146" width="109" height="64" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="828" y="174" fill="#9a3412" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="828" dy="0">Invalidate</tspan><tspan x="828" dy="13">event</tspan></text><line x1="882" y1="178" x2="892" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="892" y="146" width="109" height="64" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="947" y="174" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="947" dy="0">TTL as backup</tspan></text><text x="535" y="226" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="535" dy="0">Name each box, then the hand-off. Describes a cache they added:</tspan><tspan x="535" dy="13">what was cached, TTL vs event invalidation, staleness handling</tspan></tex