<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#b45309"/><text x="28" y="36" fill="#b45309" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">.NET  ·  D62  ·  timeline</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SOLID With a Change Story</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">Interviewers do not accept “open for extension, closed for modification” as the whole answer. They want the problem , the class that changed , and how</tspan><tspan x="28" dy="17">the next variant can be added.</tspan></text><rect x="80" y="280" width="1376" height="8" rx="4" fill="#b45309"/><circle cx="140" cy="284" r="34" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/><text x="140" y="292" fill="#1e40af" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><rect x="0" y="360" width="280" height="200" rx="14" fill="#f8fafc" stroke="#1e40af" stroke-width="2"/><text x="140" y="400" fill="#1e40af" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Old design</text><text x="20" y="440" fill="#475569" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="20" dy="0">A new device or payment path</tspan><tspan x="20" dy="16">should be a new class behind</tspan><tspan x="20" dy="16">an interface, not a growing</tspan><tspan x="20" dy="16">if/else in a working</tspan><tspan x="20" dy="16">service.</tspan></text><circle cx="480" cy="284" r="34" fill="#dcfce7" stroke="#166534" stroke-width="3"/><text x="480" y="292" fill="#166534" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><rect x="340" y="360" width="280" height="200" rx="14" fill="#f8fafc" stroke="#166534" stroke-width="2"/><text x="480" y="400" fill="#166534" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Change request</text><text x="360" y="440" fill="#475569" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="360" dy="0">High-level policy depends on</tspan><tspan x="360" dy="16">abstractions. Controllers</tspan><tspan x="360" dy="16">depend on IOrderService, not</tspan><tspan x="360" dy="16">SqlOrderRepository.</tspan></text><circle cx="820" cy="284" r="34" fill="#ffedd5" stroke="#9a3412" stroke-width="3"/><text x="820" y="292" fill="#9a3412" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><rect x="680" y="360" width="280" height="200" rx="14" fill="#f8fafc" stroke="#9a3412" stroke-width="2"/><text x="820" y="400" fill="#9a3412" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">OCP / DIP move</text><text x="700" y="440" fill="#475569" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="700" dy="0">A subtype must honor the</tspan><tspan x="700" dy="16">base contract. Do not throw</tspan><tspan x="700" dy="16">NotImplementedException in</tspan><tspan x="700" dy="16">an override the caller</tspan><tspan x="700" dy="16">already uses.</tspan></text><circle cx="1160" cy="284" r="34" fill="#fef9c3" stroke="#854d0e" stroke-width="3"/><text x="1160" y="292" fill="#854d0e" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><rect x="1020" y="360" width="280" height="200" rx="14" fill="#f8fafc" stroke="#854d0e" stroke-width="2"/><text x="1160" y="400" fill="#854d0e" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">What stayed closed</text><text x="1040" y="440" fill="#475569" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1040" dy="0">One reason to change per</tspan><tspan x="1040" dy="16">class; fat interfaces force</tspan><tspan x="1040" dy="16">unused methods. Split</tspan><tspan x="1040" dy="16">IReadOrders from</tspan><tspan x="1040" dy="16">IWriteOrders when callers</tspan></text><rect x="28" y="600" width="733" height="300" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="42" y="626" fill="#b91c1c" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Quote the acronym only</text><text x="42" y="650" fill="#7f1d1d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="42" dy="0">OCP means open for extension and</tspan><tspan x="42" dy="16">closed for modification.</tspan></text><rect x="775" y="600" width="733" height="300" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="789" y="626" fill="#166534" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="789" y="650" fill="#14532d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Problem: new hub stack. Change:</tspan><tspan x="789" dy="16">new IHubForwarder</tspan><tspan x="789" dy="16">implementation. Old</tspan><tspan x="789" dy="16">ForwardMiddleware was not</tspan><tspan x="789" dy="16">rewritten. Next adapter =</tspan><tspan x="789" dy="16">another class.</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Tells one real change that was added without editing working production code</tspan></text>
</svg>
