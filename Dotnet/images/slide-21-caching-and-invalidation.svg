 fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Coalesce refreshes or add jitter so many</text><rect x="521" y="548" width="495" height="460" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="521" y="548" width="7" height="460" rx="0" fill="#2563eb"/><circle cx="549" cy="570" r="12" fill="#2563eb"/><text x="549" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="567" y="575" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Minimal setup / sample</text><text x="537" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Configure once; point at a real line.</tspan></text><rect x="535" y="616" width="467" height="344" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="545" y="634" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># walk the diagram — no sample on this slide</text><text x="539" y="984" fill="#166534" font-size="11" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Explains what they cached, why, and how staleness was bounded</text><rect x="1025" y="548" width="495" height="460" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="1025" y="548" width="7" height="460" rx="0" fill="#16a34a"/><circle cx="1053" cy="570" r="12" fill="#16a34a"/><text x="1053" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="1071" y="575" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The trap vs the fix</text><text x="1041" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Preferred form vs the interview trap.</tspan></text><rect x="1039" y="616" width="228" height="380" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="1047" y="634" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Cache forever</text><text x="1047" y="656" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1047" dy="0">Set entries with no expiry or</tspan><tspan x="1047" dy="13">invalidation.</tspan></text><rect x="1278" y="616" width="228" height="380" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="1286" y="634" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="1286" y="656" fill="#14532d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1286" dy="0">Define ownership, TTL,</tspan><tspan x="1286" dy="13">invalidation, capacity, and</tspan><tspan x="1286" dy="13">stale-data behavior.</tspan></text>
