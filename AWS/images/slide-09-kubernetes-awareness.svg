<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Kubernetes Awareness  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">AWS  ·  W09  ·  Kubernetes schedules containers too. A Pod is the smallest unit. A Deployment keeps replicas. A Service is a s</text><rect x="16" y="78" width="495" height="460" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="78" width="7" height="460" rx="0" fill="#4f46e5"/><circle cx="44" cy="100" r="12" fill="#4f46e5"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Compare — pick with a reason</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Say the criterion, then the choice.</tspan></text><rect x="30" y="146" width="467" height="28" rx="6" fill="#1e3a5f"/><text x="36" y="166" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Idea</text><text x="269" y="166" fill="#fff" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><rect x="30" y="174" width="467" height="28" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="194" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Pod ≈ task</text><text x="269" y="194" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">One or more containe</text><rect x="30" y="202" width="467" height="28" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="222" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Deployment ≈ service</text><text x="269" y="222" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Rolling updates.</text><rect x="30" y="230" width="467" height="28" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="250" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Service / Ingress</text><text x="269" y="250" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Cluster DNS and HTTP</text><rect x="30" y="258" width="467" height="28" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/><text x="36" y="278" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Config/secrets</text><text x="269" y="278" fill="#0f172a" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ConfigMap / Secret —</text><rect x="521" y="78" width="495" height="460" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="521" y="78" width="7" height="460" rx="0" fill="#7c3aed"/><circle cx="549" cy="100" r="12" fill="#7c3aed"/><text x="549" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="567" y="105" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Numbers / interview drill</text><text x="537" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">What / where / why / how.</tspan></text><rect x="535