ize="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">4</text><text x="782" y="378" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Config/secrets</text><text x="782" y="398" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="782" dy="0">ConfigMap / Secret — same</tspan><tspan x="782" dy="12">idea as env and secrets on</tspan><tspan x="782" dy="12">ECS.</tspan></text><rect x="1025" y="78" width="495" height="460" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="1025" y="78" width="7" height="460" rx="0" fill="#ea580c"/><circle cx="1053" cy="100" r="12" fill="#ea580c"/><text x="1053" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1071" y="105" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When A vs when B</text><text x="1041" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Pick a path with a project example.</tspan></text><polygon points="1273,154 1343,194 1273,234 1203,194" fill="#fef9c3" stroke="#b45309" stroke-width="1.8"/><text x="1273" y="198" fill="#b45309" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Which?</text><rect x="1039" y="246" width="224" height="272" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><rect x="1282" y="246" width="224" height="272" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="1049" y="268" fill="#1e40af" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ECS task/service</text><text x="1049" y="290" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1049" dy="0">What this project actually</tspan><tspan x="1049" dy="13">ran.</tspan></text><text x="1292" y="268" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">K8s pod/deploy</text><text x="1292" y="290" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1292" dy="0">Awareness names only unless</tspan><tspan x="1292" dy="13">you operated it.</tspan></text><rect x="16" y="548" width="495" height="460" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="548" width="7" height="460" rx="0" fill="#dc2626"/><circle cx="44" cy="570" r="12" fill="#dc2626"/><text x="44" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="62" y="575" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The scale you must name</text><text x="32" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Set one level; everything below it goes quiet — or name the</tspan><tspan x="32" dy="13">lifetime.</tspan></text><rect x="30" y="616" width="467" height="89" rx="8" fill="#2563eb"/><text x="42" y="656" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Pod ≈ task</text><text x="42" y="685" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">One or more containers scheduled togethe</text><rect x="30" y="713" width="429" height="89" rx="8" fill="#16a34a"/><text x="42" y="753" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Deployment ≈ service d</text><text x="42" y="782" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Rolling updates.</text><rect x="30" y="810" width="392" height="89" rx="8" fill="#4f46e5"/><text x="42" y="850" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Service / Ingress</text><text x="42" y="879" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Cluster DNS and HTTP entry — similar to </text><rect x="30" y="907" width="355" height="89" rx="8" fill="#7c3aed"/><text x="42" y="947" fill="#fff" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Config/secrets</text><text x="42" y="976" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ConfigMap / Secret — same idea as env an</text><rect x="521" y="548" width="495" height="460" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="521" y="548" width="7" height="460" rx="0" fill="#2563eb"/><circle cx="549" cy="570" r="12" fill="#2563eb"/><text x="549" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="567" y="575" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Minimal setup / sample</text><text x="537" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Configure once; point at a real line.</tspan></text><rect x="535" y="616" width="467" height="344" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="545" y="634" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># mapping only</text><text x="545" y="650" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># Pod ~ ECS task</text><text x="545" y="666" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># Deployment ~ ECS service</text><text x="545" y="682" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># Service/Ingress ~ ALB / API Gateway</text><text x="539" y="984" fill="#166534" font-size="11" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Awareness, not a fake cluster story.</text><rect x="1025" y="548" width="495" height="460" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="1025" y="548" width="7" height="460" rx="0" fill="#16a34a"/><circle cx="1053" cy="570" r="12" fill="#16a34a"/><text x="1053" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="1071" y="575" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How the pieces connect</text><text x="1041" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Name each box, then the hand-off.</tspan></text><rect x="1039" y="616" width="109" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="1094" y="644" fill="#1e40af" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="1094" dy="0">Pod ≈ task</tspan></text><line x1="1149" y1="648" x2="1159" y2="648" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1159" y="616" width="109" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="1213" y="644" fill="#166534" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="1213" dy="0">Deploy ≈</tspan><tspan x="1213" dy="13">service</tspan></text><line x1="1268" y1="648" x2="1278" y2="648" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1278" y="616" width="109" height="64" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="1332" y="644" fill="#9a3412" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="1332" dy="0">K8s Service ≈</tspan><tspan x="1332" dy="13">LB</tspan></text><line x1="1387" y1="648" x2="1397" y2="648" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1397" y="616" width="109" height="64" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="1451" y="644" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="1451" dy="0">Don't</tspan><tspan x="1451" dy="13">overclaim</tspan></text><text x="1039" y="696" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1039" dy="0">Name each box, then the hand-off. Maps ECS ideas to K8s names and</tspan><tspan x="1039" dy="13">does not claim cluster admin work</tspan></text>
