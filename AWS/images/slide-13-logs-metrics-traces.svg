00" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Error ratio / SLO burn</tspan></text><text x="397" y="451" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="397" dy="0">page a human</tspan></text><rect x="28" y="476" width="722" height="40" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="491" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Every 500 in logs</tspan></text><text x="397" y="491" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="397" dy="0">noise — do not page</tspan></text><rect x="28" y="515" width="722" height="40" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="530" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">p95 + saturation</tspan></text><text x="397" y="530" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="397" dy="0">investigate before users revolt</tspan></text><rect x="28" y="554" width="722" height="40" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="36" y="570" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="36" dy="0">Queue depth</tspan></text><text x="397" y="570" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="397" dy="0">workers, not only the API</tspan></text><rect x="774" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="796" cy="360" r="11" fill="#ea580c"/><text x="796" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="814" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The interview trap</text><rect x="786" y="378" width="722" height="28" rx="8" fill="#ffedd5"/><text x="796" y="397" fill="#9a3412" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Logging exceptions is not observability.</text><rect x="786" y="410" width="356" height="184" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><circle cx="800" cy="426" r="8" fill="#dc2626"/><text x="800" y="430" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="814" y="431" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">We have logging</text><rect x="796" y="446" width="336" height="138" rx="6" fill="#fff" stroke="#fecaca" stroke-width="1"/><text x="804" y="474" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="804" dy="0">We log exceptions.</tspan></text><rect x="1152" y="410" width="356" height="184" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><circle cx="1166" cy="426" r="8" fill="#16a34a"/><text x="1166" y="430" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="1180" y="431" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Three signals + one alert</text><rect x="1162" y="446" width="336" height="138" rx="6" fill="#fff" stroke="#bbf7d0" stroke-width="1"/><text x="1170" y="474" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1170" dy="0">Logs + metrics + traces</tspan></text><text x="1170" y="537" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1170" dy="0">and an SLO I can name.</tspan></text><rect x="16" y="618" width="1504" height="398" rx="12" fill="#fff" stroke="#e11d48" stroke-width="1.5"/><circle cx="38" cy="640" r="11" fil