<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Logs, Metrics, Traces  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">AWS  ·  W13  ·  Logs tell why this request failed. Metrics tell how many users are hurt. Traces tell which hop is slow. OpenTe</text><rect x="16" y="78" width="747" height="303" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="16" y="78" width="7" height="303" rx="0" fill="#2563eb"/><circle cx="44" cy="100" r="12" fill="#2563eb"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How the pieces connect</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Name each box, then the hand-off.</tspan></text><rect x="30" y="146" width="172" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="116" y="174" fill="#1e40af" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="116" dy="0">App emit</tspan></text><line x1="202" y1="178" x2="212" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="212" y="146" width="172" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="298" y="174" fill="#166534" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="298" dy="0">Logs</tspan></text><line x1="384" y1="178" x2="394" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="394" y="146" width="172" height="64" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="481" y="174" fill="#9a3412" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="481" dy="0">Metrics</tspan></text><line x1="567" y1="178" x2="577" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="577" y="146" width="172" height="64" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="663" y="174" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="663" dy="0">Traces → alert</tspan></text><text x="30" y="226" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">Name each box, then the hand-off. Draws app → logs+metrics+traces → dashboard → alert</tspan></text><rect x="773" y="78" width="747" height="303" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="773" y="78" width="7" height="303" rx="0" fill="#16a34a"/><circle cx="801" cy="100" r="12" fill="#16a34a"/><text x="801" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="819" y="105" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Minimal setup / sample</text><text x="789" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Configure once; point at a real line.</tspan></text><rect x="787" y="146" width="719" height="187" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="797" y="164" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># flow</text><text x="797" y="180" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># App (OTel) → collector → Grafana/CloudWatch</text><text x="797" y="196" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># Alert on error ratio → trace id → SQL span</text><text x="791" y="357" fill="#166534" font-size="11" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Three signals, one investigation path.</text><rect x="16" y="391" width="747" height="303" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="391" width="7" height="303" rx="0" fill="#4f46e5"/><circle cx="44" cy="413" r="12" fill="#4f46e5"/><text x="44" y="417" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="62" y="418" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The trap vs the fix</text><text x="32" y="433" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Preferred form vs the interview trap.</tspan></text><rect x="30" y="459" width="354" height="223" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="38" y="477" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  We have logging</text><text x="38" y="499" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="38" dy="0">We log exceptions.</tspan></text><rect x="394" y="459" width="354" height="223" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="477" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="402" y="499" fill="#14532d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-ser