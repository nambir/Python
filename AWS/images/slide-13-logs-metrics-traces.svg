 font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Alert</text><text x="801" y="588" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Page on SLO burn, not </text><rect x="1029" y="459" width="234" height="223" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="1037" y="475" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice</text><text x="1037" y="493" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Explain Logs with </text><text x="1037" y="507" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Compare Metrics wi</text><text x="1037" y="521" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Answer the Intervi</text><rect x="1272" y="459" width="234" height="223" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="1280" y="475" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">C# map</text><text x="1280" y="493" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• API Gateway</text><text x="1286" y="507" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">reverse proxy + JWT</text><text x="1280" y="520" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• ECS task</text><text x="1286" y="534" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">one process recipe</text><text x="1280" y="547" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• ECS service</text><