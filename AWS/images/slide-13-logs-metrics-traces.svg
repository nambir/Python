s-serif">↓</text><rect x="787" y="887" width="719" height="51" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="799" y="909" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Traces</text><text x="799" y="924" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Gateway → API → SQL spans.</text><text x="1146" y="944" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="787" y="945" width="719" height="51" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="799" y="966" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Alert</text><text x="799" y="982" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Page on SLO burn, not every 500.</text>
