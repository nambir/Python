<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><text x="768" y="28" fill="#1e3a5f" font-size="24" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Logs, Metrics, Traces  –  Visual Guide</text><text x="768" y="48" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">AWS · W13  ·  Why this request. How many hurt. Which hop.</text><rect x="16" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="38" cy="80" r="11" fill="#2563eb"/><text x="38" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="56" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Three signals</text><rect x="28" y="98" width="469" height="28" rx="8" fill="#dbeafe"/><text x="38" y="117" fill="#1e40af" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Logs = this request. Metrics = how many. Traces = which hop.</text><rect x="28" y="130" width="469" height="57" rx="8" fill="#4f46e5"/><text x="40" y="154" fill="#fff" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Traces</text><text x="40" y="174" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">which hop is slow — Gateway → API → SQL</text><rect x="28" y="193" width="451" height="57" rx="8" fill="#2563eb"/><text x="40" y="217" fill="#fff" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Metrics</text><text x="40" y="237" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">how many users hurt — RPS, errors, p95</text><rect x="28" y="257" width="432" height="57" rx="8" fill="#64748b"/><text x="40" y="281" fill="#fff" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Logs</text><text x="40" y="300" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">why THIS request failed — structured + trace id</text><rect x="521" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><circle cx="543" cy="80" r="11" fill="#16a34a"/><text x="543" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="561" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How a record travels</text><rect x="533" y="98" width="469" height="28" rx="8" fill="#dcfce7"/><text x="543" y="117" fill="#166534" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">App emits. Collector ships. Glass shows all three.</text><rect x="533" y="150" width="138" height="48" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.6"/><text x="602" y="182" fill="#1e40af" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">App OTel</text><line x1="673" y1="174" x2="697" y2="174" stroke="#1e40af" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="699" y="150" width="138" height="48" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="768" y="182" fill="#166534" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">collector</text><line x1="839" y1="174" x2="863" y2="174" stroke="#1e40af" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="865" y="150" width="138" height="48" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.6"/><text x="934" y="182" fill="#9a3412" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Grafana / CW</text><text x="533" y="220" fill="#475569" font-size="11" 