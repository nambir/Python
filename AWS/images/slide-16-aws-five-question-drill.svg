<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#7c3aed"/><text x="28" y="36" fill="#7c3aed" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">AWS  ·  W16  ·  drill</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">AWS Five-Question Drill</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">Drill Gateway, ECS, and IAM/WAF. If you did not run AWS day-to-day, be honest about what you used vs what the platform team owned.</tspan></text><rect x="28" y="140" width="1480" height="140" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><circle cx="80" cy="210" r="28" fill="#7c3aed"/><text x="80" y="218" fill="#fff" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="130" y="188" fill="#1e40af" font-size="20" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What is it?</text><text x="130" y="222" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="130" dy="0">What: runs our API containers. Where: Device service. Why: not a long-lived EC2 pet. How: task def + service +</tspan><tspan x="130" dy="20">ALB. Problem: rolling deploy without downtime.</tspan></text><rect x="28" y="296" width="1480" height="140" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="2"/><circle cx="80" cy="366" r="28" fill="#7c3aed"/><text x="80" y="374" fill="#fff" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="130" y="344" fill="#166534" font-size="20" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Where did you use it?</text><text x="130" y="378" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="130" dy="0">Public door, JWT, route to Device.</tspan></text><rect x="28" y="452" width="1480" height="140" rx="14" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><circle cx="80" cy="522" r="28" fill="#7c3aed"/><text x="80" y="530" fill="#fff" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="130" y="500" fill="#9a3412" font-size="20" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Why that choice?</text><text x="130" y="534" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="130" dy="0">Task role to S3 prefix, no keys in Angular.</tspan></text><rect x="28" y="608" width="1480" height="140" rx="14" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><circle cx="80" cy="678" r="28" fill="#7c3aed"/><text x="80" y="686" fill="#fff" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="130" y="656" fill="#854d0e" font-size="20" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How do you prove it?</text><text x="130" y="690" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="130" dy="0">Awareness only unless true.</tspan></text><rect x="28" y="764" width="1480" height="140" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><circle cx="80" cy="834" r="28" fill="#7c3aed"/><text x="80" y="842" fill="#fff" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="130" y="812" fill="#1e40af" font-size="20" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What would you not claim?</text><text x="130" y="846" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="130" dy="0">Answers all five for ECS without stalling</tspan></text>
</svg>
