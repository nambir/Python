t-family="Segoe UI,Arial,sans-serif">Why</text><rect x="114" y="543" width="552" height="56" rx="10" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/><text x="124" y="561" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How / evidence</text><rect x="773" y="391" width="747" height="303" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="773" y="391" width="7" height="303" rx="0" fill="#2563eb"/><circle cx="801" cy="413" r="12" fill="#2563eb"/><text x="801" y="417" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="819" y="418" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When A vs when B</text><text x="789" y="433" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Pick a path with a project example.</tspan></text><polygon points="1146,467 1216,507 1146,547 1076,507" fill="#fef9c3" stroke="#b45309" stroke-width="1.8"/><text x="1146" y="511" fill="#b45309" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Which?</text><rect x="787" y="559" width="345" height="115" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><rect x="1161" y="559" width="345" height="115" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="797" y="581" fill="#1e40af" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ECS</text><text x="797" y="603" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="797" dy="0">What: runs our API containers. Where:</tspan><tspan x="797" dy="13">Device service. Why: not a long-lived EC2</tspan><tspan x="797" dy="13">pet. How: task def + service + ALB.</tspan><tspan x="797" dy="13">Problem: rolling depl