<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#4338ca"/><text x="28" y="36" fill="#4338ca" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">AWS  ·  W01  ·  swimlane</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">API Gateway</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">API Gateway is the public front door: HTTPS, routing to services, auth at the edge, throttling. It is not the microservice. Draw Angular → Gateway →</tspan><tspan x="28" dy="17">.NET API.</tspan></text><rect x="28" y="150" width="1480" height="150" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><rect x="28" y="150" width="220" height="150" rx="14" fill="#4338ca"/><text x="138" y="238" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Angular</text><text x="270" y="200" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="270" dy="0">One hostname, TLS, rate limits, API keys/JWT authorizers, hide internal URLs.</tspan></text><text x="140" y="316" fill="#4338ca" font-size="18" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="28" y="318" width="1480" height="150" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="2"/><rect x="28" y="318" width="220" height="150" rx="14" fill="#4338ca"/><text x="138" y="406" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">API Gateway</text><text x="270" y="368" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="270" dy="0">Path /devices/** to the Device service integration (HTTP/NLB/ALB).</tspan></text><text x="140" y="484" fill="#4338ca" font-size="18" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="28" y="486" width="1480" height="150" rx="14" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><rect x="28" y="486" width="220" height="150" rx="14" fill="#4338ca"/><text x="138" y="574" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">.NET on ECS</text><text x="270" y="536" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="270" dy="0">JWT/Cognito authorizer at the gateway plus [Authorize] on the API — defense in depth.</tspan></text><text x="140" y="652" fill="#4338ca" font-size="18" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="28" y="654" width="1480" height="150" rx="14" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><rect x="28" y="654" width="220" height="150" rx="14" fill="#4338ca"/><text x="138" y="742" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">SQL</text><text x="270" y="704" fill="#0f172a" font-size="16" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="270" dy="0">Payload size, timeouts. Large files should not stream through every hop (see .NET D67).</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Connects the gateway to their Angular → .NET flow, not a product brochure</tspan></text>
</svg>
