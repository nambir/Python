<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#166534"/><text x="28" y="36" fill="#166534" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">AWS  ·  W10  ·  zigzag</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Scale-Out When Traffic Spikes</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">Scale-out adds instances. The app must be stateless (session in Redis/SQL, not in memory). The database, connection pool, and downstream APIs become</tspan><tspan x="28" dy="17">the next bottleneck.</tspan></text><rect x="80" y="150" width="680" height="150" rx="16" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><circle cx="120" cy="225" r="24" fill="#166534"/><text x="120" y="232" fill="#fff" font-size="18" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="160" y="205" fill="#1e40af" font-size="20" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Spike</text><text x="160" y="238" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="160" dy="0">Traffic → Gateway/ALB → more ECS tasks (CPU/ALB</tspan><tspan x="160" dy="17">request count).</tspan></text><line x1="420" y1="300" x2="1120" y2="318" stroke="#166534" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="780" y="330" width="680" height="150" rx="16" fill="#dcfce7" stroke="#166534" stroke-width="2"/><circle cx="820" cy="405" r="24" fill="#166534"/><text x="820" y="412" fill="#fff" font-size="18" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="860" y="385" fill="#166534" font-size="20" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ALB</text><text x="860" y="418" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="860" dy="0">No sticky in-memory session.</tspan></text><line x1="1120" y1="480" x2="420" y2="498" stroke="#166534" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="510" width="680" height="150" rx="16" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><circle cx="120" cy="585" r="24" fill="#166534"/><text x="120" y="592" fill="#fff" font-size="18" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="160" y="565" fill="#9a3412" font-size="20" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">More tasks</text><text x="160" y="598" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="160" dy="0">More tasks = more connections. Cap pools;</tspan><tspan x="160" dy="17">consider replicas for reads.</tspan></text><line x1="420" y1="660" x2="1120" y2="678" stroke="#166534" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="780" y="690" width="680" height="150" rx="16" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><circle cx="820" cy="765" r="24" fill="#166534"/><text x="820" y="772" fill="#fff" font-size="18" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="860" y="745" fill="#854d0e" font-size="20" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">DB / pool next</text><text x="860" y="778" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="860" dy="0">Workers scale on queue depth, not only CPU.</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Walks horizontal scale and names the first bottleneck after adding tasks</tspan></text>
</svg>
