<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Amazon Cognito  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">AWS  ·  W03  ·  Cognito User Pools authenticate people and issue JWTs. The API (or Gateway authorizer) validates those tokens.</text><rect x="16" y="78" width="495" height="460" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="78" width="7" height="460" rx="0" fill="#4f46e5"/><circle cx="44" cy="100" r="12" fill="#4f46e5"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How the pieces connect</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Name each box, then the hand-off.</tspan></text><rect x="30" y="146" width="109" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="85" y="174" fill="#1e40af" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="85" dy="0">User pool</tspan></text><line x1="139" y1="178" x2="149" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="149" y="146" width="109" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="204" y="174" fill="#166534" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="204" dy="0">JWT</tspan></text><line x1="258" y1="178" x2="268" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="268" y="146" width="109" height="64" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="323" y="174" fill="#9a3412" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="323" dy="0">Gateway / API</tspan></text><line x1="378" y1="178" x2="388" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="388" y="146" width="109" height="64" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="442" y="174" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="442" dy="0">Or name real</tspan><tspan x="442" dy="13">IdP</tspan></text><text x="30" y="226" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">Name each box, then the hand-off. If unused, says so and maps the</tspan><tspan x="30" dy="13">same idea to the real IdP</tspan></text><rect x="521" y="78" width="495" height="460" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="521" y="78" width="7" height="460" rx="0" fill="#7c3aed"/><circle cx="549" cy="100" r="12" fill="#7c3aed"/><text x="549" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="567" y="105" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Numbers / interview drill</text><text x="537" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">What / where / why / how.</tspan></text><rect x="535" y="146" width="229" height="186" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="545" y="164" fill="#1e40af" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">1</text><text x="545" y="184" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">User pool</text><text x="545" y="204" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="545" dy="0">Users, password/MFA, hosted</tspan><tspan x="545" dy="12">UI or custom Angular login</tspan><tspan x="545" dy="12">against Cognito endpoints.</tspan></text><rect x="772" y="146" width="229" height="186" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="782" y="164" fill="#166534" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">2</text><text x="782" y="184" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Tokens</text><text x="782" y="204" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="782" dy="0">ID token (who), access token</tspan><tspan x="782" dy="12">(APIs), refresh token.</tspan></text><rect x="535" y="340" width="229" height="186" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="545" y="358" fill="#9a3412" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">3</text><text x="545" y="378" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Integration</text><text x="545" y="398" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="545" dy="0">Angular stores access token;</tspan><tspan x="545" dy="12">Gateway or .NET JWT bearer</tspan><tspan x="545" dy="12">uses the Cognito issuer.</tspan></text><rect x="772" y="340" width="229" height="186" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="782" y="358" fill="#854d0e" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-