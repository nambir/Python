art" font-family="Segoe UI,Arial,sans-serif">What contains what</text><text x="789" y="747" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Outer box owns the inner ones.</tspan></text><rect x="787" y="773" width="719" height="223" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="797" y="791" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">WAF</text><rect x="815" y="801" width="663" height="168" rx="10" fill="#bfdbfe" stroke="#1e40af" stroke-width="1.5"/><text x="825" y="819" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">TLS / Gateway</text><rect x="843" y="828" width="607" height="112" rx="10" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/><text x="853" y="846" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">[Authorize]</text><rect x="871" y="856" width="552" height="56" rx="10" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/><text x="881" y="874" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">IAM on AWS APIs</text>
