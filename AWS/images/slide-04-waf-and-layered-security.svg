<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">WAF and Layered Security  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">AWS  ·  W04  ·  WAF filters malicious HTTP (SQLi/XSS patterns, bad bots) in front of public endpoints. It does not replace JWT</text><rect x="16" y="78" width="747" height="303" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="16" y="78" width="7" height="303" rx="0" fill="#7c3aed"/><circle cx="44" cy="100" r="12" fill="#7c3aed"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Inside the system</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Top to bottom, then the hand-off.</tspan></text><rect x="30" y="146" width="719" height="51" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="42" y="168" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">WAF</text><text x="42" y="183" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Edge rules, rate-based rules, managed rule group</text><text x="390" y="202" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="30" y="203" width="719" height="51" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="42" y="225" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Gateway / TLS</text><text x="42" y="240" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">HTTPS only, throttling, authorizers.</text><text x="390" y="260" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="30" y="261" width="719" height="51" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="42" y="282" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">API</text><text x="42" y="298" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">JWT validation, roles, input validation.</text><text x="390" y="317" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="30" y="318" width="719" height="51" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="42" y="340" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">IAM</text><text x="42" y="355" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Who can deploy and who can assume the task role.</text><rect x="773" y="78" width="747" height="303" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="773" y="78" width="7" height="303" rx="0" fill="#ea580c"/><circle cx="801" cy="100" r="12" fill="#ea580c"/><text x="801" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="819" y="105" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How the pieces connect</text><text x="789" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Name each box, then the hand-off.</tspan></text><rect x="787" y="146" width="172" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="873" y="174" fill="#1e40af" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="873" dy="0">WAF</tspan></text><line x1="959" y1="178" x2="969" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="969" y="146" width="172" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="1055" y="174" fill="#166534" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="1055" dy="0">TLS / Gateway</tspan></text><line x1="1142" y1="178" x2="1152" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1152" y="146" width="172" height="64" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="1238" y="174" fill="#9a3412" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="1238" dy="0">[Authorize]</tspan></text><line x1="1324" y1="178" x2="1334" y2="178" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1334" y="146" width="172" height="64" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="1420" y="174" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="1420" dy="0">IAM on AWS APIs</tspan></text><text x="787" y="226" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="787" dy="0">Name each box, then the hand-off. Names three layers: WAF, Gateway/auth, API authorization</tspan></text><rect x="16" y="391" width="747" height="303" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="391" width="7" height="303" rx="0" fill="#dc2626"/><circle cx="44" cy="413" r="12" fill="#dc2626"/><text x="44" y="417" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="62" y="418" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The trap vs the fix</text><text x="32" y="433" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Preferred form vs the interview trap.</tspan></text><rect x="30" y="459" width="354" height="223" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="38" y="477" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  WAF is enough</text><text x="38" y="499" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="38" dy="0">We have WAF so the API is secure.</tspan></text><rect x="394" y="459" width="354" height="223" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="477" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="402" y="499" fill="#14532d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="402" dy="0">WAF + TLS + JWT + app authorization + IAM.</tspan></text><rect x="773" y="391" width="747" height="303" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="773" y="391" width="7" height="303" rx="0" fill="#2563eb"/><circle cx="801" cy="413" r="12" fill="#2563eb"/><text x="801" y="417" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="819" y="418" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice, C#, remember</text><text x="789" y="433" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Recite practice, then the C# cousin.</tspan></text><rect x="787" y="459" width="234" height="223" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="795" y="475" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><text x="795" y="493" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• WAF</text><text x="801" y="507" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Edge rules, rate-based</text><text x="795" y="520" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Gateway / TLS</text><text x="801" y="534" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">HTTPS only, throttling</text><text x="795" y="547" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• API</text><text x="801" y="561" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">JWT validation, roles,</text><text x="795" y="574" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• IAM</text><text x="801" y="588" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Who can deploy and who</text><rect x="1029" y="459" width="234" height="223" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="1037" y="475" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice</text><text x="1037" y="493" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Explain WAF with a</text><text x="1037" y="507" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Compare Gateway / </text><text x="1037" y="521" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Answer the Intervi</text><rect x="1272" y="459" width="234" height="223" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="1280" y="475" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">C# map</text><text x="1280" y="493" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• API Gateway</text><text x="1286" y="507" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">reverse proxy + JWT</text><text x="1280" y="520" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• ECS task</text><text x="1286" y="534" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">one process recipe</text><text x="1280" y="547" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• ECS service</text><text x="1286" y="561" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">desired replica count</text><text x="1280" y="574" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• IAM role</text><text x="1286" y="588" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">task identity — not th</text><rect x="16" y="705" width="747" height="303" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="16" y="705" width="7" height="303" rx="0" fill="#16a34a"/><ci