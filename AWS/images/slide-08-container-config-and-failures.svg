ns-serif"><tspan x="40" dy="0">ASPNETCORE_ENVIRONMENT, API URLs — non-secret env.</tspan></text><text x="808" y="268" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Secrets</text><text x="808" y="290" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="808" dy="0">Secrets Manager / SSM → task definition secrets.</tspan></text><rect x="16" y="298" width="495" height="355" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="298" width="7" height="355" rx="0" fill="#4f46e5"/><circle cx="44" cy="320" r="12" fill="#4f46e5"/><text x="44" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="62" y="325" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How the pieces connect</text><text x="32" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Name each box, then the hand-off.</tspan></text><rect x="30" y="366" width="109" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="85" y="394" fill="#1e40af" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="85" dy="0">Env / secrets</tspan></text><line x1="139" y1="398" x2="149" y2="398" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="149" y="366" width="109" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="204" y="394" fill="#166534" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="204" dy="0">New revision</tspan></text><line x1="258" y1="398" x2="268" y2="398" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="268" y="366" width="109" height="64" rx="8" fill="