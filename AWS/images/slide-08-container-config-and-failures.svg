<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><text x="768" y="28" fill="#1e3a5f" font-size="24" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Container Config and Failures  –  Visual Guide</text><text x="768" y="48" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">AWS · W08  ·  Env vs secrets. Stopped reason first — never restart blindly.</text><rect x="16" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="38" cy="80" r="11" fill="#2563eb"/><text x="38" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="56" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How config gets in</text><rect x="28" y="98" width="469" height="28" rx="8" fill="#dbeafe"/><text x="38" y="117" fill="#1e40af" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Env for non-secrets. Platform injects secrets.</text><rect x="28" y="130" width="229" height="184" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="40" y="152" fill="#1e40af" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Env (not secret)</text><circle cx="42" cy="186" r="4" fill="#2563eb"/><text x="52" y="182" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="52" dy="0">ASPNETCORE_ENVIRONMENT</tspan></text><circle cx="42" cy="214" r="4" fill="#2563eb"/><text x="52" y="210" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="52" dy="0">public API URLs</tspan></text><circle cx="42" cy="242" r="4" fill="#2563eb"/><text x="52" y="238" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="52" dy="0">feature flags</tspan></text><rect x="269" y="130" width="229" height="184" rx="10" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.6"/><text x="281" y="152" fill="#854d0e" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Secrets (injected)</text><circle cx="283" cy="186" r="4" fill="#ca8a04"/><text x="293" y="182" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="293" dy="0">Secrets Manager /</tspan><tspan x="293" dy="15">SSM</tspan></text><circle cx="283" cy="230" r="4" fill="#ca8a04"/><text x="293" y="226" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="293" dy="0">connection strings</tspan></text><circle cx="283" cy="258" r="4" fill="#ca8a04"/><text x="293" y="254" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="293" dy="0">never baked in</tspan><tspan x="293" dy="15">image</tspan></text><rect x="521" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><circle cx="543" cy="80" r="11" fill="#16a34a"/><text x="543" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="561" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How a new version lands</text><rect x="533" y="98" width="469" height="28" rx="8" fill="#dcfce7"/><text x="543" y="117" fill="#166534" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Rolling deploy. Health is the gate.</text><text x="533" y="138" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Rolling: new tasks in, old out</text><rect x="533" y="170" width="96" height="48" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.6"/><text x="581" y="202" fill="#1e40af" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">rev N health</text><line x1="632" y1="194" x2="656" y2="194" stroke="#1e40af" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="658" y="170" width="96" height="48" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="706" y="202" fill="#166534" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">start N+1</text><line x1="756" y1="194" x2="780" y2="194" stroke="#1e40af" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="782" y="170" width="96" height="48" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.6"/><text x="830" y="202" fill="#9a3412" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">ALB /health</text><line x1="880" y1="194" x2="904" y2="194" stroke="#1e40af" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="906" y="170" width="96" height="48" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.6"/><text x="954" y="202" fill="#854d0e" font-size="13" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">drain old</text><rect x="533" y="288" width="469" height="22" rx="6" fill="#dcfce7"/><text x="541" y="304" fill="#166534" font-size="11" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Circuit: if health fails, the roll stops. That is a feature.</text><rect x="1027" y="58" width="493" height="268" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="1049" cy="80" r="11" fill="#4f46e5"/><text x="1049" y="84" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1067" y="85" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Three failures you name</text><rect x="1039" y="98" width="469" height="28" rx="8" fill="#ede9fe"/><text x="1049" y="117" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Pull, crash, unhealthy — different fixes.</text><rect x="1039" y="130" width="469" height="57" rx="8" fill="#1e3a5f"/><text x="1051" y="154" fill="#fff" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">1  cannot pull image</text><text x="1051" y="174" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ECR / task execution role</text><rect x="1039" y="193" width="451" height="57" rx="8" fill="#dc2626"/><text x="1051" y="217" fill="#fff" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">2  crash on startup</text><text x="1051" y="237" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">missing secret / bad connection string</text><rect x="1039" y="257" width="432" height="57" rx="8" fill="#ea580c"/><text x="1051" y="281" fill="#fff" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">3  ALB unhealthy</text><text x="1051" y="300" fill="#f8fafc" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">wrong port or /health path</text><rect x="16" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="38" cy="360" r="11" fill="#7c3aed"/><text x="38" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="56" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Stopped reason first</text><rect x="28" y="378" width="722" height="28" rx="8" fill="#f3e8ff"/><text x="38" y="397" fill="#6b21a8" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The console already told you why.</text><rect x="28" y="410" width="722" height="184" rx="8" fill="#0f172a"/><text x="40" y="436" fill="#86efac" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">$ aws ecs describe-tasks …</text><text x="40" y="468" fill="#fca5a5" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">stoppedReason: CannotPullContainerError</text><text x="40" y="500" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">exit code: 1</text><text x="40" y="532" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># then CloudWatch logs for that task id</text><text x="40" y="564" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># then target health on the ALB</text><rect x="774" y="338" width="746" height="268" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="796" cy="360" r="11" fill="#ea580c"/><text x="796" y="364" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="814" y="365" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The interview trap</text><rect x="786" y="378" width="722" height="28" rx="8" fill="#ffedd5"/><text x="796" y="397" fill="#9a3412" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Reboot is not a diagnosis.</text><rect x="786" y="410" width="356" height="184" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><circle cx="800" cy="426" r="8" fill="#dc2626"/><text x="800" y="430" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="814" y="431" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Restart until it works</text><rect x="796" y="446" width="336" height="138" rx="6" fill="#fff" stroke="#fecaca" stroke-width="1"/><text x="804" y="474" fill="#7f1d1d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="804" dy="0">Stop the task a few times.</tspan></text><rect x="1152" y="410" width="356" height="184" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><circle cx="1166" cy="426" r="8" fill="#16a34a"/><text x="1166" y="430" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="1180" y="431" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Read, then fix</text><rect x="1162" y="446" width="336" height="138" rx="6" fill="#fff" stroke="#bbf7d0" stroke-width="1"/><text x="1170" y="474" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1170" dy="0">Stopped reason + logs</tspan></text><text x="1170" y="537" fill="#14532d" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1170" dy="0">+ health check, then change</tspan></text><rect x="16" y="618" width="1504" height="398" rx="12" fill="#fff" stroke="#e11d48" stroke-width="1.5"/><circle cx="38" cy="640" r="11" fill="#e11d48"/><text x="38" y="644" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="56" y="645" fill="#1e3a5f" font-size="15" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Recite, trap &amp; C#</text><rect x="28" y="658" width="1480" height="28" rx="8" fill="#ffe4e6"/><text x="38" y="677" fill="#9f1239" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Stopped reason first.</text><rect x="28" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#fda4af" stroke-width="1.5"/><text x="40" y="710" fill="#9f1239" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Order</text><rect x="40" y="718" width="453" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="750" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># 1 stopped reason</text><text x="50" y="800" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># 2 CloudWatch for that task</text><rect x="40" y="851" width="453" height="129" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="50" y="883" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># 3 target health / port</text><text x="50" y="932" fill="#16a34a" font-size="12" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># 4 execution role / secret</text><rect x="525" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#86efac" stroke-width="1.5"/><text x="537" y="714" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do</text><circle cx="545" cy="747" r="7" fill="#16a34a"/><text x="545" y="751" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="559" y="741" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Stopped reason first</tspan></text><circle cx="545" cy="810" r="7" fill="#16a34a"/><text x="545" y="814" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✓</text><text x="559" y="804" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Name env vs secrets</tspan></text><text x="537" y="857" fill="#b91c1c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><circle cx="545" cy="889" r="7" fill="#dc2626"/><text x="545" y="893" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="559" y="883" fill="#7f1d1d" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Restart blindly</tspan></text><circle cx="545" cy="952" r="7" fill="#dc2626"/><text x="545" y="956" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">✕</text><text x="559" y="946" fill="#7f1d1d" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="559" dy="0">Bake passwords in the image</tspan></text><rect x="1023" y="690" width="485" height="314" rx="10" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/><text x="1035" y="710" fill="#6d28d9" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Quick C# comparison</text><rect x="1035" y="718" width="461" height="26" rx="4" fill="#f3e8ff" stroke="#cbd5e1" stroke-width="1"/><text x="1043" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Concept</text><text x="1196" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">C#</text><text x="1350" y="736" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">AWS</text><rect x="1035" y="744" width="461" height="62" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Config</tspan></text><text x="1196" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">IOptions / env</tspan></text><text x="1350" y="768" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">task env</tspan></text><rect x="1035" y="806" width="461" height="62" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Secrets</tspan></text><text x="1196" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">KeyVault</tspan></text><text x="1350" y="830" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">SSM / Secrets Manager</tspan></text><rect x="1035" y="868" width="461" height="62" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Health</tspan></text><text x="1196" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">/health</tspan></text><text x="1350" y="892" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">ALB target health</tspan></text><rect x="1035" y="930" width="461" height="62" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="1043" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1043" dy="0">Fail</tspan></text><text x="1196" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1196" dy="0">Event Log</tspan></text><text x="1350" y="954" fill="#0f172a" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif"><tspan x="1350" dy="0">stopped reason + logs</tspan></text>
</svg>
