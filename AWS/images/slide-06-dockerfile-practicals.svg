<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Dockerfile Practicals  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">AWS  ·  W06  ·  A Dockerfile is the recipe. For .NET, a SDK stage builds, a runtime stage runs — smaller, fewer secrets. Do no</text><rect x="16" y="78" width="495" height="460" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="78" width="7" height="460" rx="0" fill="#dc2626"/><circle cx="44" cy="100" r="12" fill="#dc2626"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Minimal setup / sample</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Configure once; point at a real line.</tspan></text><rect x="30" y="146" width="467" height="344" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="40" y="164" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build</text><text x="40" y="180" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">WORKDIR /src</text><text x="40" y="196" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">COPY . .</text><text x="40" y="212" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">RUN dotnet publish -c Release -o /out</text><text x="40" y="228" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">FROM mcr.microsoft.com/dotnet/aspnet:8.0</text><text x="40" y="244" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">WORKDIR /app</text><text x="40" y="260" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">COPY --from=build /out .</text><text x="40" y="276" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace">EXPOSE 8080</text><text x="34" y="514" fill="#166534" font-size="11" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SDK builds, runtime runs; secrets stay out.</text><rect x="521" y="78" width="495" height="460" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="521" y="78" width="7" height="460" rx="0" fill="#2563eb"/><circle cx="549" cy="100" r="12" fill="#2563eb"/><text x="549" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="567" y="105" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The trap vs the fix</text><text x="537" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Preferred form vs the interview trap.</tspan></text><rect x="535" y="146" width="228" height="380" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="543" y="164" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Secrets in the image</text><text x="543" y="186" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="543" dy="0">COPY appsettings.Production.json</tspan><tspan x="543" dy="13">with passwords</tspan></text><rect x="773" y="146" width="228" height="380" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="781" y="164" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="781" y="186" fill="#14532d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="781" dy="0">Secrets from the platform; image</tspan><tspan x="781" dy="13">only has code.</tspan></text><rect x="1025" y="78" width="495" height="460" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="1025" y="78" width="7" height="460" rx="0" fill="#16a34a"/><circle cx="1053" cy="100" r="12" fill="#16a34a"/><text x="1053" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="1071" y="105" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice, C#, remember</text><text x="1041" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Recite practice, then the C# cousin.</tspan></text><rect x="1039" y="146" width="150" height="380" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="1047" y="162" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><text x="1047" y="180" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Multi-stage</text><text x="1053" y="194" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">dotnet publish in sdk </text><text x="1047" y="207" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• EXPOSE</text><text x="1053" y="221" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Documents the port; EC</text><text x="1047" y="234" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• ENV</text><text x="1053" y="248" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Non-secret defaults; s</text><text x="1047" y="261" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• User</text><text x="1053" y="275" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Run as non-root when t</text><rect x="1198" y="146" width="150" height="380" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="1206" y="162" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice</text><text x="1206" y="180" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Explain Multi-stag</text><text x="1206" y="194" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Compare EXPOSE wit</text><text x="1206" y="208" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Answer the Intervi</text><rect x="1356" y="146" width="150" height="380" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="1364" y="162" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">C# map</text><text x="1364" y="180" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• API Gateway</text><text x="1370" y="194" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">reverse proxy + JWT</text><text x="1364" y="207" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• ECS task</text><text x="1370" y="221" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">one process recipe</text><text x="1364" y="234" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• ECS service</text><text x="1370" y="248" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">desired replica count</text><text x="1364" y="261" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• IAM role</text><text x="1370" y="275" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">task identity — not th</text><rect x="16" y="548" width="495" height="460" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="548" width="7" height="460" rx="0" fill="#4f46e5"/><circle cx="44" cy="570" r="12" fill="#4f46e5"/><text x="44" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="62" y="575" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Good practice</text><text x="32" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Do / don't you can recite.</tspan></text><text x="30" y="628" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do</text><text x="30" y="648" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Explain Multi-stage with a project example.</text><text x="30" y="670" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Compare EXPOSE with an alternative.</text><text x="30" y="692" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Answer the Interview 5 for: Explains a multi-sta</text><text x="30" y="722" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><text x="30" y="744" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">✗ Secrets in the image — COPY appsettings.Production.json with</tspan><tspan x="30" dy="13">passwords</tspan></text><rect x="521" y="548" width="495" height="460" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="521" y="548" width="7" height="460" rx="0" fill="#7c3aed"/><circle cx="549" cy="570" r="12" fill="#7c3aed"/><text x="549" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="567" y="575" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Inside the system</text><text x="537" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Top to bottom, then the hand-off.</tspan></text><rect x="535" y="616" width="467" height="90" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="547" y="654" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Multi-stage</text><text x="547" y="681" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">dotnet publish in sdk image; copy output into as</text><text x="768" y="712" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="535" y="712" width="467" height="90" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="547" y="751" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">EXPOSE</text><text x="547" y="778" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Documents the port; ECS/ALB still maps it.</text><text x="768" y="808" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="535" y="809" width="467" height="90" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="547" y="847" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ENV</text><text x="547" y="874" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Non-secret defaults; secrets from the task defin</text><text x="768" y="904" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="535" y="906" width="467" height="90" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="547" y="944" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">User</text><text x="547" y="971" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Run as non-root when the base image allows it.</text><rect x="1025" y="548" width="495" height="460" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="1025" y="548" width="7" height="460" rx="0" fill="#ea580c"/><circle cx="1053" cy="570" r="12" fill="#ea580c"/><text x="1053" y="574" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="1071" y="575" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">What contains what</text><text x="1041" y="590" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Outer box owns the inner ones.</tspan></text><rect x="1039" y="616" width="467" height="380" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="1049" y="634" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SDK stage</text><rect x="1075" y="652" width="395" height="308" rx="10" fill="#bfdbfe" stroke="#1e40af" stroke-width="1.5"/><text x="1085" y="670" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Publish</text><rect x="1111" y="688" width="323" height="236" rx="10" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/><text x="1121" y="706" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Runtime image</text><rect x="1147" y="724" width="251" height="164" rx="10" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/><text x="1157" y="742" fill="#1e3a5f" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Secrets at run</text>
