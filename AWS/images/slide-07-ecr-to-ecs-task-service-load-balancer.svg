<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="8" rx="0" fill="#1d4ed8"/><text x="28" y="36" fill="#1d4ed8" font-size="14" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">AWS  ·  W07  ·  layers</text><text x="28" y="72" fill="#0f172a" font-size="32" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ECR to ECS Task, Service, Load Balancer</text><text x="28" y="96" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="28" dy="0">A task definition is the recipe (image, CPU, env, role). A task is a running copy. A service keeps N tasks healthy behind a load balancer.</tspan></text><rect x="28" y="140" width="1000" height="150" rx="16" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><circle cx="70" cy="215" r="22" fill="#1d4ed8"/><text x="70" y="221" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="110" y="188" fill="#1e40af" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ECR</text><text x="110" y="222" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="110" dy="0">Where the image lives.</tspan></text><text x="528" y="304" fill="#1d4ed8" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="28" y="308" width="1000" height="150" rx="16" fill="#dcfce7" stroke="#166534" stroke-width="2"/><circle cx="70" cy="383" r="22" fill="#1d4ed8"/><text x="70" y="389" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="110" y="356" fill="#166534" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Task definition</text><text x="110" y="390" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="110" dy="0">Image URI, port, env, IAM role, logs.</tspan></text><text x="528" y="472" fill="#1d4ed8" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="28" y="476" width="1000" height="150" rx="16" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><circle cx="70" cy="551" r="22" fill="#1d4ed8"/><text x="70" y="557" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="110" y="524" fill="#9a3412" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Service</text><text x="110" y="558" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="110" dy="0">Desired count, rolling deploy, attached to a target group.</tspan></text><text x="528" y="640" fill="#1d4ed8" font-size="20" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="28" y="644" width="1000" height="150" rx="16" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/><circle cx="70" cy="719" r="22" fill="#1d4ed8"/><text x="70" y="725" fill="#fff" font-size="16" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="110" y="692" fill="#854d0e" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ALB / Gateway</text><text x="110" y="726" fill="#475569" font-size="14" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="110" dy="0">Public or internal HTTP to the tasks.</tspan></text><rect x="1050" y="140" width="458" height="760" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="1070" y="180" fill="#1d4ed8" font-size="16" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">When / when not</text><rect x="1070" y="210" width="202" height="400" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="1084" y="236" fill="#b91c1c" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  ECS is Docker</text><text x="1084" y="260" fill="#7f1d1d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1084" dy="0">ECS is just Docker on AWS.</tspan></text><rect x="1286" y="210" width="202" height="400" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="1300" y="236" fill="#166534" font-size="14" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="1300" y="260" fill="#14532d" font-size="13" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1300" dy="0">ECS schedules tasks from a</tspan><tspan x="1300" dy="16">definition; the service keeps</tspan><tspan x="1300" dy="16">them behind a load balancer.</tspan></text><text x="1070" y="650" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1070" dy="0">Walks the full path and names task vs</tspan><tspan x="1070" dy="17">service</tspan></text><rect x="28" y="930" width="1480" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="44" y="958" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Say this</text><text x="44" y="978" fill="#713f12" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="44" dy="0">Walks the full path and names task vs service</tspan></text>
</svg>
