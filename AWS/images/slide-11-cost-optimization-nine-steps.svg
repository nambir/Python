<rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1536" height="6" rx="0" fill="#1e3a5f"/><text x="768" y="28" fill="#1e3a5f" font-size="26" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Cost Optimization — Nine Steps  –  Visual Guide</text><text x="768" y="52" fill="#475569" font-size="12" font-weight="500" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">AWS  ·  W11  ·  Interviewers ask how you would cut a variable-traffic legacy bill. They want a sequence, not a slogan.</text><rect x="16" y="78" width="1504" height="210" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="16" y="78" width="7" height="210" rx="0" fill="#ea580c"/><circle cx="44" cy="100" r="12" fill="#ea580c"/><text x="44" y="104" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1</text><text x="62" y="105" fill="#ea580c" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">How the pieces connect</text><text x="32" y="120" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Name each box, then the hand-off.</tspan></text><rect x="30" y="146" width="362" height="49" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="211" y="167" fill="#1e40af" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="211" dy="0">Measure</tspan></text><line x1="392" y1="171" x2="402" y2="171" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="402" y="146" width="362" height="49" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="582" y="167" fill="#166534" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="582" dy="0">Idle / size</tspan></text><line x1="763" y1="171" x2="773" y2="171" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="773" y="146" width="362" height="49" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="954" y="167" fill="#9a3412" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="954" dy="0">Autoscale</tspan></text><line x1="1134" y1="171" x2="1144" y2="171" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1144" y="146" width="362" height="49" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="1325" y="167" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"><tspan x="1325" dy="0">Then storage / logs</tspan></text><text x="30" y="211" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">Name each box, then the hand-off. Gives an engineering sequence, not “use Lambda”</tspan></text><rect x="16" y="298" width="495" height="355" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="16" y="298" width="7" height="355" rx="0" fill="#dc2626"/><circle cx="44" cy="320" r="12" fill="#dc2626"/><text x="44" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2</text><text x="62" y="325" fill="#dc2626" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Minimal setup / sample</text><text x="32" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Configure once; point at a real line.</tspan></text><rect x="30" y="366" width="467" height="239" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="40" y="384" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># 1 workload  2 utilization  3 idle/oversized</text><text x="40" y="400" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># 4 right-size  5 autoscale  6 serverless/containers fit</text><text x="40" y="416" fill="#0f172a" font-size="11" font-weight="500" text-anchor="start" font-family="Consolas,Menlo,monospace"># 7 storage/DB  8 network/logs  9 keep monitoring</text><text x="34" y="629" fill="#166534" font-size="11" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Nine steps; Lambda is not the first word.</text><rect x="521" y="298" width="495" height="355" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="521" y="298" width="7" height="355" rx="0" fill="#2563eb"/><circle cx="549" cy="320" r="12" fill="#2563eb"/><text x="549" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3</text><text x="567" y="325" fill="#2563eb" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">The trap vs the fix</text><text x="537" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="537" dy="0">Preferred form vs the interview trap.</tspan></text><rect x="535" y="366" width="228" height="275" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="543" y="384" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✗  Just use Lambda</text><text x="543" y="406" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="543" dy="0">Move everything to Lambda to</tspan><tspan x="543" dy="13">save money.</tspan></text><rect x="773" y="366" width="228" height="275" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="781" y="384" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Do this</text><text x="781" y="406" fill="#14532d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="781" dy="0">Nine-step sequence; Lambda is</tspan><tspan x="781" dy="13">one optional tool in step 6.</tspan></text><rect x="1025" y="298" width="495" height="355" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="1025" y="298" width="7" height="355" rx="0" fill="#16a34a"/><circle cx="1053" cy="320" r="12" fill="#16a34a"/><text x="1053" y="324" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4</text><text x="1071" y="325" fill="#16a34a" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice, C#, remember</text><text x="1041" y="340" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="1041" dy="0">Recite practice, then the C# cousin.</tspan></text><rect x="1039" y="366" width="150" height="275" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="1047" y="382" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remember</text><text x="1047" y="400" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• 1–3</text><text x="1053" y="414" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Understand the workloa</text><text x="1047" y="427" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• 4–6</text><text x="1053" y="441" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Right-size, autoscale,</text><text x="1047" y="454" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• 7–8</text><text x="1053" y="468" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Storage classes, unuse</text><text x="1047" y="481" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• 9</text><text x="1053" y="495" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Budgets, anomaly alert</text><rect x="1198" y="366" width="150" height="275" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="1206" y="382" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Practice</text><text x="1206" y="400" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Explain 1–3 with a</text><text x="1206" y="414" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Compare 4–6 with a</text><text x="1206" y="428" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• Answer the Intervi</text><rect x="1356" y="366" width="150" height="275" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="1364" y="382" fill="#1e3a5f" font-size="11" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">C# map</text><text x="1364" y="400" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• API Gateway</text><text x="1370" y="414" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">reverse proxy + JWT</text><text x="1364" y="427" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• ECS task</text><text x="1370" y="441" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">one process recipe</text><text x="1364" y="454" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• ECS service</text><text x="1370" y="468" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">desired replica count</text><text x="1364" y="481" fill="#0f172a" font-size="10" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">• IAM role</text><text x="1370" y="495" fill="#475569" font-size="9" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">task identity — not th</text><rect x="16" y="663" width="747" height="345" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="16" y="663" width="7" height="345" rx="0" fill="#4f46e5"/><circle cx="44" cy="685" r="12" fill="#4f46e5"/><text x="44" y="689" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5</text><text x="62" y="690" fill="#4f46e5" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Good practice</text><text x="32" y="705" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="32" dy="0">Do / don't you can recite.</tspan></text><text x="30" y="743" fill="#166534" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Do</text><text x="30" y="763" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Explain 1–3 with a project example.</text><text x="30" y="785" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Compare 4–6 with an alternative.</text><text x="30" y="807" fill="#14532d" font-size="11" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">✓  Answer the Interview 5 for: Gives an engineering</text><text x="30" y="837" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Don't</text><text x="30" y="859" fill="#7f1d1d" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">✗ Just use Lambda — Move everything to Lambda to save money.</tspan></text><rect x="773" y="663" width="747" height="345" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="773" y="663" width="7" height="345" rx="0" fill="#7c3aed"/><circle cx="801" cy="685" r="12" fill="#7c3aed"/><text x="801" y="689" fill="#fff" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6</text><text x="819" y="690" fill="#7c3aed" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Inside the system</text><text x="789" y="705" fill="#475569" font-size="11" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif"><tspan x="789" dy="0">Top to bottom, then the hand-off.</tspan></text><rect x="787" y="731" width="719" height="62" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="799" y="757" fill="#1e40af" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">1–3</text><text x="799" y="775" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Understand the workload, graph utilization, find</text><text x="1146" y="798" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="787" y="799" width="719" height="62" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="799" y="825" fill="#166534" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">4–6</text><text x="799" y="843" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Right-size, autoscale, pick containers vs server</text><text x="1146" y="866" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="787" y="866" width="719" height="62" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="799" y="892" fill="#9a3412" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">7–8</text><text x="799" y="911" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Storage classes, unused volumes, NAT/data transf</text><text x="1146" y="933" fill="#64748b" font-size="12" font-weight="800" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">↓</text><rect x="787" y="934" width="719" height="62" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="799" y="960" fill="#854d0e" font-size="13" font-weight="800" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">9</text><text x="799" y="979" fill="#475569" font-size="10" font-weight="500" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Budgets, anomaly alerts, keep watching.</text>
